# DOCUMENTATION ONLY. Cloudflare named Tunnel is remotely managed,
# ID b18c637f-2700-442a-a12e-b225c43dfc72.
# These ingress rules are already stored in the Cloudflare account through
# the Tunnel configuration API, but public DNS has NOT been switched.
# DO NOT deploy this YAML as the connector config: on KMJ-elite, provision
# the root-private token-file and use the remotely-managed cloudflared
# systemd service template instead. Never put the token in GitHub.
#
ingress:
  - hostname: kmjtechno.com
    service: https://127.0.0.1:443
    originRequest:
      originServerName: kmjtechno.com
      noTLSVerify: false
  - hostname: www.kmjtechno.com
    service: https://127.0.0.1:443
    originRequest:
      originServerName: www.kmjtechno.com
      noTLSVerify: false
  - hostname: staging.kmjtechno.com
    service: https://127.0.0.1:443
    originRequest:
      originServerName: staging.kmjtechno.com
      noTLSVerify: false
  - hostname: cloudos.kmjtechno.com
    service: https://127.0.0.1:443
    originRequest:
      originServerName: cloudos.kmjtechno.com
      noTLSVerify: false
  - hostname: tunnel-canary.kmjtechno.com
    service: https://127.0.0.1:443
    originRequest:
      originServerName: kmjtechno.com
      httpHostHeader: kmjtechno.com
      noTLSVerify: false
  - service: http_status:404
