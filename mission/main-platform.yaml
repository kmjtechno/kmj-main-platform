project: KMJ TECHNO Main Platform
repo: kmjtechno/kmj-main-platform
cloud_nexus_policy: untouched
source_of_truth: git
generative_ai_policy: cloud_only
local_llm_inference: prohibited
paid_ai_fallback: prohibited
unknown_cost_is_free: false
no_free_route_status: NO_FREE_ROUTE_AVAILABLE
production_requires_owner_approval: true
payment_gateway_configuration: deferred_by_owner
writer_policy: single_authoritative_writer
branding_policy:
  logo_identity: locked_approved_master_only
  product_visuals: authentic_evidence_only
  ai_or_cgi_looking_product_imagery: prohibited
  synthetic_product_ui_screenshots: prohibited
  real_product_screenshots_preferred: true
first_vertical_slice:
  - organization
  - product
  - entitlement
  - signed_sandbox_license
  - product_validation
  - revocation
