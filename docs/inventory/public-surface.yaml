version: 2
scope: kmj_main_platform
cloud_nexus: untouched
sources:
  routes:
    - apps/platform/routes/web.php
    - apps/platform/routes/settings.php
    - apps/platform/config/fortify.php
  assets: apps/platform/public/assets
  localization: apps/platform/app/Http/Middleware/HandleInertiaRequests.php
  facts:
    - README.md
    - apps/platform/KMJ_BOUNDARY.md

public_urls:
  - path: /
    access: public
    purpose: Main Platform welcome surface
    source: apps/platform/routes/web.php
  - path: /company
    access: public
    purpose: Company profile
    source: apps/platform/routes/web.php
  - path: /capabilities
    access: public
    purpose: KMJ capability overview
    source: apps/platform/routes/web.php
  - path: /products
    access: public
    purpose: Evidence-backed KMJ product portfolio
    source: apps/platform/routes/web.php
  - path: /products/{slug}
    access: public
    purpose: Product lifecycle, demo and commercial-status detail
    source: apps/platform/routes/web.php
  - path: /trust
    access: public
    purpose: Public trust, governance and product-evidence policy
    source: apps/platform/routes/web.php
  - path: /docs
    access: public
    purpose: Bilingual public documentation and authority map
    source: apps/platform/routes/web.php
  - path: /insights
    access: public
    purpose: Bilingual evidence-led engineering notes
    source: apps/platform/routes/web.php
  - path: /support
    access: public
    purpose: Bilingual account, licensing and security support guidance
    source: apps/platform/routes/web.php
  - path: /products/kmj-codebridge/terms
    access: public
    purpose: CodeBridge product terms
    source: apps/platform/routes/web.php
  - path: /products/kmj-codebridge/privacy
    access: public
    purpose: CodeBridge product privacy notice
    source: apps/platform/routes/web.php
  - path: /products/kmj-codebridge/support
    access: public
    purpose: CodeBridge product support surface
    source: apps/platform/routes/web.php
  - path: /legal
    access: public
    purpose: Legal center
    source: apps/platform/routes/web.php
  - path: /terms
    access: public
    purpose: Terms and conditions
    source: apps/platform/routes/web.php
  - path: /privacy
    access: public
    purpose: Privacy policy
    source: apps/platform/routes/web.php
  - path: /refund-policy
    access: public
    purpose: Refund policy
    source: apps/platform/routes/web.php
  - path: /acceptable-use
    access: public
    purpose: Acceptable use policy
    source: apps/platform/routes/web.php
  - path: /cookie-policy
    access: public
    purpose: Cookie policy
    source: apps/platform/routes/web.php
  - path: /llms.txt
    access: public
    purpose: AI-search-readable product and authority summary
    source: apps/platform/routes/web.php
  - path: /sitemap.xml
    access: conditional_public
    purpose: Search-engine URL inventory when public indexing is enabled
    source: apps/platform/routes/web.php
  - path: /login
    access: guest
    purpose: Account sign-in
    source: apps/platform/config/fortify.php
  - path: /register
    access: guest
    purpose: Account registration
    source: apps/platform/config/fortify.php
  - path: /forgot-password
    access: guest
    purpose: Password recovery request
    source: apps/platform/config/fortify.php
  - path: /reset-password/{token}
    access: guest
    purpose: Password reset completion
    source: apps/platform/config/fortify.php
  - path: /.well-known/passkey-endpoints
    access: public
    purpose: Passkey enrollment/manage discovery
    source: apps/platform/routes/settings.php

protected_control_surfaces:
  - /dashboard
  - /sandbox-licenses
  - /settings/profile
  - /settings/security
  - /settings/appearance

localization:
  supported:
    - en
    - hi
  current_switch_transport: query_parameter
  parameter: lang
  seo_path_locales_present: false
  resource_hreflang_alternates: true

public_assets:
  brand:
    - assets/brand/kmj-logo-horizontal.webp
    - assets/brand/kmj-logo-stacked.webp
    - assets/brand/kmj-mark.webp
    - assets/brand/kmj-mark-64.png
    - assets/brand/kmj-app-icon.png
    - assets/brand/kmj-social-card.webp
    - assets/brand/kmj-social-brand.webp
    - assets/brand/kmj-brand-pattern.webp
  products:
    - assets/products/kmj-agent.webp
    - assets/products/kmj-connect.webp
    - assets/products/kmj-brand-system.webp
    - assets/products/kmj-forge.webp
    - assets/products/kmj-licensing-hub.webp
    - assets/products/kmj-calibration.webp
    - assets/products/kmj-cloudos.webp
    - assets/products/kmj-creative-studio.webp
    - assets/products/kmj-cloud-nexus.webp
    - assets/products/kmj-cinema-platform.webp
    - assets/products/kmj-360-dome.webp
    - assets/products/kmj-cinema-player.webp

observed_gaps:
  - code: PUBLIC_FULL_COPY_LOCALIZATION_INCOMPLETE
    evidence: Documentation, insights and support now provide English/Hindi copy with hreflang query alternates; older public product, company, trust and legal surfaces still require full translated copy before site-wide hreflang can be truthful.

approved_facts:
  - Main Platform owns business, customer, product, licensing, release, and automation authority.
  - KMJ Cloud Nexus is separate and is not a Main Platform runtime dependency.
  - Git is the source of truth.
  - Generative AI is cloud-only; local LLM inference is prohibited.
  - Paid AI fallback is prohibited and unknown cost is not free.
  - Deterministic workflows remain usable when no verified-zero AI route exists.
  - Production deployment, DNS, billing, destructive database actions, and signing-key operations require explicit owner approval.
