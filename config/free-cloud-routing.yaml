policy:
  generative_ai: cloud_only
  local_llm: prohibited
  paid_fallback: prohibited
  unknown_cost_is_free: false
  no_route_status: NO_FREE_ROUTE_AVAILABLE
  router_transport: federated_verified_zero

providers:
  # Direct provider adapters are dormant until their API key exists.
  priority:
    - 9router
    - openrouter
    - groq
    - nvidia
    - zai
    - cerebras
    - gemini
    - mistral
    - ollama-cloud
    - kilo

verified_zero:
  # Models are discovered from configured providers and filtered by the strict-zero gate.
  # Keep this list conservative: only providers/models whose route is known
  # to be zero-cost may pass. Add changing providers through explicit review.
  trusted_prefixes:
    - "iflow/"
    - "qwen/"
    - "kiro/"
    - "opencode/"
  trusted_owners:
    - "iflow"
    - "qwen"
    - "kiro"
    - "opencode"
  # OpenRouter free auto-router is always zero-price; all other direct
  # providers must be explicitly verified as free-tier before use.
  explicit_models:
    - "openrouter/free"
  verified_free_provider_accounts: []

deny:
  model_fragments:
    - "paid"
    - "premium"
    - "pro-payg"

routes:
  fast:
    prefer:
      - "coder"
      - "flash"
      - "mini"
      - "qwen"
  coding:
    prefer:
      - "coder"
      - "code"
      - "qwen"
      - "deepseek"
      - "reason"
  deep:
    prefer:
      - "reason"
      - "thinking"
      - "deep"
      - "qwen"
  review:
    prefer:
      - "reason"
      - "coder"
      - "qwen"

failure_protocol:
  attempt_1: retry_same_route_with_evidence
  attempt_2: escalate_to_deep
  attempt_3: select_different_verified_zero_model_analysis_only
  attempt_4: circuit_breaker_and_report

agent:
  name: KMJ Main Platform Engineer
  scope_repo: kmjtechno/kmj-main-platform
  cloud_nexus: untouched
  writer_policy: single_authoritative_writer
  priorities:
    - organization
    - product
    - entitlement
    - signed_sandbox_license
    - product_validation
    - revocation
  high_risk_requires_owner_approval:
    - production
    - dns
    - billing
    - destructive_database
    - signing_keys
    - legal
