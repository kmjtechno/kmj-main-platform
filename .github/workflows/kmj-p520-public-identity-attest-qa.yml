name: KMJ P520 Owner Public Identity Attestation QA

on:
  pull_request:
    paths:
      - 'scripts/windows/P520-OFFSITE-PUBLIC-IDENTITY-ATTEST-20261118.mjs'
      - 'scripts/windows/test-P520-OFFSITE-PUBLIC-IDENTITY-ATTEST-20261118.mjs'
      - '.github/workflows/kmj-p520-public-identity-attest-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-identity-attest:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - name: Checkout exact pull request candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Synthetic public identity/Ed25519 verification; NO owner keys
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          node --test scripts/windows/test-P520-OFFSITE-PUBLIC-IDENTITY-ATTEST-20261118.mjs
          echo 'OWNER_P520_PRIVATE_KEYS_ACCESSED=NO'
          echo 'KMJ_ELITE_TRUSTED_OWNER_PIN=NOT_ATTEMPTED'
          echo 'INDEPENDENT_RESTORE=NOT_EXECUTED'
          echo 'PRODUCTION_APPROVAL=NOT_GRANTED'
