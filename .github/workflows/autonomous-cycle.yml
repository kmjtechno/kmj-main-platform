name: Autonomous Cycle

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

concurrency:
  group: kmj-autonomous-writer
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  bootstrap-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Enforce bootstrap safety
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'paid_ai_fallback: prohibited' mission/main-platform.yaml
          grep -q 'local_llm_inference: prohibited' mission/main-platform.yaml
          grep -q 'cloud_nexus_policy: untouched' mission/main-platform.yaml
          echo 'KMJ bootstrap safety gates PASS'
      - name: Safe bootstrap status
        run: |
          echo 'No autonomous AI write is enabled until a verified-zero provider route and scoped writer credential are configured.'
          echo 'Safe result: NO_FREE_ROUTE_AVAILABLE when no eligible route exists.'
