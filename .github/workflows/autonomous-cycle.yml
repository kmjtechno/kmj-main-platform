name: Autonomous Cycle

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

concurrency:
  group: kmj-autonomous-writer
  cancel-in-progress: false

permissions:
  contents: read
  actions: write
  issues: write
  pull-requests: read
  checks: read

jobs:
  watchdog:
    name: Autonomous safety and recovery watchdog
    runs-on: [self-hosted, linux, x64, kmj-main-platform-ci]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare resilient Python runtime
        run: bash ops/self-hosted-runner/prepare-python-runtime.sh

      - name: Recover known transient autonomous stops
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: PYTHONPATH=. python3 scripts/continuity_watchdog.py

      - name: Enforce platform safety boundaries
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'paid_ai_fallback: prohibited' mission/main-platform.yaml
          grep -q 'local_llm_inference: prohibited' mission/main-platform.yaml
          grep -q 'cloud_nexus_policy: untouched' mission/main-platform.yaml
          grep -q 'paid_fallback: prohibited' config/free-cloud-routing.yaml
          grep -q 'unknown_cost_is_free: false' config/free-cloud-routing.yaml
          PYTHONPATH=. python3 scripts/verify_free_router.py

      - name: Run autonomous recovery verification pack in parallel
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python3 scripts/verify_architecture.py & p1=$!
          PYTHONPATH=. python3 scripts/verify_contracts.py & p2=$!
          PYTHONPATH=. python3 scripts/verify_runtime.py & p3=$!
          status=0
          wait "$p1" || status=1
          wait "$p2" || status=1
          wait "$p3" || status=1
          exit "$status"

      - name: Check staging promotion drift
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main staging-approved --depth=1
          main_sha="$(git rev-parse origin/main)"
          staging_sha="$(git rev-parse origin/staging-approved)"
          {
            echo '## KMJ autonomous watchdog'
            echo
            echo "- main: \`$main_sha\`"
            echo "- staging-approved: \`$staging_sha\`"
            if [ "$main_sha" = "$staging_sha" ]; then
              echo '- promotion drift: none'
            else
              echo '- promotion drift: detected; staging promotion/deploy chain must continue'
            fi
            echo '- continuity recovery: known transient patch-format stops are requeued automatically'
            echo '- recovery verification: architecture/contracts/runtime executed in parallel'
            echo '- free-cloud policy: enforced'
            echo '- paid fallback: prohibited'
            echo '- local LLM inference: prohibited'
            echo '- KMJ Cloud Nexus: untouched'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish sanitized live delivery evidence
        if: always()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: PYTHONPATH=. python3 scripts/delivery_control_bridge.py

      - name: Watchdog result
        run: |
          echo 'Autonomous watchdog PASS.'
          echo 'The project is checked every 5 minutes; known transient patch stops are requeued and the worker is restarted automatically.'
