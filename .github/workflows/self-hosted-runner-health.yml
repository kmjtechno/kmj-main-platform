name: Self-Hosted Runner Health

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/self-hosted-runner-health.yml'
      - '.github/workflows/staging-vps-deploy-fixed.yml'
      - '.github/workflows/staging-authenticated-smoke.yml'
      - '.github/workflows/staging-deploy-recovery.yml'
      - 'ops/staging/**'
      - 'ops/self-hosted-runner/**'
      - 'docs/ops/SELF_HOSTED_CI_RUNNER.md'

permissions:
  contents: read

jobs:
  health:
    runs-on: [self-hosted, linux, x64, kmj-main-platform-ci]
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Verify runner identity and toolchain
        shell: bash
        run: |
          set -euo pipefail
          echo "runner=${RUNNER_NAME:-unknown}"
          uname -a
          git --version
          php -v || true
          composer --version || true
          node --version || true
          npm --version || true

      - name: Verify repository checkout
        shell: bash
        run: |
          set -euo pipefail
          test -f apps/platform/composer.json
          test -f apps/platform/package.json
          git status --short

      - name: Verify staging client tools
        shell: bash
        run: |
          set -euo pipefail
          for tool in ssh ssh-keygen ssh-keyscan curl python3; do
            command -v "$tool"
          done
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -n "$chrome" ]; then
            "$chrome" --version
          else
            echo 'No Chrome binary found; rendered staging verification needs browser setup.'
          fi

      - name: Inspect public staging HTTP availability
        shell: bash
        run: |
          set -euo pipefail
          for path in / /info /info/status; do
            curl --silent --show-error --connect-timeout 5 --max-time 15 \
              --output /dev/null --write-out "$path HTTP %{http_code}\\n" \
              "https://staging.kmjtechno.com$path" || true
          done

      - name: Prepare staging browser without privileged installation
        shell: bash
        run: bash ops/self-hosted-runner/prepare-staging-browser.sh

      - name: Verify browser runtime
        shell: bash
        run: |
          set -euo pipefail
          dom="$(timeout 30 "$KMJ_STAGING_CHROME" --no-sandbox --disable-gpu --dump-dom 'data:text/html,<body>KMJ_RUNNER_BROWSER_OK</body>' 2>/dev/null)"
          printf '%s' "$dom" | grep -Fq 'KMJ_RUNNER_BROWSER_OK'

      - name: Verify live staging monitor response
        shell: bash
        run: python3 ops/staging/verify-monitor.py
