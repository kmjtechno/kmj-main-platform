name: Self-Hosted Runner Health

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  health:
    runs-on: [self-hosted, linux, x64, kmj-main-platform-ci]
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Validate staging workflow expressions before merge
        shell: bash
        run: |
          set -euo pipefail
          lint_dir="$(mktemp -d "$RUNNER_TEMP/kmj-actionlint.XXXXXX")"
          trap 'rm -rf -- "$lint_dir"' EXIT
          curl --fail --silent --show-error --location --retry 2 --max-time 90 \
            'https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz' \
            --output "$lint_dir/actionlint.tar.gz"
          printf '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  %s\n' \
            "$lint_dir/actionlint.tar.gz" | sha256sum --check -
          tar -xzf "$lint_dir/actionlint.tar.gz" -C "$lint_dir" actionlint
          "$lint_dir/actionlint" -shellcheck= -pyflakes= \
            .github/workflows/self-hosted-runner-health.yml \
            .github/workflows/autonomous-cycle.yml \
            .github/workflows/autonomous-worker.yml \
            .github/workflows/platform-ci.yml \
            .github/workflows/staging-promotion-gate.yml \
            .github/workflows/staging-vps-deploy-fixed.yml \
            .github/workflows/staging-authenticated-smoke.yml \
            .github/workflows/staging-deploy-recovery.yml

      - name: Verify parallel verification safety and report VPS capacity
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/test_platform_verify_contract.py
          python3 controller/worker_preflight.py --capacity-only

      - name: Prepare resilient Python runtime
        run: bash ops/self-hosted-runner/prepare-python-runtime.sh

      - name: Verify delivery bridge contract
        run: PYTHONPATH=. python3 -m unittest tests.test_delivery_control_bridge

      - name: Verify official free client boundaries
        run: PYTHONPATH=. python3 tests/test_opencode_free.py

      - name: Prepare pinned official free client
        run: bash ops/self-hosted-runner/prepare-free-client.sh

      - name: Verify real zero-cost cloud response from VPS
        shell: bash
        env:
          KMJ_ENABLE_PUBLIC_FREE_PROVIDERS: '1'
          KMJ_9ROUTER_BASE_URL: 'http://127.0.0.1:1/v1'
          KMJ_9ROUTER_TIMEOUT_SECONDS: '6'
        run: |
          set -euo pipefail
          if PYTHONPATH=. python3 controller/opencode_free.py; then
            exit 0
          fi
          echo 'Official free client unavailable; probing public-only Kilo :free fallback.'
          PYTHONPATH=. python3 - <<'PY'
          import asyncio
          from controller.model_router import FreeCloudRouter

          async def main() -> None:
              result = await FreeCloudRouter().complete(
                  [{"role": "user", "content": "Reply with exactly KMJ_ZERO_COST_OK."}],
                  route="fast",
                  temperature=0.0,
                  data_classification="public",
              )
              model = str(result.get("model", ""))
              provider = str(result.get("provider", ""))
              if provider != "kilo" or not model.endswith(":free"):
                  raise SystemExit("PUBLIC_ZERO_COST_FALLBACK_NOT_VERIFIED")
              print(f"Public zero-cost fallback PASS provider={provider} model={model}")

          asyncio.run(main())
          PY

      - name: Verify runner identity and toolchain
        shell: bash
        run: |
          set -euo pipefail
          echo "runner=${RUNNER_NAME:-unknown}"
          uname -a
          git --version
          php -v || true
          composer --version || true
          node --version || true
          npm --version || true

      - name: Verify repository checkout
        shell: bash
        run: |
          set -euo pipefail
          test -f apps/platform/composer.json
          test -f apps/platform/package.json
          git status --short

      - name: Verify staging client tools
        shell: bash
        run: |
          set -euo pipefail
          for tool in ssh ssh-keygen ssh-keyscan curl python3 flock; do
            command -v "$tool"
          done
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -n "$chrome" ]; then
            "$chrome" --version
          else
            echo 'No Chrome binary found; rendered staging verification needs browser setup.'
          fi

      - name: Inspect public staging HTTP availability
        shell: bash
        run: |
          set -euo pipefail
          for path in / /products /products/kmj-calibration-pro; do
            curl --fail --silent --show-error --connect-timeout 5 --max-time 15 \
              --output /dev/null --write-out "$path HTTP %{http_code}\\n" \
              "https://staging.kmjtechno.com$path"
          done
          for path in /info /info/status; do
            code="$(curl --silent --show-error --connect-timeout 5 --max-time 15 \
              --output /dev/null --write-out '%{http_code}' \
              "https://staging.kmjtechno.com$path" || true)"
            test "$code" = "404"
            echo "$path HTTP $code (public monitoring disabled)"
          done

      - name: Prepare staging browser without privileged installation
        shell: bash
        run: bash ops/self-hosted-runner/prepare-staging-browser.sh

      - name: Verify browser runtime
        shell: bash
        run: |
          set -euo pipefail
          dom="$(timeout 30 "$KMJ_STAGING_CHROME" --no-sandbox --disable-gpu --dump-dom 'data:text/html,<body>KMJ_RUNNER_BROWSER_OK</body>' 2>/dev/null)"
          grep -Fq 'KMJ_RUNNER_BROWSER_OK' <<< "$dom"

