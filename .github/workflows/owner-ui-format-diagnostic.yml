name: Owner UI format diagnostic (temporary read-only)

on:
  push:
    branches:
      - fix/owner-dashboard-vs-command-center-20261029
    paths:
      - .github/workflows/owner-ui-format-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install project-pinned formatter
        working-directory: apps/platform
        run: |
          set -euo pipefail
          node --version
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Show exact Oxfmt diff only
        shell: bash
        run: |
          set -euo pipefail
          cd apps/platform
          ./node_modules/.bin/vp fmt resources/js/pages/operator.tsx scripts/check-operator-command-center.test.mjs --write
          git diff --check
          echo 'KMJ_FORMAT_DIFF_BEGIN'
          git diff -- resources/js/pages/operator.tsx scripts/check-operator-command-center.test.mjs
          echo 'KMJ_FORMAT_DIFF_END'
