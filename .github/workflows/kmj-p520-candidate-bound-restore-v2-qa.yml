name: KMJ P520 Candidate-Bound Restore Receipt V2 QA
on:
  pull_request:
    paths:
      - 'scripts/operations/verify-p520-independent-restore-v2-20261118.py'
      - 'scripts/windows/test-P520-OFFSITE-V2-CANDIDATE-VERIFY-20261118.mjs'
      - '.github/workflows/kmj-p520-candidate-bound-restore-v2-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate-identity:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Immutable source checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Python syntactic gate
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import ast
          from pathlib import Path
          p=Path("scripts/operations/verify-p520-independent-restore-v2-20261118.py")
          ast.parse(p.read_text(encoding="utf-8"))
          print("KMJ_P520_V2_VERIFIER_SYNTAX=PASS")
          PY
      - name: Synthetic cross-language Ed25519 candidate-binding regression
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          node --test scripts/windows/test-P520-OFFSITE-V2-CANDIDATE-VERIFY-20261118.mjs
          echo 'P520_REAL_ENCRYPTED_COPY=NOT_PERFORMED'
          echo 'P520_REAL_PG_STORAGE_RESTORE=NOT_PERFORMED'
          echo 'OWNER_PRIVATE_RECEIPT_KEY=NOT_ACCESSED'
          echo 'PRODUCTION_RELEASE_APPROVAL=NOT_GRANTED'
