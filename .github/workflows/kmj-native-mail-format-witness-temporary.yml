name: KMJ Native Mail temporary formatter witness
on:
  push:
    branches: [feat/kmj-native-mail-workspace-20261122]
permissions:
  contents: read
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@87d00bde2555f25eb54fedf940384e99cbdc55ef
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact Laravel Pint patch in ephemeral runner
        run: |
          set -euo pipefail
          cd apps/platform
          composer install --no-interaction --no-progress --prefer-dist --no-scripts
          vendor/bin/pint app/Services/Mail/NativeMailService.php app/Http/Controllers/NativeMailController.php tests/Feature/Mail/NativeMailFlowTest.php tests/Feature/Mail/WorkforceMailCenterTest.php database/migrations/2026_11_22_100000_create_kmj_native_mail_tables.php || true
          git --no-pager diff --color=never -- app/Services/Mail/NativeMailService.php app/Http/Controllers/NativeMailController.php tests/Feature/Mail/NativeMailFlowTest.php tests/Feature/Mail/WorkforceMailCenterTest.php database/migrations/2026_11_22_100000_create_kmj_native_mail_tables.php
      - name: Exact frontend formatter patch
        run: |
          set -euo pipefail
          cd apps/platform
          npm ci --no-audit --no-fund
          node_modules/.bin/vp fmt resources/js/pages/mail-center.tsx
          git --no-pager diff --color=never -- resources/js/pages/mail-center.tsx
