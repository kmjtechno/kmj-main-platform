name: Staging P0 TLS Guard Contract

on:
  pull_request:
    paths:
      - '.github/workflows/staging-tls-repair-pinned.yml'
      - '.github/workflows/staging-deploy-recovery.yml'
      - 'scripts/test_staging_recovery_failsafe.py'
      - '.github/workflows/staging-tls-repair-execute.yml'
      - 'scripts/test_staging_tls_repair_contract.py'
      - 'infra/server/KMJ_STAGE_TLS_REPAIR.sh'
      - 'infra/server/trust/kmj-elite-staging-known_hosts'

permissions:
  contents: read

jobs:
  contract:
    name: Fixed staging TLS repair contract
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - run: |
          set -Eeuo pipefail
          bash -n infra/server/KMJ_STAGE_TLS_REPAIR.sh
          python3 -B scripts/test_staging_tls_repair_contract.py
          python3 -B scripts/test_staging_recovery_failsafe.py

