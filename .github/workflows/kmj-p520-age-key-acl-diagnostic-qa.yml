name: KMJ P520 AGE File ACL Diagnostic QA

on:
  pull_request:
    paths:
      - 'scripts/windows/P520-AGE-KEY-ACL-DIAGNOSTIC-20261118.ps1'
      - 'scripts/windows/test-P520-AGE-KEY-ACL-DIAGNOSTIC-20261118.mjs'
      - '.github/workflows/kmj-p520-age-key-acl-diagnostic-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  read-only-acl-doctor:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Native Windows PowerShell parse and read-only ACL contract tests
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          node --test scripts/windows/test-P520-AGE-KEY-ACL-DIAGNOSTIC-20261118.mjs
          echo 'P520_KEY_CONTENT_READ=NO'
          echo 'HOST_ACL_MUTATION=NONE'
          echo 'PRODUCTION_RELEASE_APPROVAL=NOT_GRANTED'
