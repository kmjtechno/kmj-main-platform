name: KMJ 3FB443 Independent Google Backup Source Safety
on:
  pull_request:
    paths:
      - 'scripts/operations/*3fb443*20261027.sh'
      - 'scripts/test_3fb443_google_offsite_contract.py'
      - '.github/workflows/3fb443-google-offsite-source-safety.yml'
permissions:
  contents: read
jobs:
  google-recovery-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify remote archive SHA, identity, strict host and isolated restore
        run: |
          set -Eeuo pipefail
          python3 -B -m unittest discover -s scripts -p test_3fb443_google_offsite_contract.py -v
          echo 'GOOGLE_RESTORE_SOURCE_CONTRACT=PASS'
          echo 'REAL_GOOGLE_ARCHIVE_UPLOAD_OR_RESTORE=NOT_RUN_BY_CI'
