name: Format staging live monitor

on:
  push:
    branches:
      - feat/staging-live-monitor

permissions:
  contents: write

concurrency:
  group: format-staging-live-monitor
  cancel-in-progress: true

jobs:
  format:
    runs-on: [self-hosted, linux, x64, kmj-main-platform-ci]
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/staging-live-monitor
          persist-credentials: true

      - name: Format monitor sources
        working-directory: apps/platform
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          ./node_modules/.bin/vp fmt resources/js/data/delivery-progress.ts resources/js/pages/info.tsx

      - name: Commit formatter output
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- apps/platform/resources/js/data/delivery-progress.ts apps/platform/resources/js/pages/info.tsx; then
            echo 'No formatter changes needed.'
            exit 0
          fi
          git config user.name 'KMJ CI Formatter'
          git config user.email '158804600+kmjtechno@users.noreply.github.com'
          git add apps/platform/resources/js/data/delivery-progress.ts apps/platform/resources/js/pages/info.tsx
          git commit -m 'style(monitoring): format staging monitor sources'
          git push origin HEAD:feat/staging-live-monitor
