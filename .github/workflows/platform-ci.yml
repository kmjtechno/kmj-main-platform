name: Platform Runtime CI

on:
  push:
    branches:
      - implementation/runtime-bootstrap
    paths:
      - 'apps/platform/**'
      - 'bootstrap/runtime-source.yaml'
      - '.github/workflows/platform-ci.yml'
      - 'ops/self-hosted-runner/verify-platform.sh'
      - 'tests/test_platform_verify_contract.py'
  pull_request:
    paths:
      - 'apps/platform/**'
      - 'bootstrap/runtime-source.yaml'
      - '.github/workflows/platform-ci.yml'
      - 'ops/self-hosted-runner/verify-platform.sh'
      - 'tests/test_platform_verify_contract.py'

permissions:
  contents: write

concurrency:
  group: platform-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  platform:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/platform
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@87d00bde2555f25eb54fedf940384e99cbdc55ef
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/platform/package-lock.json
      - name: Verify hosted runtime
        run: |
          set -euo pipefail
          php --version
          composer --version
          node --version
          npm --version
          php -r 'exit(PHP_VERSION_ID >= 80300 && PHP_VERSION_ID < 80600 ? 0 : 1);'
          node -e 'const m=Number(process.versions.node.split(".")[0]); process.exit(m === 22 ? 0 : 1)'

      - name: Install, build and verify platform with parallel lanes
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ${{ github.workspace }}/apps/platform/database/database.sqlite
          KMJ_FORMAT_PATHS: |
            resources/js/pages/auth/oauth-authorize.tsx
            resources/js/pages/dashboard.tsx
            resources/js/pages/services/codebridge.tsx
        run: bash "$GITHUB_WORKSPACE/ops/self-hosted-runner/verify-platform.sh"
      - name: Commit formatter normalization to PR branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          if git diff --quiet -- apps/platform/resources/js/pages/auth/oauth-authorize.tsx apps/platform/resources/js/pages/dashboard.tsx apps/platform/resources/js/pages/services/codebridge.tsx; then
            echo 'Frontend sources already normalized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- apps/platform/resources/js/pages/auth/oauth-authorize.tsx apps/platform/resources/js/pages/dashboard.tsx apps/platform/resources/js/pages/services/codebridge.tsx
          git commit -m 'style: normalize existing frontend sources'
          git push origin "HEAD:${GITHUB_HEAD_REF}"
