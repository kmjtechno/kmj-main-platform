name: Platform Runtime CI

on:
  push:
    branches:
      - implementation/runtime-bootstrap
    paths:
      - 'apps/platform/**'
      - 'bootstrap/runtime-source.yaml'
      - '.github/workflows/platform-ci.yml'
  pull_request:
    paths:
      - 'apps/platform/**'
      - 'bootstrap/runtime-source.yaml'
      - '.github/workflows/platform-ci.yml'

permissions:
  contents: read

concurrency:
  group: platform-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  platform:
    runs-on: [self-hosted, linux, x64, kmj-main-platform-ci]
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/platform
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify pre-provisioned PHP 8.5 runtime
        run: |
          set -euo pipefail
          php --version
          composer --version
          php -r 'exit(PHP_VERSION_ID >= 80500 && PHP_VERSION_ID < 80600 ? 0 : 1);'

      - name: Setup Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Prepare deterministic CI database
        run: |
          set -euo pipefail
          touch database/database.sqlite

      - name: Install and build application
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ${{ github.workspace }}/apps/platform/database/database.sqlite
        run: |
          set -euo pipefail
          composer install --no-interaction --prefer-dist --no-progress
          test -f .env || cp .env.example .env
          php artisan key:generate --force
          php artisan migrate --force
          npm install --no-audit --no-fund
          npm run build

      - name: Check frontend format
        run: ./node_modules/.bin/vp fmt --check

      - name: Check frontend lint
        run: ./node_modules/.bin/vp lint

      - name: Check frontend types
        run: npm run types:check

      - name: Check PHP quality and tests
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ${{ github.workspace }}/apps/platform/database/database.sqlite
        run: composer test
