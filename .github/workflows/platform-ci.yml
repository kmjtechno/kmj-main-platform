name: Platform Runtime CI

on:
  push:
    branches:
      - implementation/runtime-bootstrap
    paths:
      - 'apps/platform/**'
      - 'bootstrap/runtime-source.yaml'
      - '.github/workflows/platform-ci.yml'
  pull_request:
    paths:
      - 'apps/platform/**'
      - 'bootstrap/runtime-source.yaml'
      - '.github/workflows/platform-ci.yml'

permissions:
  contents: read

concurrency:
  group: platform-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, kmj-main-platform-ci]
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/platform
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify frontend runtime
        run: |
          set -euo pipefail
          php --version
          composer --version
          node --version
          npm --version
          php -r 'exit(PHP_VERSION_ID >= 80300 && PHP_VERSION_ID < 80600 ? 0 : 1);'
          node -e 'const m=Number(process.versions.node.split(".")[0]); process.exit(m === 22 ? 0 : 1)'

      - name: Install frontend build dependencies
        run: |
          set -euo pipefail
          composer install --no-interaction --prefer-dist --no-progress
          npm install --prefer-offline --no-audit --no-fund

      - name: Build frontend
        run: npm run build

      - name: Check frontend format
        run: ./node_modules/.bin/vp fmt --check

      - name: Check frontend lint
        run: ./node_modules/.bin/vp lint

      - name: Check frontend types
        run: npm run types:check

  backend:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, kmj-main-platform-ci]
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/platform
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify backend runtime
        run: |
          set -euo pipefail
          php --version
          composer --version
          php -r 'exit(PHP_VERSION_ID >= 80300 && PHP_VERSION_ID < 80600 ? 0 : 1);'

      - name: Prepare deterministic CI database
        run: |
          set -euo pipefail
          touch database/database.sqlite

      - name: Install backend dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare application database
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ${{ github.workspace }}/apps/platform/database/database.sqlite
        run: |
          set -euo pipefail
          test -f .env || cp .env.example .env
          php artisan key:generate --force
          php artisan migrate --force

      - name: Check PHP quality and tests
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ${{ github.workspace }}/apps/platform/database/database.sqlite
        run: composer test
