name: KMJ external mail format witness (temporary)
on:
  push:
    branches: [feat/kmj-native-external-mail-compose-20261122]
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@87d00bde2555f25eb54fedf940384e99cbdc55ef
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact Pint source patches in disposable runner
        run: |
          set -euo pipefail
          cd apps/platform
          composer install --no-interaction --no-progress --prefer-dist --no-scripts
          vendor/bin/pint app/Mail/NativeExternalMailMessage.php app/Jobs/SubmitNativeExternalMail.php app/Services/Mail/NativeExternalMailService.php app/Http/Controllers/NativeMailController.php app/Services/Mail/NativeMailService.php tests/Feature/Mail/NativeExternalMailFlowTest.php database/migrations/2026_11_22_111000_add_kmj_native_external_mail_fields.php || true
          git --no-pager diff --color=never -- app/Mail/NativeExternalMailMessage.php app/Jobs/SubmitNativeExternalMail.php app/Services/Mail/NativeExternalMailService.php app/Http/Controllers/NativeMailController.php app/Services/Mail/NativeMailService.php tests/Feature/Mail/NativeExternalMailFlowTest.php database/migrations/2026_11_22_111000_add_kmj_native_external_mail_fields.php
      - name: Exact VitePlus TSX patch in disposable runner
        run: |
          set -euo pipefail
          cd apps/platform
          npm ci --no-audit --no-fund
          node_modules/.bin/vp fmt resources/js/pages/mail-center.tsx
          git --no-pager diff --color=never -- resources/js/pages/mail-center.tsx
