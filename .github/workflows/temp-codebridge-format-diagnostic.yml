name: Temporary CodeBridge Format Diagnostic
on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/platform/resources/js/components/codebridge/device-control-center.tsx'
      - '.github/workflows/temp-codebridge-format-diagnostic.yml'
permissions:
  contents: read
jobs:
  formatter-diff:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --prefix apps/platform
      - name: Show exact formatter diff (no commit, no credentials)
        shell: bash
        run: |
          set -euo pipefail
          cd apps/platform
          ./node_modules/.bin/vp check --fix >/dev/null 2>&1 || true
          git diff -- resources/js/components/codebridge/device-control-center.tsx
