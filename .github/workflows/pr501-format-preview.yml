name: PR501 Exact Directory Formatter Preview
on:
  pull_request:
    types: [synchronize]
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install locked formatter
        working-directory: apps/platform
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Format directory source and emit exact content
        working-directory: apps/platform
        run: |
          set -euo pipefail
          ./node_modules/.bin/vp fmt
          ./node_modules/.bin/vp fmt --check
          echo "KMJ_PR501_BEGIN"
          base64 -w0 resources/js/pages/operator-directory.tsx
          echo
          echo "KMJ_PR501_END"
