name: KMJ AI Providers 49A Owner Release QA
on:
  pull_request:
    paths:
      - "scripts/KMJ_49A007_AI_PROVIDERS_OWNER_RELEASE_20261115.sh"
      - "scripts/test_KMJ_49A007_AI_PROVIDERS_OWNER_RELEASE_20261115.py"
      - ".github/workflows/kmj-49a-ai-owner-release-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-only-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify exact source, old release and no migration diffs
        shell: bash
        run: |
          set -Eeuo pipefail
          previous=e5b43872bc031eb4b074a1e318abd80949c321d8
          target=49a007a46ee369fb8968da859ad9de5c8146d2c6
          git cat-file -e "${target}^{commit}"
          git cat-file -e "${previous}^{commit}"
          [[ "$(git merge-base "$previous" "$target")" == "$previous" ]]
          if git diff --name-only "$previous" "$target" | grep -E '^apps/platform/database/migrations/'; then
            echo DB_MIGRATIONS_REQUIRE_SEPARATE_REVIEW
            exit 2
          fi
          printf '%s  %s\n' \
            '1cf748f6c8eadef7a5250d923a5ec54808611fb7a36550f1a4548e77cbf8ad71' \
            scripts/KMJ_49A007_AI_PROVIDERS_OWNER_RELEASE_20261115.sh | sha256sum -c -
          printf '%s  %s\n' \
            '6e2f99b6c8391f70e2f387e26a814ed0c18fe182bc63c1941604c237a43c28e2' \
            scripts/test_KMJ_49A007_AI_PROVIDERS_OWNER_RELEASE_20261115.py | sha256sum -c -
          bash -n scripts/KMJ_49A007_AI_PROVIDERS_OWNER_RELEASE_20261115.sh
          python3 -m py_compile scripts/test_KMJ_49A007_AI_PROVIDERS_OWNER_RELEASE_20261115.py
          echo AI_PROVIDER_RELEASE_SOURCE_SHA=PASS
      - name: Guarded release offline positive and negative tests
        run: |
          python3 -B -m unittest discover -s scripts \
            -p 'test_KMJ_49A007_AI_PROVIDERS_OWNER_RELEASE_20261115.py' -v
          echo PRODUCTION_ACTIVATION=NOT_ATTEMPTED
