name: PR492 vp format preview
on:
  pull_request:
    types: [synchronize]
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install locked frontend tools
        working-directory: apps/platform
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run repository formatter and preview two exact files
        working-directory: apps/platform
        run: |
          set -euo pipefail
          ./node_modules/.bin/vp fmt
          ./node_modules/.bin/vp fmt --check
          echo 'KMJ_PR492_TSX_BEGIN'
          base64 -w0 resources/js/layouts/owner-module-shell.tsx
          echo
          echo 'KMJ_PR492_TSX_END'
          echo 'KMJ_PR492_TEST_BEGIN'
          base64 -w0 scripts/check-command-os-visual-lock.test.mjs
          echo
          echo 'KMJ_PR492_TEST_END'
