name: KMJ 3FB443 Product Studio P0 Source Safety
on:
  pull_request:
    paths:
      - 'scripts/operations/*3fb443*'
      - 'scripts/test_3fb443_product_studio_release_safety.py'
      - '.github/workflows/3fb443-product-studio-release-safety.yml'
permissions:
  contents: read
jobs:
  source-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify exact current SHA and isolated four migrations
        run: |
          set -Eeuo pipefail
          python3 -B -m unittest discover -s scripts -p test_3fb443_product_studio_release_safety.py -v
          echo 'SOURCE_ONLY=PASS'
          echo 'REAL_PRODUCTION_PREP=NOT_RUN_BY_CI'
