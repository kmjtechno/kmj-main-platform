name: CodeBridge License Contract
on:
  push:
    branches: [feat/codebridge-license-encoder, feat/codebridge-completion, main, feat/homepage-worldclass]
    paths:
      - 'apps/platform/app/Services/Licensing/CodeBridge/**'
      - 'apps/platform/app/Services/Licensing/Kslp/KslpSigner.php'
      - 'apps/platform/routes/codebridge-api.php'
      - 'apps/platform/routes/codebridge-admin.php'
      - 'apps/platform/config/codebridge.php'
      - 'apps/platform/database/migrations/*codebridge*'
      - 'apps/platform/bootstrap/app.php'
      - 'tests/codebridge/**'
      - '.github/workflows/codebridge-contract.yml'
  pull_request:
    paths:
      - 'apps/platform/app/Services/Licensing/CodeBridge/**'
      - 'apps/platform/app/Services/Licensing/Kslp/KslpSigner.php'
      - 'apps/platform/routes/codebridge-api.php'
      - 'apps/platform/routes/codebridge-admin.php'
      - 'apps/platform/config/codebridge.php'
      - 'apps/platform/database/migrations/*codebridge*'
      - 'apps/platform/bootstrap/app.php'
      - 'tests/codebridge/**'
      - '.github/workflows/codebridge-contract.yml' 
  workflow_dispatch:
permissions:
  contents: read
jobs:
  interoperability:
    runs-on: [self-hosted, linux, x64, kmj-main-platform-ci]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: kmjtechno/kmj-codebridge
          ref: a09fae60677ed2ab17a3a4c9601afea793e62a55
          path: .codebridge-contract
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify PHP encoder and Node consumer
        run: |
          php -l apps/platform/app/Services/Licensing/CodeBridge/CodeBridgeLeaseEncoder.php
          php tests/codebridge/activation-proof.php apps/platform/app/Services/Licensing/Kslp/KslpActivationProof.php
          php tests/codebridge/renewal.php "$RUNNER_TEMP/codebridge-fixture.json"
          node tests/codebridge/verify.mjs "$RUNNER_TEMP/codebridge-fixture.json"

  concurrency-database:
    name: CodeBridge concurrency (${{ matrix.database }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        database: [mysql, postgres]
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: codebridge
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot" --health-interval=5s --health-timeout=5s --health-retries=20
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: codebridge
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres -d codebridge" --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install PHP database drivers and verify concurrency runtime
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y php-mysql php-pgsql
          php -m | grep -E 'pdo_mysql|pdo_pgsql'
          php -r 'exit(function_exists("pcntl_fork") ? 0 : 1);'
      - name: Select isolated database
        run: |
          set -euo pipefail
          if [[ "${{ matrix.database }}" == "mysql" ]]; then
            echo 'CODEBRIDGE_CONCURRENCY_DSN=mysql:host=127.0.0.1;port=3306;dbname=codebridge' >> "$GITHUB_ENV"
            echo 'CODEBRIDGE_CONCURRENCY_USER=root' >> "$GITHUB_ENV"
            echo 'CODEBRIDGE_CONCURRENCY_PASSWORD=root' >> "$GITHUB_ENV"
          else
            echo 'CODEBRIDGE_CONCURRENCY_DSN=pgsql:host=127.0.0.1;port=5432;dbname=codebridge' >> "$GITHUB_ENV"
            echo 'CODEBRIDGE_CONCURRENCY_USER=postgres' >> "$GITHUB_ENV"
            echo 'CODEBRIDGE_CONCURRENCY_PASSWORD=postgres' >> "$GITHUB_ENV"
          fi
          echo 'CODEBRIDGE_CONCURRENCY_REQUIRED=1' >> "$GITHUB_ENV"
      - name: Create isolated concurrency schema
        run: php tests/codebridge/concurrency-schema.php
      - name: Run mandatory real-database concurrency regression
        run: |
          set -euo pipefail
          output="$(php tests/codebridge/concurrency.php 2>&1)"
          printf '%s\n' "$output"
          grep -F 'CodeBridge real-DB concurrency checks: PASS' <<<"$output"
          if grep -Fq 'SKIP:' <<<"$output"; then exit 1; fi
