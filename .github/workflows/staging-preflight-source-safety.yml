name: Main Platform Read-only Staging Preflight Source Safety
on:
  pull_request:
    paths:
      - 'scripts/operations/kmj_main_platform_stage_readonly_preflight_20261028.py'
      - 'scripts/test_kmj_main_platform_stage_readonly_preflight.py'
      - '.github/workflows/staging-preflight-source-safety.yml'
permissions:
  contents: read
jobs:
  source-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Parse and verify fail-closed preflight without root
        run: |
          set -Eeuo pipefail
          python3 -B -m unittest discover -s scripts -p 'test_kmj_main_platform_stage_readonly_preflight.py' -v
          echo 'PRODUCTION_MUTATION=NONE'
          echo 'ROOT_EXECUTION=NOT_PERFORMED_BY_CI'
