name: KMJ 29A982 Google Independent Restore Contract
on:
  pull_request:
    paths:
      - 'scripts/operations/verify-29a982-google-sftp-restore-20261027.sh'
      - 'scripts/operations/verify-29a982-backup-bundle-20261027.sh'
      - 'scripts/test_29a982_google_restore_contract.py'
      - '.github/workflows/p0-29a982-google-restore-contract.yml'
permissions:
  contents: read
jobs:
  source-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify source-only exact-hash isolated restore safety
        run: |
          set -Eeuo pipefail
          python3 -B -m unittest discover -s scripts -p test_29a982_google_restore_contract.py -v
          echo 'OFFSITE_RESTORE_SOURCE_CONTRACT=PASS'
          echo 'ACTUAL_REMOTE_RESTORE=NOT_ATTEMPTED'
