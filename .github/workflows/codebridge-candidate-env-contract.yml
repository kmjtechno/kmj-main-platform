name: CodeBridge Candidate Env Safety

on:
  pull_request:
    paths:
      - 'scripts/operations/stage-codebridge-agent-production-env-20261024.py'
      - 'scripts/test_codebridge_candidate_env_20261024.py'
      - '.github/workflows/codebridge-candidate-env-contract.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/operations/stage-codebridge-agent-production-env-20261024.py'
      - 'scripts/test_codebridge_candidate_env_20261024.py'
      - '.github/workflows/codebridge-candidate-env-contract.yml'

permissions:
  contents: read

jobs:
  candidate-config-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify Python source and secret-free candidate configuration tests
        run: |
          set -euo pipefail
          python3 -B -m py_compile scripts/operations/stage-codebridge-agent-production-env-20261024.py
          python3 -B scripts/test_codebridge_candidate_env_20261024.py -v
          echo 'CANDIDATE_ENV_SOURCE_CONTRACT=PASS'
          echo 'NO_PRODUCTION_ENV_COPIED_IN_CI=YES'
          echo 'LIVE_DEPLOYMENT=NOT_ATTEMPTED'
