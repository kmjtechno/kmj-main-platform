name: Staging Authenticated Surface Smoke

on:
  workflow_run:
    workflows:
      - Staging VPS Deploy
    types:
      - completed
  workflow_call:
  workflow_dispatch:
  push:
    branches: [staging-approved]
  pull_request:
    paths:
      - 'apps/platform/app/**'
      - 'apps/platform/routes/**'
      - 'apps/platform/tests/Feature/PlatformOwnerConsoleTest.php'
      - 'apps/platform/tests/Feature/OwnerPaymentGatewaySettingsTest.php'
      - 'apps/platform/composer.lock'
      - '.github/workflows/staging-authenticated-smoke.yml'

permissions:
  contents: read

concurrency:
  group: staged-owner-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Verify authenticated surfaces for approved staging commit
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout exact source for staging promotion, PR or deployed staging
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_run' && 'staging-approved' || github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Resolve exact approved commit
        shell: bash
        env:
          DEPLOYED_SHA: ${{ github.event.workflow_run.head_sha }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          approved_sha="$(git rev-parse HEAD)"
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            test -n "$DEPLOYED_SHA"
            test "$approved_sha" = "$DEPLOYED_SHA"
          else
            test "$approved_sha" = "$SOURCE_SHA"
          fi
          echo "SMOKE_SHA=$approved_sha" >> "$GITHUB_ENV"

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@87d00bde2555f25eb54fedf940384e99cbdc55ef
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, sodium
          coverage: none

      - name: Install isolated staging smoke dependencies
        working-directory: apps/platform
        shell: bash
        run: |
          set -euo pipefail
          composer install --no-interaction --prefer-dist --no-progress
          cp .env.example .env
          touch database/database.sqlite
          php artisan key:generate --force

      - name: Prepare isolated staging database
        working-directory: apps/platform
        env:
          APP_ENV: staging
          DB_CONNECTION: sqlite
          DB_DATABASE: ${{ github.workspace }}/apps/platform/database/database.sqlite
        shell: bash
        run: |
          set -euo pipefail
          php artisan migrate:fresh --force

      - name: Verify authenticated route surfaces
        working-directory: apps/platform
        env:
          APP_ENV: staging
          DB_CONNECTION: sqlite
          DB_DATABASE: ${{ github.workspace }}/apps/platform/database/database.sqlite
        shell: bash
        run: |
          set -euo pipefail
          php artisan staging:smoke-authenticated-surfaces

      - name: Verify owner role, passkey and commercial policy regression
        working-directory: apps/platform
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: ${{ github.workspace }}/apps/platform/database/database.sqlite
          MAIL_MAILER: log
        shell: bash
        run: |
          set -euo pipefail
          php artisan test --filter='PlatformOwnerConsoleTest|OwnerPaymentGatewaySettingsTest' --no-ansi

      - name: Authenticated smoke evidence
        if: always()
        shell: bash
        run: |
          {
            echo '## KMJ authenticated staging smoke'
            echo
            echo "- approved commit: `${SMOKE_SHA:-unresolved}`"
            echo "- isolated authenticated route regression: ${{ job.status }}"
            echo '- surfaces: `/dashboard`, `/operator`, `/operator/ops`, `/purchase`'
            echo '- synthetic owner data: transaction-scoped and rolled back'
            echo '- this is synthetic isolated QA, not authenticated live browser acceptance or production cutover'
            echo '- live commit deployment is verified separately by Staging VPS Deploy'
          } >> "$GITHUB_STEP_SUMMARY"
