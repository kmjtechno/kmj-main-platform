name: Staging Authenticated Surface Smoke

on:
  workflow_run:
    workflows:
      - Staging VPS Deploy
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-authenticated-surface-smoke
  cancel-in-progress: true

jobs:
  smoke:
    name: Verify authenticated surfaces for approved staging commit
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout approved staging branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: staging-approved
          fetch-depth: 1

      - name: Resolve exact approved commit
        shell: bash
        env:
          DEPLOYED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          approved_sha="$(git rev-parse HEAD)"
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            test -n "$DEPLOYED_SHA"
            test "$approved_sha" = "$DEPLOYED_SHA"
          fi
          echo "SMOKE_SHA=$approved_sha" >> "$GITHUB_ENV"

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@87d00bde2555f25eb54fedf940384e99cbdc55ef
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, sodium
          coverage: none

      - name: Install isolated staging smoke dependencies
        working-directory: apps/platform
        shell: bash
        run: |
          set -euo pipefail
          composer install --no-interaction --prefer-dist --no-progress
          cp .env.example .env
          touch database/database.sqlite
          php artisan key:generate --force

      - name: Prepare isolated staging database
        working-directory: apps/platform
        env:
          APP_ENV: staging
          DB_CONNECTION: sqlite
          DB_DATABASE: ${{ github.workspace }}/apps/platform/database/database.sqlite
        shell: bash
        run: |
          set -euo pipefail
          php artisan migrate:fresh --force

      - name: Verify authenticated route surfaces
        working-directory: apps/platform
        env:
          APP_ENV: staging
          DB_CONNECTION: sqlite
          DB_DATABASE: ${{ github.workspace }}/apps/platform/database/database.sqlite
        shell: bash
        run: |
          set -euo pipefail
          php artisan staging:smoke-authenticated-surfaces

      - name: Authenticated smoke evidence
        if: always()
        shell: bash
        run: |
          {
            echo '## KMJ authenticated staging smoke'
            echo
            echo "- approved commit: `${SMOKE_SHA:-unresolved}`"
            echo "- isolated authenticated route regression: ${{ job.status }}"
            echo '- surfaces: `/dashboard`, `/operator/ops`, `/purchase`'
            echo '- synthetic owner data: transaction-scoped and rolled back'
            echo '- live commit deployment is verified separately by Staging VPS Deploy'
          } >> "$GITHUB_STEP_SUMMARY"
