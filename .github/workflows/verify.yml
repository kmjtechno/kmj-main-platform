name: Verify Foundation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt
      - name: Compile controller
        run: python -m compileall controller
      - name: Verify locked runtime invariants
        run: |
          set -euo pipefail
          grep -q 'KMJ_PAID_FALLBACK' render.yaml
          grep -q 'KMJ_LOCAL_LLM' render.yaml
          grep -q 'kmjtechno/kmj-main-platform' mission/main-platform.yaml
          grep -q 'cloud_nexus_policy: untouched' mission/main-platform.yaml
          grep -q 'paid_ai_fallback: prohibited' mission/main-platform.yaml
          grep -q 'local_llm_inference: prohibited' mission/main-platform.yaml
          grep -q 'no_free_route_status: NO_FREE_ROUTE_AVAILABLE' mission/main-platform.yaml
      - name: Verify architecture foundation
        run: |
          set -euo pipefail
          test -f .github/CODEOWNERS
          test -f docs/adr/ADR-001-system-boundaries.md
          test -f docs/adr/ADR-002-modular-monolith.md
          test -f docs/adr/ADR-003-commercial-authority-chain.md
          test -f docs/adr/ADR-004-cloud-ai-policy.md
          test -f docs/adr/ADR-005-kristi-governance.md
          test -f docs/architecture/first-vertical-slice.md
          test -f work/backlog.yaml
          test -f apps/platform/README.md
          test -f apps/platform/KMJ_BOUNDARY.md
          test -f packages/contracts/README.md
          test -f services/license-core/README.md
          test -f tests/architecture/README.md
          grep -q 'Cloud Nexus remains a separate engineering IDE' docs/adr/ADR-001-system-boundaries.md
          grep -q 'NO_FREE_ROUTE_AVAILABLE' docs/adr/ADR-004-cloud-ai-policy.md
          grep -q 'Organization -> Product -> Entitlement' docs/architecture/first-vertical-slice.md
          grep -q 'production_requires_owner_approval: true' work/backlog.yaml
      - name: Verify public surface inventory
        run: python scripts/verify_public_surface.py
      - name: Verify strict free-cloud router
        run: PYTHONPATH=. python scripts/verify_free_router.py
      - name: Verify versioned contracts
        run: python scripts/verify_contracts.py
      - name: Verify Rust sandbox license core
        run: |
          rustup default stable
          cargo fmt --manifest-path services/license-core/Cargo.toml --check
          cargo test --manifest-path services/license-core/Cargo.toml --locked
      - name: Verify module architecture
        run: python scripts/verify_architecture.py
      - name: Verify platform runtime provenance
        run: python scripts/verify_runtime.py
