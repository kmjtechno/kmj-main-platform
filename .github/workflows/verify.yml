name: Verify Foundation

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare resilient Python runtime
        run: bash ops/self-hosted-runner/prepare-python-runtime.sh
      - name: Compile controller
        run: python3 -m compileall controller
      - name: Verify persistent worker safety
        run: PYTHONPATH=. python3 -m unittest tests.test_persistent_worker tests.test_worker_retry_recovery tests.test_delivery_control_bridge tests.test_staging_monitor_contract tests.test_live_public_surface_contract tests.test_opencode_free tests.test_router_official_client tests.test_codebridge_github_proxy
      - name: Verify zero-extra-spend CodeBridge workflow contracts
        run: python3 -m unittest tests.test_codebridge_free_first_workflow_contract
      - name: Verify staging QA failure classification
        # Uses the existing Node runtime; no package installation or AI call.
        run: node --test ops/staging/browser-qa.test.mjs
      - name: Verify locked policy invariants
        run: |
          set -euo pipefail
          grep -q 'KMJ_PAID_FALLBACK' render.yaml
          grep -q 'KMJ_LOCAL_LLM' render.yaml
          grep -q 'kmjtechno/kmj-main-platform' mission/main-platform.yaml
          grep -q 'cloud_nexus_policy: untouched' mission/main-platform.yaml
          grep -q 'paid_ai_fallback: prohibited' mission/main-platform.yaml
          grep -q 'local_llm_inference: prohibited' mission/main-platform.yaml
          grep -q 'no_free_route_status: NO_FREE_ROUTE_AVAILABLE' mission/main-platform.yaml
      - name: Verify backup and recovery scripts
        run: |
          set -euo pipefail
          bash -n scripts/backup_platform.sh
          bash -n scripts/verify_backup_bundle.sh
          bash -n scripts/backup_preflight.sh
          grep -q 'BACKUP_REMOTE' scripts/backup_platform.sh
          grep -q 'BACKUP_AGE_RECIPIENT' scripts/backup_platform.sh
          grep -q 'sha256sum --check' scripts/verify_backup_bundle.sh
          grep -q 'No secret values were printed' scripts/backup_preflight.sh
          python3 scripts/test_backup_contract.py
          python3 scripts/test_restore_verification_contract.py
          python3 -c "import ast, pathlib; p=pathlib.Path('scripts/operations/independent-local-recovery-brand-v2-20261025.py'); s=p.read_text(); ast.parse(s); assert '69acb9b3f738e5edcc6ea85c3c76729eaa1b5b62' in s and \"listen_addresses=''\" in s and 'PRODUCTION_ACTIVATION=NOT_AUTHORIZED' in s"
          bash -n scripts/operations/verify-real-offsite-recovery.sh
          python3 -B scripts/test_real_offsite_recovery_contract.py
          bash -n infra/server/KMJ_SERVER_BOOTSTRAP.sh
          bash -n infra/server/KMJ_STAGE_TLS_REPAIR.sh
      - name: Verify architecture foundation
        run: |
          set -euo pipefail
          test -f .github/CODEOWNERS
          test -f docs/adr/ADR-001-system-boundaries.md
          test -f docs/adr/ADR-002-modular-monolith.md
          test -f docs/adr/ADR-003-commercial-authority-chain.md
          test -f docs/adr/ADR-004-cloud-ai-policy.md
          test -f docs/adr/ADR-005-kristi-governance.md
          test -f docs/architecture/first-vertical-slice.md
          test -f work/backlog.yaml
          test -f apps/platform/README.md
          test -f apps/platform/KMJ_BOUNDARY.md
          test -f packages/contracts/README.md
          test -f services/license-core/README.md
          test -f tests/architecture/README.md
          grep -q 'Cloud Nexus remains a separate engineering IDE' docs/adr/ADR-001-system-boundaries.md
          grep -q 'NO_FREE_ROUTE_AVAILABLE' docs/adr/ADR-004-cloud-ai-policy.md
          grep -q 'Organization -> Product -> Entitlement' docs/architecture/first-vertical-slice.md
          grep -q 'production_requires_owner_approval: true' work/backlog.yaml
      - name: Verify delivery progress sync
        env:
          KMJ_PROGRESS_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          KMJ_PROGRESS_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/verify_delivery_progress.py
      - name: Verify public surface inventory
        run: python3 scripts/verify_public_surface.py
      - name: Verify strict free-cloud router
        run: PYTHONPATH=. python3 scripts/verify_free_router.py
      - name: Verify versioned contracts
        run: python3 scripts/verify_contracts.py
      - name: Verify Rust sandbox license core
        run: |
          set -euo pipefail
          RUNNER_USER_HOME="$(getent passwd "$(id -un)" | cut -d: -f6)"
          source "${RUNNER_USER_HOME}/.cargo/env"
          rustup default stable
          rustup component add rustfmt
          cargo fmt --manifest-path services/license-core/Cargo.toml --check
          cargo test --manifest-path services/license-core/Cargo.toml --locked
      - name: Verify module architecture
        run: python3 scripts/verify_architecture.py
      - name: Verify platform runtime provenance
        run: python3 scripts/verify_runtime.py

  isolated_owner_auth_69ac:
    name: Exact 69ac source synthetic owner and commerce QA (nonproduction)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout exact PR head without GitHub credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Verify full app source equals staged release candidate
        env:
          PINNED_APP_SHA: 69acb9b3f738e5edcc6ea85c3c76729eaa1b5b62
        run: |
          set -euo pipefail
          git cat-file -e "$PINNED_APP_SHA"
          git diff --quiet "$PINNED_APP_SHA" HEAD -- apps/platform
          test "$(git rev-parse "$PINNED_APP_SHA")" = "69acb9b3f738e5edcc6ea85c3c76729eaa1b5b62"
          echo 'CANDIDATE_APP_TREE_EXACT_69AC=PASS'
      - name: Prepare isolated PHP 8.4 with SQLite only
        uses: shivammathur/setup-php@87d00bde2555f25eb54fedf940384e99cbdc55ef
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, sodium
          coverage: none
      - name: Install isolated test dependencies and generate disposable app key
        working-directory: apps/platform
        run: |
          set -euo pipefail
          composer install --no-interaction --prefer-dist --no-progress
          cp .env.example .env
          mkdir -p database
          touch database/database.sqlite
          php artisan key:generate --force
      - name: Migrate only disposable SQLite database
        working-directory: apps/platform
        env:
          APP_ENV: staging
          DB_CONNECTION: sqlite
          DB_DATABASE: ${{ github.workspace }}/apps/platform/database/database.sqlite
          MAIL_MAILER: log
          QUEUE_CONNECTION: sync
        run: |
          set -euo pipefail
          php artisan migrate:fresh --force
      - name: Synthetic authenticated staging route smoke
        working-directory: apps/platform
        env:
          APP_ENV: staging
          DB_CONNECTION: sqlite
          DB_DATABASE: ${{ github.workspace }}/apps/platform/database/database.sqlite
          MAIL_MAILER: log
          QUEUE_CONNECTION: sync
        run: |
          set -euo pipefail
          php artisan staging:smoke-authenticated-surfaces
          echo 'SYNTHETIC_OWNER_ROUTES=PASS'
      - name: Platform owner, denial and payment secrets policy regression
        working-directory: apps/platform
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: ${{ github.workspace }}/apps/platform/database/database.sqlite
          MAIL_MAILER: log
          QUEUE_CONNECTION: sync
        run: |
          set -euo pipefail
          php artisan test --filter='PlatformOwnerConsoleTest|OwnerPaymentGatewaySettingsTest|StagingAuthenticatedSmokeCommandTest' --no-ansi
          echo 'SYNTHETIC_OWNER_AUTH_AND_PAYMENT_POLICY=PASS'
      - name: State evidence limits explicitly
        if: always()
        run: |
          echo 'This job tests the exact 69ac application tree only in disposable GitHub-hosted SQLite.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Not a live authenticated owner browser test, real production payment test, SMTP inbox delivery, or deployment approval.' >> "$GITHUB_STEP_SUMMARY"

  isolated_visual_lock_69ac:
    name: Exact 69ac locked landing and owner preview QA (18 viewport routes)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Require exact 69ac application source
        run: |
          set -euo pipefail
          git cat-file -e 69acb9b3f738e5edcc6ea85c3c76729eaa1b5b62
          git diff --quiet 69acb9b3f738e5edcc6ea85c3c76729eaa1b5b62 HEAD -- apps/platform
          echo 'VISUAL_CANDIDATE_APP_SHA=PASS_69AC'
      - name: Node 24 pinned preview runtime
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/platform/package-lock.json
      - name: Install lockfile frontend dependencies
        working-directory: apps/platform
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install pinned Playwright Chromium
        working-directory: apps/platform
        run: npx playwright install chromium
      - name: Verify 18 synthetic locked landing, super-admin and owner ops browser cases
        working-directory: apps/platform
        env:
          KMJ_SCREENSHOT_DIR: visual-results
        run: |
          set -euo pipefail
          npm run visual:verify
          test -s visual-results/verification.json
          echo 'CANDIDATE_SYNTHETIC_VISUAL_QA=PASS'
      - name: Preserve bounded synthetic screenshots for owner review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kmj-69ac-visual-preview-evidence
          path: |
            apps/platform/visual-results/*.png
            apps/platform/visual-results/verification.json
          if-no-files-found: warn
          retention-days: 3
      - name: State visual QA scope
        if: always()
        run: |
          echo '18 synthetic loopback browser cases using exact 69ac app tree; no authenticated owner account, production DB or deployment.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Screenshots require comparison with owner-supplied locked reference before acceptance.' >> "$GITHUB_STEP_SUMMARY"
