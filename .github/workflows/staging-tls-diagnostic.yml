name: Staging TLS Diagnostic

on:
  pull_request:
    paths:
      - '.github/workflows/staging-tls-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect staging DNS and certificate
        shell: bash
        run: |
          set -euo pipefail
          host=staging.kmjtechno.com
          echo '== DNS =='
          getent ahostsv4 "$host" || true
          echo '== TLS certificate =='
          cert="$(mktemp)"
          trap 'rm -f "$cert"' EXIT
          if timeout 20 openssl s_client -connect "$host:443" -servername "$host" -showcerts </dev/null 2>/dev/null             | openssl x509 -outform PEM >"$cert"; then
            openssl x509 -in "$cert" -noout -subject -issuer -dates -ext subjectAltName
          else
            echo 'TLS_HANDSHAKE_OR_CERT_READ_FAILED'
          fi
          echo '== HTTPS curl =='
          curl -I --max-time 20 "https://$host/" || true
          echo '== HTTP curl =='
          curl -I --max-time 20 "http://$host/" || true
