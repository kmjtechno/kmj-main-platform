name: KMJ P520 No-Google Candidate Prep QA
on:
  pull_request:
    paths:
      - 'scripts/KMJ_4C9_P520_OWNER_LOCAL_ENCRYPT_20261116.sh'
      - 'scripts/operations/seal-main-platform-p520-20261116.py'
      - 'scripts/test_KMJ_4C9_P520_OWNER_LOCAL_ENCRYPT_20261116.py'
      - '.github/workflows/kmj-p520-nogoogle-preparation-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          set -Eeuo pipefail
          bash -n scripts/KMJ_4C9_P520_OWNER_LOCAL_ENCRYPT_20261116.sh
          python3 -B -m unittest discover -s scripts -p 'test_KMJ_4C9_P520_OWNER_LOCAL_ENCRYPT_20261116.py' -v
          echo GOOGLE_VPS_RUNTIME_REQUIRED=NO
          echo P520_LOCAL_ONLY_SOURCE_QA=PASS
          echo REAL_BACKUP_RESTORE=NOT_EXECUTED
          echo PRODUCTION_SWITCH=NOT_ATTEMPTED
