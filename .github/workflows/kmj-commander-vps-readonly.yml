name: KMJ Commander VPS Read-Only Check

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/kmj-commander-vps-readonly.yml"

permissions:
  contents: read

jobs:
  commander-readonly:
    name: Commander read-only staging VPS checks
    runs-on: [self-hosted, linux, x64, kmj-main-platform-ci]
    timeout-minutes: 10
    environment: staging
    steps:
      - name: Checkout pinned KMJ Desktop Commander
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: kmjtechno/kmj-desktop-commander
          ref: 39b05f84cdca8c5cbafd0454e6dbf08644e88505
          path: .kmj-desktop-commander
          persist-credentials: false

      - name: Validate staging connection configuration
        env:
          STAGING_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_USER: ${{ secrets.STAGING_SSH_USER }}
          STAGING_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          STAGING_PATH: ${{ vars.STAGING_APP_PATH }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$STAGING_HOST"
          test -n "$STAGING_USER"
          test -n "$STAGING_KEY"
          test -n "$STAGING_PATH"

      - name: Configure strict SSH for Commander
        env:
          STAGING_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          key="$RUNNER_TEMP/kmj-commander-staging-key"
          printf '%s' "$STAGING_KEY" | sed 's/\\n/\n/g' | tr -d '\r' > "$key"
          printf '\n' >> "$key"
          chmod 600 "$key"
          ssh-keygen -y -f "$key" >/dev/null
          ssh-keyscan -T 10 -H "$STAGING_HOST" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          cat > "$HOME/.ssh/config" <<EOF
          Host $STAGING_HOST
            IdentityFile $key
            IdentitiesOnly yes
            UserKnownHostsFile $HOME/.ssh/known_hosts
            StrictHostKeyChecking yes
          EOF
          chmod 600 "$HOME/.ssh/config"

      - name: Prepare Commander MCP runtime
        working-directory: .kmj-desktop-commander/integrations/mcp
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Run KMJ Commander read-only VPS checks
        id: commander
        working-directory: .kmj-desktop-commander/integrations/mcp
        env:
          KMJ_COMMANDER_HOST: ${{ secrets.STAGING_SSH_HOST }}
          KMJ_COMMANDER_USER: ${{ secrets.STAGING_SSH_USER }}
          KMJ_COMMANDER_PORT: '22'
          KMJ_COMMANDER_PROJECT_ROOT: ${{ vars.STAGING_APP_PATH }}/apps/platform
        shell: bash
        run: |
          set -o pipefail
          npm run check:vps:readonly 2>&1 | tee "$RUNNER_TEMP/kmj-commander-readonly.txt"

      - name: Publish Commander evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kmj-commander-vps-readonly-${{ github.run_id }}
          path: ${{ runner.temp }}/kmj-commander-readonly.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Remove temporary SSH key
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/kmj-commander-staging-key"
