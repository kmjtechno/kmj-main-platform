name: KMJ P0 Browser Formatter Diff (Temporary)
on:
  pull_request:
    paths:
      - '.github/workflows/kmj-p0-browser-format-temp.yml'
      - 'apps/platform/visual/**'
      - 'apps/platform/scripts/browser-preview-verify.mjs'
      - 'apps/platform/resources/js/data/delivery-progress.ts'
permissions:
  contents: read
jobs:
  format-diff:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Repository native formatter diff only
        shell: bash
        run: |
          set -euo pipefail
          cd apps/platform
          npm ci --ignore-scripts --no-audit --no-fund --silent
          npm run check:fix
          git diff -- visual/entry.tsx scripts/browser-preview-verify.mjs resources/js/data/delivery-progress.ts
          echo FORMAT_DIFF_ONLY=PASS
