name: KMJ P520 Key-Free Disposable PostgreSQL and Uploads QA
on:
  pull_request:
    paths:
      - 'scripts/windows/P520-OFFSITE-PG-STORAGE-RESTORE-20261116.mjs'
      - 'scripts/windows/test-P520-OFFSITE-PG-STORAGE-RESTORE-20261116.mjs'
      - 'scripts/windows/P520-OFFSITE-BUNDLE-ISOLATION-20261116.mjs'
      - '.github/workflows/kmj-p520-disposable-pg-storage-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  no-key-restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate offline no-key PostgreSQL and uploads restore phase source
        run: |
          set -Eeuo pipefail
          node --test scripts/windows/test-P520-OFFSITE-PG-STORAGE-RESTORE-20261116.mjs
          echo REAL_P520_POSTGRESQL_RESTORE=NOT_EXECUTED
          echo REAL_P520_STORAGE_RESTORE=NOT_EXECUTED
          echo PRODUCTION_RELEASE=UNCHANGED
