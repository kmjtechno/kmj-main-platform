name: Staging Deploy Recovery

on:
  workflow_run:
    workflows:
      - Staging VPS Deploy
    types:
      - completed

permissions:
  actions: write
  contents: read

jobs:
  recover-failed-deploy:
    if: ${{ github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt < 3 }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    steps:
      - name: Classify failed staging deployment
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/staging-deploy-logs.zip"
          text="$RUNNER_TEMP/staging-deploy-logs.txt"
          curl --fail --silent --show-error --location --max-time 60 \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/logs" \
            --output "$archive"
          unzip -p "$archive" >"$text"
          if grep -Eiq 'Certificate does not cover staging\.kmjtechno\.com|Staging TLS hostname mismatch|TLS validation failed; fix the staging certificate/vhost|curl: \(60\) SSL: no alternative certificate subject name matches' "$text"; then
            echo 'tls_repair=true' >>"$GITHUB_OUTPUT"
            echo 'STAGING_RECOVERY=BLOCKED TLS_CERTIFICATE_IDENTITY_MISMATCH'
            echo 'Use protected Staging P0 TLS Repair (Pinned Host) after its authorized SSH identity and operator script are restored.'
          else
            echo 'tls_repair=false' >>"$GITHUB_OUTPUT"
            echo 'STAGING_RECOVERY=TRANSIENT_RETRY_ELIGIBLE'
          fi

      # Certificate/identity errors are structural and must not be retried.
      # Repair is isolated in the separately reviewed pinned-host workflow,
      # which uses an exact source-pinned host key and approved script digest.
      - name: Preserve TLS blocker without unsafe SSH trust-on-first-use
        if: \${{ steps.classify.outputs.tls_repair == 'true' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          echo 'STAGING_CERT_RECOVERY=BLOCKED AWAIT_PINNED_OPERATOR_REPAIR'
          echo 'STAGING_RETRY=SKIPPED TERMINAL_TLS_ERROR'
          echo 'No DNS modification, ssh-keyscan, certificate bypass, or production release action.'

      - name: Re-run failed staging deployment jobs
        if: ${{ steps.classify.outputs.tls_repair == 'false' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Recovering failed staging deploy run ${RUN_ID}, attempt ${RUN_ATTEMPT}."
          curl --fail --silent --show-error --max-time 30 --output /dev/null \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/rerun-failed-jobs"
