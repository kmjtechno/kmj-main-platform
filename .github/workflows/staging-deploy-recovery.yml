name: Staging Deploy Recovery

on:
  workflow_run:
    workflows:
      - Staging VPS Deploy
    types:
      - completed

permissions:
  actions: write
  contents: read

jobs:
  recover-failed-deploy:
    if: ${{ github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt < 3 }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    steps:
      - name: Classify failed staging deployment
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/staging-deploy-logs.zip"
          text="$RUNNER_TEMP/staging-deploy-logs.txt"
          curl --fail --silent --show-error --location --max-time 60 \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/logs" \
            --output "$archive"
          unzip -p "$archive" >"$text"
          if grep -Fq 'Certificate does not cover staging.kmjtechno.com' "$text"; then
            echo 'tls_repair=true' >>"$GITHUB_OUTPUT"
            echo 'Detected canonical staging TLS hostname mismatch.'
          else
            echo 'tls_repair=false' >>"$GITHUB_OUTPUT"
            echo 'No staging TLS hostname mismatch detected; recovery will only retry failed jobs.'
          fi

      - name: Configure strict staging SSH
        if: ${{ steps.classify.outputs.tls_repair == 'true' }}
        env:
          STAGING_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_USER: ${{ secrets.STAGING_SSH_USER }}
          STAGING_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$STAGING_HOST"
          test -n "$STAGING_USER"
          test -n "$STAGING_KEY"
          install -m 700 -d "$HOME/.ssh"
          key="$RUNNER_TEMP/kmj-staging-tls-repair-key"
          printf '%s' "$STAGING_KEY" | sed 's/\\n/\n/g' | tr -d '\r' >"$key"
          printf '\n' >>"$key"
          chmod 600 "$key"
          ssh-keygen -y -f "$key" >/dev/null
          ssh-keyscan -T 10 -H "$STAGING_HOST" >"$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          cat >"$HOME/.ssh/config" <<EOF
          Host $STAGING_HOST
            IdentityFile $key
            IdentitiesOnly yes
            UserKnownHostsFile $HOME/.ssh/known_hosts
            StrictHostKeyChecking yes
          EOF
          chmod 600 "$HOME/.ssh/config"

      - name: Repair canonical staging TLS certificate
        if: ${{ steps.classify.outputs.tls_repair == 'true' }}
        env:
          STAGING_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_USER: ${{ secrets.STAGING_SSH_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=15 "$STAGING_USER@$STAGING_HOST" \
            'if [ "$(id -u)" -eq 0 ]; then exec /root/KMJ_STAGE_TLS_REPAIR.sh; else exec sudo -n /root/KMJ_STAGE_TLS_REPAIR.sh; fi'

      - name: Remove temporary SSH key
        if: ${{ always() }}
        shell: bash
        run: rm -f "$RUNNER_TEMP/kmj-staging-tls-repair-key"

      - name: Re-run failed staging deployment jobs
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Recovering failed staging deploy run ${RUN_ID}, attempt ${RUN_ATTEMPT}."
          curl --fail --silent --show-error --max-time 30 --output /dev/null \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/rerun-failed-jobs"
