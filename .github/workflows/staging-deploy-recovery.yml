name: Staging Deploy Recovery

on:
  workflow_run:
    workflows:
      - Staging VPS Deploy
    types:
      - completed

permissions:
  actions: write
  contents: read

jobs:
  retry-failed-deploy:
    if: ${{ github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt < 3 }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Re-run failed staging deployment jobs
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          set -euo pipefail
          echo "Recovering failed staging deploy run ${RUN_ID}, attempt ${RUN_ATTEMPT}."
          curl --fail --silent --show-error --max-time 30 --output /dev/null \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/rerun-failed-jobs"
