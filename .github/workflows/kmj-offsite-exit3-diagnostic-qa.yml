name: KMJ Elite Offsite Exit3 Exact Invocation Diagnostic Source QA
on:
  pull_request:
    paths:
      - 'scripts/operations/diagnose-offsite-exit3-20261117.py'
      - 'scripts/operations/test_diagnose_offsite_exit3_20261117.py'
      - 'scripts/operations/diagnose-offsite-exit3-markers-20261117.py'
      - 'scripts/operations/test_diagnose_offsite_exit3_markers_20261117.py'
      - 'scripts/operations/diagnose-offsite-exit3-fingerprints-20261117.py'
      - 'scripts/operations/test_diagnose_offsite_exit3_fingerprints_20261117.py'
      - 'scripts/operations/diagnose-offsite-exit3-phase-hostkey-20261117.py'
      - 'scripts/operations/test_diagnose_offsite_exit3_phase_hostkey_20261117.py'
      - 'scripts/operations/guarded-offsite-v2-v3-dns-continuity-20261117.py'
      - 'scripts/operations/test_guarded_offsite_v2_v3_dns_continuity_20261117.py'
      - 'scripts/operations/verify-offsite-v3-last-success-20261117.py'
      - 'scripts/operations/test_verify_offsite_v3_last_success_20261117.py'
      - 'scripts/KMJ_OFFSITE_SFTP_DNS_PINNED_V2_20261112.py'
      - 'scripts/KMJ_OFFSITE_FRESH_X25519_SFTP_V3_20261112.py'
      - 'scripts/test_KMJ_OFFSITE_FRESH_X25519_SFTP_V3_20261112.py'
      - 'scripts/operations/google_nov17_fixture/**'
      - '.github/workflows/kmj-offsite-exit3-diagnostic-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Offline Python AST gate for V3 and DNS transport pinned sources
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import ast, pathlib
          for name in (
              'KMJ_OFFSITE_SFTP_DNS_PINNED_V2_20261112.py',
              'KMJ_OFFSITE_FRESH_X25519_SFTP_V3_20261112.py',
              'test_KMJ_OFFSITE_FRESH_X25519_SFTP_V3_20261112.py',
          ):
              ast.parse((pathlib.Path('scripts')/name).read_bytes(),filename='<pinned-v3-source>')
          print('PINNED_V3_TRANSPORT_AST=3_PASS')
          PY
          python3 -B -m unittest discover -s scripts -p 'test_KMJ_OFFSITE_FRESH_X25519_SFTP_V3_20261112.py' -v
      - name: Exact-invocation category classification without journal, root or backup access
        run: |
          set -Eeuo pipefail
          python3 -B -m unittest discover -s scripts/operations -p 'test_diagnose_offsite_exit3_20261117.py' -v
          python3 -B -m unittest discover -s scripts/operations -p 'test_diagnose_offsite_exit3_markers_20261117.py' -v
          python3 -B -m unittest discover -s scripts/operations -p 'test_diagnose_offsite_exit3_fingerprints_20261117.py' -v
          python3 -B -m unittest discover -s scripts/operations -p 'test_diagnose_offsite_exit3_phase_hostkey_20261117.py' -v
          python3 -B -m unittest discover -s scripts/operations -p 'test_guarded_offsite_v2_v3_dns_continuity_20261117.py' -v
          python3 -B -m unittest discover -s scripts/operations -p 'test_verify_offsite_v3_last_success_20261117.py' -v
          # Byte-identical mirrors of Google PR281 sources; do not run live restore.
          printf '%s  %s\n' \
            'c72476c4be2648e3ed31457334b7e5acba56d52084e5059c932ffd4bf45fcc9c' 'scripts/operations/google_nov17_fixture/KMJ_GOOGLE_V3_20261117_RESTORE_HELPER.py' \
            'db33552104f6e8c51c03d931bb90d280f7c062bc6ecb6892775e7fa42228d2be' 'scripts/operations/google_nov17_fixture/test_KMJ_GOOGLE_V3_20261117_RESTORE_HELPER.py' \
            '6c5708a639307027a28e174a164912c755bbeb8cd70a477a3e3e96f580ea68ec' 'scripts/operations/google_nov17_fixture/KMJ_GOOGLE_V3_20261117_DISPOSABLE_RESTORE_ONEPASS.sh' | sha256sum -c -
          python3 -B -m unittest discover -s scripts/operations/google_nov17_fixture -p 'test_KMJ_GOOGLE_V3_20261117_RESTORE_HELPER.py' -v
          bash -n scripts/operations/google_nov17_fixture/KMJ_GOOGLE_V3_20261117_DISPOSABLE_RESTORE_ONEPASS.sh
          echo GOOGLE_NOV17_ISOLATED_RESTORE_SOURCE_QA=PASS
          echo REMOTE_RESTORE_NOT_EXECUTED=YES
          echo OFFSITE_EXIT3_SOURCE_QA=PASS
          echo REAL_ELITE_UNIT_JOURNAL_READ=NOT_EXECUTED
          echo OFFSITE_BACKUP_REPAIRED=NO
          echo PRODUCTION_APPROVAL=UNCHANGED
