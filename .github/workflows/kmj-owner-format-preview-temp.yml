name: KMJ Owner Formatter Preview TEMP
on:
  pull_request:
    paths:
      - '.github/workflows/kmj-owner-format-preview-temp.yml'
permissions:
  contents: read
jobs:
  exact-owner-format:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/platform/package-lock.json
      - name: Format only new owner regression test without executing project scripts
        shell: bash
        working-directory: apps/platform
        run: |
          set -Eeuo pipefail
          npm ci --ignore-scripts --no-audit --no-fund --prefer-offline
          ./node_modules/.bin/vp fmt scripts/check-command-os-visual-lock.test.mjs
          printf 'KMJOWNER_FMT_BEGIN\n'
          base64 -w 4000 scripts/check-command-os-visual-lock.test.mjs | while IFS= read -r chunk; do
            printf 'KMJOWNER_FMT_B64:%s\n' "$chunk"
          done
          printf 'KMJOWNER_FMT_END\n'
          git diff -- scripts/check-command-os-visual-lock.test.mjs
