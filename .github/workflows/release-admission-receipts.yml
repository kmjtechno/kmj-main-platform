name: Release Admission Receipts

on:
  pull_request:
    paths:
      - "scripts/operations/release_admission_receipts.py"
      - "scripts/operations/main_platform_autopublish_gate.py"
      - "scripts/test_release_admission_receipts.py"
      - "scripts/operations/release_receipt_store.py"
      - "scripts/test_release_receipt_store.py"
      - "scripts/operations/elite_collect_staging_origin_receipt.py"
      - "scripts/operations/check-staging-readback.py"
      - "scripts/test_elite_collect_staging_origin_receipt.py"
      - "scripts/operations/elite_collect_backup_receipts.py"
      - "scripts/operations/verify-elite-local-upload-restore-20261119.py"
      - "scripts/test_elite_collect_backup_receipts.py"
      - "scripts/operations/elite_collect_rollback_rehearsal_receipt.py"
      - "scripts/test_elite_collect_rollback_rehearsal_receipt.py"
      - "scripts/operations/elite_collect_public_qa_receipt.py"
      - "scripts/operations/elite_derive_migration_storage_receipt.py"
      - "scripts/test_elite_public_qa_and_migration_storage.py"
      - "scripts/operations/elite_admission_broker.py"
      - "scripts/test_elite_admission_broker.py"
      - "scripts/operations/elite_collect_all_receipts.py"
      - "scripts/test_elite_collect_all_and_broker_units.py"
      - "infra/server/systemd/kmj-elite-release-admission-broker.*"
      - ".github/workflows/release-admission-receipts.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pure-logic-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Receipt to admission mapping tests (pure logic, nothing installed or written)
        run: |
          set -Eeuo pipefail
          python3 -B scripts/test_release_admission_receipts.py -v
          python3 -B scripts/test_release_receipt_store.py -v
          python3 -B scripts/test_elite_collect_staging_origin_receipt.py -v
          python3 -B scripts/test_elite_collect_backup_receipts.py -v
          python3 -B scripts/test_elite_collect_rollback_rehearsal_receipt.py -v
          python3 -B scripts/test_elite_public_qa_and_migration_storage.py -v
          python3 -B scripts/test_elite_admission_broker.py -v
          python3 -B scripts/test_elite_collect_all_and_broker_units.py -v
          echo "RELEASE_ADMISSION_RECEIPTS_QA=PASS"
          echo "INSTALLED=NO ADMISSION_WRITTEN=NO PRODUCTION_RELEASE=UNCHANGED"
