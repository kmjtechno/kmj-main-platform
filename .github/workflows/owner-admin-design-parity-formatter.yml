name: Owner Admin Design Formatter Preview
on:
  pull_request:
    paths:
      - 'apps/platform/resources/css/owner-module-shell.css'
      - 'apps/platform/resources/js/layouts/owner-module-shell.tsx'
      - 'apps/platform/resources/js/pages/**'
      - 'apps/platform/scripts/check-owner-design-parity.test.mjs'
      - 'apps/platform/scripts/check-modelfabric.test.mjs'
      - 'apps/platform/scripts/check-owner-product-editor-state.test.mjs'
      - 'apps/platform/resources/private/kmj-commercial-pricebook-20261123.json'
      - '.github/workflows/owner-admin-design-parity-formatter.yml'
  workflow_dispatch:
jobs:
  read-only-source-preview:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/platform/package-lock.json
      - name: Show exact owned-source formatter diff
        shell: bash
        run: |
          set -Eeuo pipefail
          cd apps/platform
          npm ci --no-audit --no-fund --ignore-scripts
          ./node_modules/.bin/vp fmt \
            resources/css/owner-module-shell.css \
            resources/js/layouts/owner-module-shell.tsx \
            resources/js/pages/services/ai-providers.tsx \
            resources/js/pages/services/codebridge.tsx \
            scripts/check-owner-design-parity.test.mjs \
            resources/js/pages/operator-products.tsx \
            resources/js/pages/operator-mail-smtp.tsx \
            resources/js/pages/operator-modelfabric.tsx \
            scripts/check-modelfabric.test.mjs \
            scripts/check-mail-inbound-worker.test.mjs \
            scripts/check-owner-product-editor-state.test.mjs \
            resources/private/kmj-commercial-pricebook-20261123.json
          git diff --no-ext-diff -- \
            resources/css/owner-module-shell.css \
            resources/js/layouts/owner-module-shell.tsx \
            resources/js/pages/services/ai-providers.tsx \
            resources/js/pages/services/codebridge.tsx \
            scripts/check-owner-design-parity.test.mjs \
            resources/js/pages/operator-products.tsx \
            resources/js/pages/operator-mail-smtp.tsx \
            resources/js/pages/operator-modelfabric.tsx \
            scripts/check-modelfabric.test.mjs \
            scripts/check-mail-inbound-worker.test.mjs \
            scripts/check-owner-product-editor-state.test.mjs \
            resources/private/kmj-commercial-pricebook-20261123.json
          echo 'LIVE_HOST_MUTATION=NONE'
          echo 'GIT_BRANCH_WRITE=NONE'
