name: CodeBridge OAuth CI

on:
  pull_request:
    paths:
      - 'apps/platform/app/Http/Controllers/CodeBridgeOAuthLinkController.php'
      - 'apps/platform/app/Services/CodeBridge/OAuth/**'
      - 'apps/platform/bootstrap/app.php'
      - 'apps/platform/config/codebridge_oauth.php'
      - 'apps/platform/config/services.php'
      - 'apps/platform/database/migrations/*codebridge_oauth*'
      - 'apps/platform/resources/js/pages/auth/oauth-authorize.tsx'
      - 'apps/platform/resources/views/codebridge-oauth-link.blade.php'
      - 'apps/platform/routes/codebridge-oauth.php'
      - 'apps/platform/routes/web.php'
      - 'apps/platform/tests/Feature/CodeBridgeOAuthLinkTest.php'
      - 'apps/platform/tests/Feature/CodeBridgeOAuthServerTest.php'
      - 'apps/platform/tests/Unit/CodeBridgeOAuthCoreTest.php'
      - '.github/workflows/codebridge-oauth-link-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, kmj-main-platform-ci]
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/platform
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP 8.4
        if: runner.environment == 'github-hosted'
        uses: shivammathur/setup-php@87d00bde2555f25eb54fedf940384e99cbdc55ef
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, sodium
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/platform/package-lock.json
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: cp .env.example .env && php artisan key:generate --force
      - name: Syntax
        run: |
          php -l app/Http/Controllers/CodeBridgeOAuthLinkController.php
          php -l app/Services/CodeBridge/OAuth/OAuthCore.php
          php -l app/Services/CodeBridge/OAuth/OAuthError.php
          php -l app/Services/CodeBridge/OAuth/OAuthServer.php
          php -l bootstrap/app.php
          php -l config/codebridge_oauth.php
          php -l routes/codebridge-oauth.php
          php -l routes/web.php
      - name: OAuth unit and feature tests
        run: |
          php artisan test tests/Unit/CodeBridgeOAuthCoreTest.php --no-ansi
          php artisan test tests/Feature/CodeBridgeOAuthServerTest.php --no-ansi
          php artisan test tests/Feature/CodeBridgeOAuthLinkTest.php --no-ansi
      - name: Full PHP verification
        run: composer test
