name: KMJ V3 dual-artifact offline policy QA
on:
  pull_request:
    paths:
      - "scripts/KMJ_OFFSITE_V3_DUAL_ARTIFACT_POLICY_REVIEW_20261115.py"
      - "scripts/test_KMJ_OFFSITE_V3_DUAL_ARTIFACT_POLICY_REVIEW_20261115.py"
      - "scripts/KMJ_OFFSITE_V3_LOCAL_CIPHER_PUBLISHER_REVIEW_20261115.py"
      - "scripts/test_KMJ_OFFSITE_V3_LOCAL_CIPHER_PUBLISHER_REVIEW_20261115.py"
      - "scripts/KMJ_OFFSITE_V3_LOCAL_DAILY_PUBLISHER_REVIEW_20261115.py"
      - "scripts/test_KMJ_OFFSITE_V3_LOCAL_DAILY_PUBLISHER_REVIEW_20261115.py"
      - "scripts/KMJ_OFFSITE_V3_DAILY_SOURCE_BUILDER_REVIEW_20261115.py"
      - "scripts/test_KMJ_OFFSITE_V3_DAILY_SOURCE_BUILDER_REVIEW_20261115.py"
      - "scripts/KMJ_OFFSITE_V3_TRANSFER_BOUND_TRANSACTION_REVIEW_20261115.py"
      - "scripts/test_KMJ_OFFSITE_V3_TRANSFER_BOUND_TRANSACTION_REVIEW_20261115.py"
      - "scripts/KMJ_OFFSITE_V3_PINNED_V2_ADMISSION_REVIEW_20261115.py"
      - "scripts/test_KMJ_OFFSITE_V3_PINNED_V2_ADMISSION_REVIEW_20261115.py"
      - "scripts/KMJ_OFFSITE_V3_HEALTH_ONEPASS_OWNER_REVIEW_20261115.py"
      - "scripts/test_KMJ_OFFSITE_V3_HEALTH_ONEPASS_OWNER_REVIEW_20261115.py"
      - "scripts/KMJ_HEALTH_SOURCE_ENTRY_CLASSIFIER_READONLY_20261115.py"
      - "scripts/test_KMJ_HEALTH_SOURCE_ENTRY_CLASSIFIER_READONLY_20261115.py"
      - ".github/workflows/kmj-v3-dual-artifact-policy-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  safe-offline-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout commit under test
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify syntax without loading production backup secrets
        run: |
          python3 -m py_compile scripts/KMJ_OFFSITE_V3_DUAL_ARTIFACT_POLICY_REVIEW_20261115.py
          python3 -m py_compile scripts/test_KMJ_OFFSITE_V3_DUAL_ARTIFACT_POLICY_REVIEW_20261115.py
          python3 -m py_compile scripts/KMJ_OFFSITE_V3_LOCAL_CIPHER_PUBLISHER_REVIEW_20261115.py
          python3 -m py_compile scripts/test_KMJ_OFFSITE_V3_LOCAL_CIPHER_PUBLISHER_REVIEW_20261115.py
          python3 -m py_compile scripts/KMJ_OFFSITE_V3_LOCAL_DAILY_PUBLISHER_REVIEW_20261115.py
          python3 -m py_compile scripts/test_KMJ_OFFSITE_V3_LOCAL_DAILY_PUBLISHER_REVIEW_20261115.py
          python3 -m py_compile scripts/KMJ_OFFSITE_V3_DAILY_SOURCE_BUILDER_REVIEW_20261115.py
          python3 -m py_compile scripts/test_KMJ_OFFSITE_V3_DAILY_SOURCE_BUILDER_REVIEW_20261115.py
          python3 -m py_compile scripts/KMJ_OFFSITE_V3_TRANSFER_BOUND_TRANSACTION_REVIEW_20261115.py
          python3 -m py_compile scripts/test_KMJ_OFFSITE_V3_TRANSFER_BOUND_TRANSACTION_REVIEW_20261115.py
          python3 -m py_compile scripts/KMJ_OFFSITE_V3_PINNED_V2_ADMISSION_REVIEW_20261115.py
          python3 -m py_compile scripts/test_KMJ_OFFSITE_V3_PINNED_V2_ADMISSION_REVIEW_20261115.py
          python3 -m py_compile scripts/KMJ_OFFSITE_V3_HEALTH_ONEPASS_OWNER_REVIEW_20261115.py
          python3 -m py_compile scripts/test_KMJ_OFFSITE_V3_HEALTH_ONEPASS_OWNER_REVIEW_20261115.py
          python3 -m py_compile scripts/KMJ_HEALTH_SOURCE_ENTRY_CLASSIFIER_READONLY_20261115.py
          python3 -m py_compile scripts/test_KMJ_HEALTH_SOURCE_ENTRY_CLASSIFIER_READONLY_20261115.py
      - name: Run disposable fixture tests (no actual vault, backup, network or root)
        run: |
          python3 -m unittest discover -s scripts \
            -p 'test_KMJ_OFFSITE_V3_*_20261115.py' -v
          python3 -m unittest discover -s scripts \
            -p 'test_KMJ_HEALTH_SOURCE_ENTRY_CLASSIFIER_READONLY_20261115.py' -v
      - name: Reject any accidental installation CLI added to review-only policy
        shell: bash
        run: |
          python3 - <<'PY'
          import ast
          from pathlib import Path
          p=Path('scripts/KMJ_OFFSITE_V3_DUAL_ARTIFACT_POLICY_REVIEW_20261115.py')
          src=p.read_text()
          tree=ast.parse(src)
          assert 'NOT AN INSTALLER' in src
          assert 'READ_ONLY_REVIEW' in src
          assert 'SNAPSHOT_WRITTEN=NO' in src
          assert 'RETENTION_EXECUTED=NO' in src
          assert all(not any(token in arg.value for token in ('--apply', '--install', '--send', '--deploy')) for node in ast.walk(tree) if isinstance(node,ast.Call) for arg in node.args if isinstance(arg,ast.Constant) and isinstance(arg.value,str))
          writer=Path('scripts/KMJ_OFFSITE_V3_LOCAL_CIPHER_PUBLISHER_REVIEW_20261115.py').read_text()
          assert 'SOURCE_ONLY_NOT_INSTALLED' in writer
          assert 'REMOTE_SFTP_SHA_READBACK=PASS' in writer
          assert 'renameat2' in writer
          assert 'remote_restore_verified' in writer
          daily=Path('scripts/KMJ_OFFSITE_V3_LOCAL_DAILY_PUBLISHER_REVIEW_20261115.py').read_text()
          assert 'SOURCE_ONLY_NOT_INSTALLED' in daily
          assert 'STAGING_DAILY_ROOTS_NOT_SEPARATED' in daily
          assert 'renameat2' in daily
          assert 'independent_remote_restore_verified' in daily
          builder=Path('scripts/KMJ_OFFSITE_V3_DAILY_SOURCE_BUILDER_REVIEW_20261115.py').read_text()
          assert 'REVIEW_ONLY_NOT_INSTALLED' in builder
          assert 'STAGING_ROOT_INSIDE_HEALTH_MONITOR' in builder
          assert 'daily_published' in builder and 'offsite_readback_verified' in builder
          boundary=Path('scripts/KMJ_OFFSITE_V3_TRANSFER_BOUND_TRANSACTION_REVIEW_20261115.py').read_text()
          assert 'SOURCE_ONLY_NOT_INSTALLED' in boundary
          assert 'transfer_result=transport.transfer(path,sha,hostline)' in boundary
          assert 'independent_remote_decrypt_restore_verified' in boundary
          assert 'IncompleteTransaction' in boundary
          admission=Path('scripts/KMJ_OFFSITE_V3_PINNED_V2_ADMISSION_REVIEW_20261115.py').read_text()
          assert 'SOURCE_ONLY_NOT_INSTALLED' in admission
          assert 'V2_SHA=' in admission and 'TRANSPORT_SHA=' in admission
          assert 'pinned_transport()' in admission
          assert 'SCHEDULED_V2_EXEC_IDENTITY_CHANGED' in admission
          print('SOURCE_REVIEW_ONLY_CONTRACT=PASS')
          PY
