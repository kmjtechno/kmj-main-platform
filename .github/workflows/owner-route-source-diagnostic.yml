name: Owner route source diagnostic (temporary read-only)
on:
  push:
    branches:
      - fix/owner-dashboard-vs-command-center-20261029
    paths:
      - .github/workflows/owner-route-source-diagnostic.yml
      - apps/platform/scripts/check-operator-command-center.test.mjs
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Exact CircleCI source tests without dependency install
        shell: bash
        run: |
          set -euo pipefail
          node --version
          cd apps/platform
          node --test scripts/check-operator-command-center.test.mjs scripts/check-command-os-visual-lock.test.mjs
      - name: Report pinned formatter diff without committing
        shell: bash
        run: |
          set -euo pipefail
          cd apps/platform
          npm ci --ignore-scripts --no-audit --no-fund
          ./node_modules/.bin/vp fmt scripts/check-operator-command-center.test.mjs --write
          git diff --check
          echo KMJ_SOURCE_FMT_BEGIN
          git diff -- scripts/check-operator-command-center.test.mjs
          echo KMJ_SOURCE_FMT_END
