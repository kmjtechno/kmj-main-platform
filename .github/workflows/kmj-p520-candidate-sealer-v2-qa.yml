name: KMJ P520 Candidate-Bound AGE Sealer V2 QA

on:
  pull_request:
    paths:
      - 'scripts/operations/seal-main-platform-p520-candidate-v2-20261119.py'
      - 'scripts/operations/test-p520-candidate-sealer-v2-20261119.mjs'
      - 'scripts/operations/test_p520_candidate_sealer_synthetic_v2_20261119.py'
      - 'scripts/operations/p520-owner-observed-public-key-20261118.txt'
      - '.github/workflows/kmj-p520-candidate-sealer-v2-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate-sealer-negative-test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - name: Checkout exact candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Validate SHA-bound candidate and fixed owner-public recipient
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          node --test scripts/operations/test-p520-candidate-sealer-v2-20261119.mjs
          if [[ "${{ matrix.os }}" == ubuntu-* ]]; then
            python3 -I -B scripts/operations/test_p520_candidate_sealer_synthetic_v2_20261119.py -v
          fi
          echo 'PRODUCTION_OR_BACKUP_MUTATION=NONE'
          echo 'OWNER_REAL_AGE_CIPHER_CREATED=NO'
          echo 'P520_INDEPENDENT_RESTORE=NOT_EXECUTED'
          echo 'PRODUCTION_APPROVAL=NOT_GRANTED'
