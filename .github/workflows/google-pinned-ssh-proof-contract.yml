name: Pinned Google SSH Admission Safety
on:
  pull_request:
    paths:
      - "scripts/operations/verify-google-offsite-ssh-20261031.py"
      - "tests/test_google_offsite_ssh_probe_20261031.py"
      - ".github/workflows/google-pinned-ssh-proof-contract.yml"
  push:
    branches: [main]
    paths:
      - "scripts/operations/verify-google-offsite-ssh-20261031.py"
      - "tests/test_google_offsite_ssh_probe_20261031.py"
      - ".github/workflows/google-pinned-ssh-proof-contract.yml"
permissions:
  contents: read
jobs:
  pinned-ssh-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Fixed single-key, host-pin-before-SSH, no-write negative suite
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s tests -p 'test_google_offsite_ssh_probe_20261031.py' -v
          echo "REMOTE_SSH_REAL_LOGIN=NOT_TESTED_BY_CI"
          echo "BACKUP_CREATED=NO"
