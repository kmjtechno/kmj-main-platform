name: Pinned Google SFTP Root Config Safety
on:
  pull_request:
    paths:
      - 'scripts/operations/prepare-pinned-offsite-sftp-config-20261031.py'
      - 'tests/test_pinned_offsite_sftp_config_20261031.py'
      - '.github/workflows/pinned-sftp-config-contract.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/operations/prepare-pinned-offsite-sftp-config-20261031.py'
      - 'tests/test_pinned_offsite_sftp_config_20261031.py'
      - '.github/workflows/pinned-sftp-config-contract.yml'
permissions:
  contents: read
jobs:
  safe-config:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify pinned no-clobber config and adversarial test fixtures
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s tests -p 'test_pinned_offsite_sftp_config_20261031.py' -v
          echo 'PINNED_SFTP_CONFIG=TESTED_SOURCE_ONLY'
          echo 'BACKUP_CREATED=NO'
