name: KMJ P520 One-Click Candidate Source Inspect QA
on:
  pull_request:
    paths:
      - 'scripts/windows/P520-ELITE-CANDIDATE-SOURCE-LAUNCH-20261119.ps1'
      - 'scripts/windows/test-P520-ELITE-CANDIDATE-SOURCE-LAUNCH-20261119.mjs'
      - 'scripts/operations/kmj-p520-current-candidate-source-doctor-20261118.sh'
      - '.github/workflows/kmj-p520-candidate-source-launch-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-launch-qa:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 7
    steps:
      - name: Pin exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Native Windows parser and source/SSH no-bypass tests
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          node --test scripts/windows/test-P520-ELITE-CANDIDATE-SOURCE-LAUNCH-20261119.mjs
          echo 'REAL_SSH_OR_SCP=NOT_EXECUTED'
          echo 'PRODUCTION_AND_BACKUP_MUTATION=NONE'
