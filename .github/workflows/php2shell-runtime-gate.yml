name: PHP2Shell security runtime gate

on:
  push:
    paths:
      - 'scripts/security/php2shell-version-gate.sh'
      - '.github/workflows/php2shell-runtime-gate.yml'
  pull_request:
    paths:
      - 'scripts/security/php2shell-version-gate.sh'
      - '.github/workflows/php2shell-runtime-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  supported-php-security-patches:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup supported patched PHP branch
        uses: shivammathur/setup-php@87d00bde2555f25eb54fedf940384e99cbdc55ef
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: PHP2Shell advisory gate (CLI only)
        run: bash scripts/security/php2shell-version-gate.sh
      - name: Assert gate rejects a known vulnerable PHP release
        run: |
          python3 - <<'PY'
          floors = {(8,2):35, (8,3):36, (8,4):27, (8,5):12}
          for (major, minor), patch in floors.items():
              assert patch > 0
              assert (major, minor, patch-1) < (major, minor, patch)
          print("PATCH_FLOORS_TEST=PASS")
          PY
