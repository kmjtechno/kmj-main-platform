name: Staging Promotion Gate

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-promotion-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify candidate for staging
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Setup Python 3.13 with pip cache
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install controller verification dependencies
        run: pip install -r requirements.txt

      - name: Compile controller
        run: python -m compileall controller

      - name: Verify locked runtime invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'KMJ_PAID_FALLBACK' render.yaml
          grep -q 'KMJ_LOCAL_LLM' render.yaml
          grep -q 'kmjtechno/kmj-main-platform' mission/main-platform.yaml
          grep -q 'cloud_nexus_policy: untouched' mission/main-platform.yaml
          grep -q 'paid_ai_fallback: prohibited' mission/main-platform.yaml
          grep -q 'local_llm_inference: prohibited' mission/main-platform.yaml
          grep -q 'no_free_route_status: NO_FREE_ROUTE_AVAILABLE' mission/main-platform.yaml

      - name: Verify architecture foundation
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/CODEOWNERS
          test -f docs/adr/ADR-001-system-boundaries.md
          test -f docs/adr/ADR-002-modular-monolith.md
          test -f docs/adr/ADR-003-commercial-authority-chain.md
          test -f docs/adr/ADR-004-cloud-ai-policy.md
          test -f docs/adr/ADR-005-kristi-governance.md
          test -f docs/architecture/first-vertical-slice.md
          test -f work/backlog.yaml
          test -f apps/platform/README.md
          test -f apps/platform/KMJ_BOUNDARY.md
          test -f packages/contracts/README.md
          test -f services/license-core/README.md
          test -f tests/architecture/README.md
          grep -q 'Cloud Nexus remains a separate engineering IDE' docs/adr/ADR-001-system-boundaries.md
          grep -q 'NO_FREE_ROUTE_AVAILABLE' docs/adr/ADR-004-cloud-ai-policy.md
          grep -q 'Organization -> Product -> Entitlement' docs/architecture/first-vertical-slice.md
          grep -q 'production_requires_owner_approval: true' work/backlog.yaml

      - name: Verify versioned contracts
        run: python scripts/verify_contracts.py

      - name: Verify module architecture
        run: python scripts/verify_architecture.py

      - name: Verify platform runtime provenance
        run: python scripts/verify_runtime.py

      - name: Setup PHP 8.5
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2 exact pin used by current runtime CI
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: Setup Node 22 with npm cache
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/platform/package-lock.json

      - name: Prepare deterministic CI database
        working-directory: apps/platform
        shell: bash
        run: |
          set -euo pipefail
          touch database/database.sqlite

      - name: Install and build platform deterministically
        working-directory: apps/platform
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ${{ github.workspace }}/apps/platform/database/database.sqlite
        run: |
          set -euo pipefail
          composer install --no-interaction --prefer-dist --no-progress
          test -f .env || cp .env.example .env
          php artisan key:generate --force
          php artisan migrate --force
          npm ci --no-audit --no-fund
          npm run build

      - name: Run platform quality checks
        working-directory: apps/platform
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ${{ github.workspace }}/apps/platform/database/database.sqlite
        run: composer ci:check

  promote:
    name: Promote verified commit to staging-approved
    needs: verify
    if: ${{ needs.verify.result == 'success' && github.ref == 'refs/heads/main' }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Move staging-approved only after all verification passes
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          response="$(mktemp)"
          code="$(curl --silent --show-error \
            --output "$response" \
            --write-out '%{http_code}' \
            --request PATCH \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${REPOSITORY}/git/refs/heads/staging-approved" \
            --data "{\"sha\":\"${SHA}\",\"force\":false}")"

          if [[ "$code" != "200" ]]; then
            cat "$response"
            echo "Promotion failed with HTTP ${code}. staging-approved was not moved."
            exit 1
          fi

          python - "$response" "$SHA" <<'PY'
          import json
          import sys

          path, expected = sys.argv[1:]
          data = json.load(open(path))
          actual = data['object']['sha']
          if actual != expected:
              raise SystemExit(f'promotion mismatch: expected {expected}, got {actual}')
          print(f'Promoted verified commit: {actual}')
          PY
