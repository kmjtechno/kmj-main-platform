name: KMJ PR884 CE6 Pinned Owner Prepare QA
on:
  pull_request:
    paths:
      - "scripts/KMJ_PR884_CE6_OWNER_PREPARE_20261116.sh"
      - "scripts/test_KMJ_PR884_CE6_OWNER_PREPARE_20261116.py"
      - ".github/workflows/kmj-pr884-ce6-prep-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-only-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify CE6 predecessor, exact candidate and no new migrations
        shell: bash
        run: |
          set -Eeuo pipefail
          previous=ce6ad7dc9d898dce1ba9561a0e221f8ad750180f
          target=b5e7ad41eaf9ef9468731a6a47499c9b67dc8348
          git cat-file -e "$previous^{commit}"
          git cat-file -e "$target^{commit}"
          [[ "$(git merge-base "$previous" "$target")" == "$previous" ]]
          if git diff --name-only "$previous" "$target" -- apps/platform/database/migrations | grep .; then
            echo "MIGRATIONS_REQUIRE_SEPARATE_OWNER_REVIEW"
            exit 2
          fi
          bash -n scripts/KMJ_PR884_CE6_OWNER_PREPARE_20261116.sh
          echo EXACT_COMMIT_PAIR_AND_NO_NEW_MIGRATIONS=PASS
      - name: Reject unsafe owner preparation paths
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -B -m unittest discover -s scripts \
            -p 'test_KMJ_PR884_CE6_OWNER_PREPARE_20261116.py' -v
          echo ROOT_COMMANDS=NOT_EXECUTED
          echo OFFSITE_GOOGLE_RESTORE=NOT_PERFORMED
          echo PRODUCTION_ACTIVATION=NOT_ATTEMPTED
