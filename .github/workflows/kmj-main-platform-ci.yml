name: KMJ Main Platform CI

on:
  push:
    branches:
      - feat/homepage-worldclass
  pull_request:
  workflow_dispatch:

concurrency:
  group: kmj-main-platform-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  platform:
    name: Laravel + TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@87d00bde2555f25eb54fedf940384e99cbdc55ef
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, sodium
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/platform/package-lock.json
      - name: Verify hosted runtime
        run: |
          set -euo pipefail
          php --version
          composer --version
          node --version
          npm --version
          php -r 'exit(PHP_VERSION_ID >= 80300 && PHP_VERSION_ID < 80600 ? 0 : 1);'
          node -e 'const m=Number(process.versions.node.split(".")[0]); process.exit(m === 22 ? 0 : 1)'
      - name: Install, build and verify platform with parallel lanes
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ${{ github.workspace }}/apps/platform/database/database.sqlite
        run: bash "$GITHUB_WORKSPACE/ops/self-hosted-runner/verify-platform.sh"
      - name: Show frontend format patch when verification fails
        if: failure()
        run: |
          set -Eeuo pipefail
          cd apps/platform
          if [[ ! -x node_modules/.bin/vp ]]; then
            echo 'Frontend dependencies unavailable; no format preview.'
            exit 0
          fi
          # Temporary PR #645 exact formatter diagnostics, remove after readback.
          node_modules/.bin/vp fmt scripts/browser-preview-verify.mjs \
            scripts/check-visual-qa-coverage.test.mjs || true
          git diff -- scripts/browser-preview-verify.mjs \
            scripts/check-visual-qa-coverage.test.mjs

  codebridge-windows-oneclick:
    name: Windows one-click PowerShell parser
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Reject invalid Windows CodeBridge installer scripts
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $file = 'apps/platform/resources/codebridge/install-windows-device.ps1'
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path -LiteralPath $file).Path, [ref]$tokens, [ref]$errors
          )
          if (@($errors).Count -ne 0) {
            foreach ($problem in $errors) {
              Write-Output ('KMJ_INSTALLER_PARSE_ERROR=' + $problem.ErrorId)
            }
            throw 'KMJ_WINDOWS_ONECLICK_PARSER_FAILED'
          }
          $badTokens = $null
          $badErrors = $null
          [void][System.Management.Automation.Language.Parser]::ParseInput(
            "Write-Output 'unterminated", [ref]$badTokens, [ref]$badErrors
          )
          if (@($badErrors).Count -eq 0) {
            throw 'KMJ_WINDOWS_PARSER_NEGATIVE_CONTROL_FAILED'
          }
          Write-Output 'KMJ_WINDOWS_ONECLICK_PARSER=PASS'

  license-core:
    name: Native Rust license verifier
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Rust tests and contract integrity
        run: |
          set -euo pipefail
          RUNNER_USER_HOME="$(getent passwd "$(id -un)" | cut -d: -f6)"
          source "${RUNNER_USER_HOME}/.cargo/env"
          rustup default stable
          rustup component add rustfmt
          cargo fmt --manifest-path services/license-core/Cargo.toml --check
          cargo test --locked --manifest-path services/license-core/Cargo.toml
          bash contracts/kslp-v1/verify-contract.sh
