name: KMJ KSLP One-Time Trial Batch CSV Safety
on:
  pull_request:
    paths:
      - 'apps/platform/resources/js/lib/one-time-trial-batch-csv.mjs'
      - 'apps/platform/resources/js/pages/developer-apps.tsx'
      - 'apps/platform/scripts/check-one-time-trial-batch-csv.test.mjs'
      - '.github/workflows/kslp-one-time-trial-batch-csv-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  trial-key-csv-local-only:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Synthetic customer CSV no-server persistence and malformed-key rejection
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          cd apps/platform
          node --test scripts/check-one-time-trial-batch-csv.test.mjs
          echo 'REAL_CUSTOMER_KEYS=NONE'
          echo 'LICENSES_CREATED=NONE'
          echo 'PRODUCTION_OR_BACKUP_MUTATION=NONE'
