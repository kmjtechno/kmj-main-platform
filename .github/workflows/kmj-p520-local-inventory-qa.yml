name: KMJ P520 Independent Offsite Read-Only Inventory QA
on:
  pull_request:
    paths:
      - 'scripts/windows/P520-OFFSITE-LOCAL-INVENTORY-20261118.ps1'
      - 'scripts/windows/test-P520-OFFSITE-LOCAL-INVENTORY-20261118.mjs'
      - '.github/workflows/kmj-p520-local-inventory-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory-qa:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 6
    steps:
      - name: Immutable branch checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Native Windows or portable structural read-only tests
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          node --test scripts/windows/test-P520-OFFSITE-LOCAL-INVENTORY-20261118.mjs
          echo 'HOST_OR_TASK_MUTATION=NONE'
          echo 'WINDOWS_P520_REAL_RESTORE=NOT_EXECUTED'
          echo 'PRODUCTION_RELEASE_APPROVAL=NOT_GRANTED'
