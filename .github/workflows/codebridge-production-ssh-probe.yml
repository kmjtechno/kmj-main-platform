name: CodeBridge Production SSH Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/codebridge-production-ssh-probe.yml'
  pull_request:
    paths:
      - '.github/workflows/codebridge-production-ssh-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 10
    steps:
      - name: Diagnose existing SSH route without exposing secrets
        env:
          SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          SSH_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          STAGING_PATH: ${{ vars.STAGING_APP_PATH }}
        shell: bash
        run: |
          set -euo pipefail
          for name in SSH_HOST SSH_USER SSH_KEY STAGING_PATH; do
            if [ -z "${!name:-}" ]; then
              echo "config_$name=missing"
              exit 2
            fi
          done
          echo "configuration=present"

          if python3 - "$SSH_HOST" <<'PY'
          import socket, sys
          try:
              socket.getaddrinfo(sys.argv[1], 22, type=socket.SOCK_STREAM)
          except Exception:
              raise SystemExit(1)
          PY
          then
            echo "dns_resolution=pass"
          else
            echo "dns_resolution=fail"
            exit 3
          fi

          if python3 - "$SSH_HOST" <<'PY'
          import socket, sys
          try:
              with socket.create_connection((sys.argv[1], 22), timeout=10):
                  pass
          except Exception:
              raise SystemExit(1)
          PY
          then
            echo "tcp_22=pass"
          else
            echo "tcp_22=fail"
            exit 4
          fi

          dir="$(mktemp -d)"
          trap 'rm -rf "$dir"' EXIT
          printf '%s' "$SSH_KEY" | sed 's/\\n/\n/g' | tr -d '\r' > "$dir/id_ed25519"
          printf '\n' >> "$dir/id_ed25519"
          chmod 600 "$dir/id_ed25519"
          if ssh-keygen -y -f "$dir/id_ed25519" >/dev/null 2>&1; then
            echo "private_key=parse_ok"
          else
            echo "private_key=parse_fail"
            exit 5
          fi

          if ssh-keyscan -T 10 -H "$SSH_HOST" > "$dir/known_hosts" 2>/dev/null; then
            echo "host_key_scan=pass"
          else
            echo "host_key_scan=fail"
            exit 6
          fi

          set +e
          ssh -i "$dir/id_ed25519" \
            -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="$dir/known_hosts" \
            -o StrictHostKeyChecking=yes \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            "$SSH_USER@$SSH_HOST" bash -s -- "$STAGING_PATH" >"$dir/remote.out" 2>"$dir/ssh.err" <<'REMOTE'
          set -euo pipefail
          STAGING_PATH="$1"
          echo "remote_hostname=$(hostname)"
          echo "remote_user=$(id -un)"
          echo "staging_path_real=$(readlink -f "$STAGING_PATH" 2>/dev/null || printf missing)"
          echo "nginx_active=$(systemctl is-active nginx 2>/dev/null || true)"
          echo "php83_active=$(systemctl is-active php8.3-fpm 2>/dev/null || true)"
          echo "php84_active=$(systemctl is-active php8.4-fpm 2>/dev/null || true)"
          echo "local_http_begin"
          curl -sS -o /dev/null -w 'local_http_status=%{http_code} total=%{time_total}\n' --max-time 10 -H 'Host: kmjtechno.com' http://127.0.0.1/ || true
          echo "local_https_begin"
          curl -k -sS -o /dev/null -w 'local_https_status=%{http_code} total=%{time_total}\n' --max-time 10 --resolve kmjtechno.com:443:127.0.0.1 https://kmjtechno.com/.well-known/oauth-authorization-server || true
          echo "render_outbound_begin"
          curl -sS -o /dev/null -w 'render_status=%{http_code} total=%{time_total}\n' --max-time 20 https://kmj-codebridge-gateway.onrender.com/healthz || true
          if [ -e /home/kmjprod/current ]; then
            echo "production_path_visible=yes"
            echo "production_current_real=$(readlink -f /home/kmjprod/current)"
            if [ -r /home/kmjprod/current/apps/platform/app/Services/CodeBridge/OAuth/OAuthServer.php ]; then
              echo "production_codebridge_readable=yes"
              printf 'production_oauth_server_blob='
              git hash-object /home/kmjprod/current/apps/platform/app/Services/CodeBridge/OAuth/OAuthServer.php
            else
              echo "production_codebridge_readable=no"
            fi
          else
            echo "production_path_visible=no"
          fi
          REMOTE
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            if grep -qi 'permission denied' "$dir/ssh.err"; then
              echo "ssh_authentication=fail"
            elif grep -qiE 'timed out|no route to host|connection refused|connection reset' "$dir/ssh.err"; then
              echo "ssh_transport=fail"
            else
              echo "ssh_session=fail"
            fi
            exit 7
          fi
          echo "ssh_session=pass"
          cat "$dir/remote.out"
