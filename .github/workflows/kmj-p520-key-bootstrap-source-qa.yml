name: KMJ P520 Private Key Bootstrap Source QA
on:
  pull_request:
    paths:
      - 'scripts/windows/P520-OFFSITE-KEY-BOOTSTRAP-20261116.mjs'
      - 'scripts/windows/test-P520-OFFSITE-KEY-BOOTSTRAP-20261116.mjs'
      - '.github/workflows/kmj-p520-key-bootstrap-source-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Node standard crypto primitives only, no AGE key provisioned on CI
        run: |
          set -Eeuo pipefail
          node --version
          node --test scripts/windows/test-P520-OFFSITE-KEY-BOOTSTRAP-20261116.mjs
          echo OWNER_PRIVATE_KEY_CREATED=NO
          echo GOOGLE_VPS_REQUIRED=NO
          echo PRODUCTION_APPROVAL=NOT_GRANTED
