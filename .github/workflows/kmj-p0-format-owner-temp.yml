name: KMJ P0 Owner Type Formatting Diff (Temporary)
on:
  pull_request:
    paths:
      - '.github/workflows/kmj-p0-format-owner-temp.yml'
      - 'apps/platform/resources/js/pages/welcome.tsx'
      - 'apps/platform/resources/js/components/public-site-header.tsx'
permissions:
  contents: read
jobs:
  format-diff:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Show repository formatter diff only
        shell: bash
        run: |
          set -euo pipefail
          cd apps/platform
          npm ci --ignore-scripts --no-audit --no-fund --silent
          npm run check:fix
          git diff -- resources/js/pages/welcome.tsx resources/js/components/public-site-header.tsx
          echo FORMAT_ONLY=PASS
