name: Fix staging monitor PHPStan

on:
  push:
    branches:
      - feat/staging-live-monitor

permissions:
  contents: write

concurrency:
  group: fix-staging-monitor-phpstan
  cancel-in-progress: true

jobs:
  fix:
    runs-on: [self-hosted, linux, x64, kmj-main-platform-ci]
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/staging-live-monitor
          persist-credentials: true

      - name: Apply static-analysis corrections
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('apps/platform/app/Http/Controllers/StagingMonitoringController.php')
          text = path.read_text()
          old_load = "is_array($load) && isset($load[0]) && $cpuCount > 0"
          new_load = "$load !== false && $cpuCount > 0"
          old_uptime = "$value = explode(' ', trim($uptime))[0] ?? null;"
          new_uptime = "$value = explode(' ', trim($uptime))[0];"
          if old_load not in text or old_uptime not in text:
              raise SystemExit('Expected PHPStan correction targets were not found')
          text = text.replace(old_load, new_load, 1).replace(old_uptime, new_uptime, 1)
          path.write_text(text)
          PY

      - name: Commit correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'KMJ CI Fixer'
          git config user.email '158804600+kmjtechno@users.noreply.github.com'
          git add apps/platform/app/Http/Controllers/StagingMonitoringController.php
          git commit -m 'fix(monitoring): satisfy static analysis contracts'
          git push origin HEAD:feat/staging-live-monitor
