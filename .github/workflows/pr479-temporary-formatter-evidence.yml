name: Temporary PR479 formatter evidence
on:
  push:
    branches:
      - fix/locked-ui-super-admin-actions-20261019
permissions:
  contents: read
jobs:
  format-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Reuse existing locked platform dependencies
        working-directory: apps/platform
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Print formatter result for four public source files
        working-directory: apps/platform
        shell: bash
        run: |
          set -euo pipefail
          ./node_modules/.bin/vp check --fix >/tmp/kmj-format-check.log 2>&1 || true
          paths=(resources/js/pages/welcome.tsx resources/js/pages/operator.tsx scripts/check-command-os-visual-lock.test.mjs scripts/check-homepage-portfolio.test.mjs)
          for i in "${!paths[@]}"; do
            printf 'KMJ_FORMAT_BEGIN_%s\n' "$i"
            base64 -w0 "${paths[$i]}" | fold -w 4000
            printf '\nKMJ_FORMAT_END_%s\n' "$i"
          done
