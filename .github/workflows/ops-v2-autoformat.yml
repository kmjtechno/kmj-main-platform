name: Ops V2 One-shot Formatter

on:
  push:
    branches:
      - feat/ops-command-center-v2

permissions:
  contents: write

concurrency:
  group: ops-v2-autoformat
  cancel-in-progress: false

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/ops-command-center-v2
          persist-credentials: true

      - name: Setup Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'

      - name: Canonical format changed frontend
        working-directory: apps/platform
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          ./node_modules/.bin/vp fmt resources/js/pages/operator-ops.tsx resources/js/data/delivery-progress.ts

      - name: Commit formatter output when changed
        run: |
          set -euo pipefail
          if git diff --quiet -- apps/platform/resources/js/pages/operator-ops.tsx apps/platform/resources/js/data/delivery-progress.ts; then
            echo "Formatter produced no changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/platform/resources/js/pages/operator-ops.tsx apps/platform/resources/js/data/delivery-progress.ts
          git commit -m "style(ops): apply canonical frontend formatting"
          git push origin HEAD:feat/ops-command-center-v2
