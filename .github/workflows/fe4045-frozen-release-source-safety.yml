name: KMJ FE4045 Frozen Release Source Safety
on:
  pull_request:
    paths:
      - 'scripts/operations/*fe4045*'
      - 'scripts/test_fe4045_frozen_release_contract.py'
      - '.github/workflows/fe4045-frozen-release-source-safety.yml'
permissions:
  contents: read
jobs:
  snapshot-safety:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify frozen release pin and non-deploying safeguards
        run: |
          set -Eeuo pipefail
          python3 -B -m unittest discover -s scripts -p test_fe4045_frozen_release_contract.py -v
          echo 'SOURCE_CONTRACT=PASS'
          echo 'OWNER_QA_AND_PRODUCTION_APPROVAL=NOT_RUN_BY_CI'
