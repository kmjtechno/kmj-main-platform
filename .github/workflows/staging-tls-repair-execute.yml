name: Staging P0 TLS Repair (Pinned Host)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/staging-tls-repair-execute.yml'
      - '.github/workflows/staging-tls-repair-pinned.yml'
      - 'infra/server/KMJ_STAGE_TLS_REPAIR.sh'
      - 'scripts/test_staging_tls_repair_contract.py'
      - 'infra/server/trust/kmj-elite-staging-known_hosts'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-p0-tls-repair
  cancel-in-progress: false

jobs:
  contract:
    name: Fixed staging TLS repair contract
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - run: |
          set -Eeuo pipefail
          bash -n infra/server/KMJ_STAGE_TLS_REPAIR.sh
          python3 -B scripts/test_staging_tls_repair_contract.py

  repair:
    name: Repair staging-only certificate with pinned SSH trust
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    environment: staging
    steps:
      - name: Checkout protected source of the fixed staging repair script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Validate public staging DNS resolves only globally routed IPv4
        shell: bash
        run: |
          set -Eeuo pipefail
          stage_host='staging.kmjtechno.com'
          mapfile -t resolved < <(getent ahostsv4 "$stage_host" | awk '{print $1}' | sort -u)
          [[ "${#resolved[@]}" -ge 1 && "${#resolved[@]}" -le 8 ]] || {
            echo 'STAGING_TLS_REPAIR=BLOCKED DNS_CHANGED_OR_AMBIGUOUS'
            exit 2
          }
          python3 - "${resolved[@]}" <<'KMJ_VERIFY_GLOBAL_IP'
          import ipaddress
          import sys
          try:
              for raw in sys.argv[1:]:
                  addr = ipaddress.IPv4Address(raw)
                  assert addr.is_global and not addr.is_reserved and not addr.is_multicast
          except (ValueError, AssertionError):
              raise SystemExit("STAGING_TLS_REPAIR=BLOCKED INVALID_PUBLIC_IPV4")
          KMJ_VERIFY_GLOBAL_IP
          echo 'STAGING_DNS_PIN=PASS'
      - name: Verify pinned SSH connection and execute staging-only repair
        shell: bash
        env:
          # IP-independent DNS name; exact ED25519 host key remains pinned in source.
          SSH_HOST: 'elite-ssh.kmjtechno.com'
          SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
        run: |
          set -Eeuo pipefail
          umask 077
          # DNS may change IP; require the same exact authenticated SSH server identity.
          [[ "$SSH_HOST" == 'elite-ssh.kmjtechno.com' ]] || {
            echo 'STAGING_TLS_REPAIR=BLOCKED STAGING_VPS_IDENTITY_MISMATCH'; exit 2;
          }
          [[ "$SSH_USER" =~ ^[a-z_][a-z0-9_-]*$ ]] || {
            echo 'STAGING_TLS_REPAIR=BLOCKED SSH_USER_NOT_CONFIGURED'; exit 2;
          }
          [[ -n "$SSH_PRIVATE_KEY" ]] || {
            echo 'STAGING_TLS_REPAIR=BLOCKED LOGIN_KEY_MISSING'; exit 2;
          }
          # Web stage hostname may be Cloudflare-proxied; direct SSH uses a
          # separate DNS-only name whose exact host public key remains pinned.
          mapfile -t ssh_ips < <(getent ahostsv4 "$SSH_HOST" | awk '{print $1}' | sort -u)
          [[ "${#ssh_ips[@]}" -eq 1 ]] || {
            echo 'STAGING_TLS_REPAIR=BLOCKED SSH_DNS_AMBIGUOUS'; exit 2;
          }
          python3 - "${ssh_ips[0]}" <<'KMJ_VERIFY_SSH_GLOBAL'
          import ipaddress
          import sys
          try:
              addr = ipaddress.IPv4Address(sys.argv[1])
              assert addr.is_global and not addr.is_reserved and not addr.is_multicast
          except (ValueError, AssertionError):
              raise SystemExit("STAGING_TLS_REPAIR=BLOCKED SSH_DNS_INVALID")
          KMJ_VERIFY_SSH_GLOBAL
          trusted_hosts='infra/server/trust/kmj-elite-staging-known_hosts'
          [[ -f "$trusted_hosts" && ! -L "$trusted_hosts" ]] || {
            echo 'STAGING_TLS_REPAIR=BLOCKED TRUSTED_HOSTS_FILE_MISSING'; exit 2;
          }
          [[ "$(wc -l < "$trusted_hosts")" -eq 1 ]] || {
            echo 'STAGING_TLS_REPAIR=BLOCKED TRUSTED_HOSTS_FILE_INVALID'; exit 2;
          }
          work="$(mktemp -d)"
          trap 'rm -rf -- "$work"' EXIT
          chmod 700 "$work"
          printf '%s\n' "$SSH_PRIVATE_KEY" | sed 's/\\n/\n/g' | tr -d '\r' >"$work/id"
          cp "$trusted_hosts" "$work/known_hosts"
          chmod 600 "$work/id" "$work/known_hosts"
          ssh-keygen -y -f "$work/id" >/dev/null 2>&1 || {
            echo 'STAGING_TLS_REPAIR=BLOCKED INVALID_PINNED_SSH_KEY'; exit 2;
          }
          ssh-keygen -F "$SSH_HOST" -f "$work/known_hosts" >/dev/null 2>&1 || {
            echo 'STAGING_TLS_REPAIR=BLOCKED HOST_KEY_NOT_PINNED'; exit 2;
          }
          source_sha256="$(sha256sum infra/server/KMJ_STAGE_TLS_REPAIR.sh | cut -d' ' -f1)"
          [[ "$source_sha256" =~ ^[a-f0-9]{64}$ ]]
          ssh -i "$work/id" -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$work/known_hosts" \
            -o ConnectTimeout=12 "$SSH_USER@$SSH_HOST" bash -se -- "$source_sha256" <<'KMJ_STAGE_ONLY'
          set -Eeuo pipefail
          expected_sha="$1"
          [[ "$expected_sha" =~ ^[a-f0-9]{64}$ ]] || exit 2
          # Only the existing, checksum-matching guarded staging certificate
          # repair is authorized. Production release pointer must not change.
          [[ "$(hostname -s)" == 'KMJ-elite' ]] || {
            echo 'STAGING_TLS_REPAIR=BLOCKED WRONG_HOST'; exit 2;
          }
          f=/root/KMJ_STAGE_TLS_REPAIR.sh
          before="$(readlink -f /home/kmjprod/current)" || exit 2
          [[ -d "$before" ]] || exit 2
          actual_sha="$(sudo -n sha256sum "$f" | cut -d' ' -f1)" || {
            echo 'STAGING_TLS_REPAIR=BLOCKED OPERATOR_SCRIPT_NOT_INSTALLED'; exit 2;
          }
          [[ "$actual_sha" == "$expected_sha" ]] || {
            echo 'STAGING_TLS_REPAIR=BLOCKED SCRIPT_SHA_MISMATCH'; exit 2;
          }
          sudo -n bash "$f" || {
            echo 'STAGING_TLS_REPAIR=FAIL GUARDED_STAGE_CERT_REPAIR'; exit 1;
          }
          after="$(readlink -f /home/kmjprod/current)" || exit 1
          [[ "$before" == "$after" ]] || {
            echo 'STAGING_TLS_REPAIR=FAIL PRODUCTION_RELEASE_POINTER_CHANGED'; exit 1;
          }
          echo 'STAGING_TLS_REPAIR=PASS GUARDED_SCRIPT'
          KMJ_STAGE_ONLY
      - name: Verify exact staging hostname TLS without bypass or redirect
        shell: bash
        run: |
          set -Eeuo pipefail
          status="$(curl --proto '=https' --fail --silent --show-error --max-time 20 \
            -o /dev/null -w '%{http_code}' https://staging.kmjtechno.com/)"
          [[ "$status" == 200 ]] || exit 1
          echo 'STAGING_TLS_EXTERNAL_VALIDATION=PASS'
          echo 'PRODUCTION_DEPLOYMENT=NOT_ATTEMPTED'
