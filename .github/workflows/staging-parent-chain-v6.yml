name: Staging Parent Chain V6 Read Only Contract
on:
  pull_request:
    paths:
      - 'scripts/operations/audit-stage-parent-chain-v6.py'
      - 'scripts/test_stage_parent_chain_v6.py'
      - '.github/workflows/staging-parent-chain-v6.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  read-only-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Parent-chain fail-closed offline tests
        run: |
          set -Eeuo pipefail
          python3 -B -m py_compile scripts/operations/audit-stage-parent-chain-v6.py
          python3 -B -m unittest discover -s scripts -p test_stage_parent_chain_v6.py -v
          if python3 -B scripts/operations/audit-stage-parent-chain-v6.py; then
            echo 'ERROR: unprivileged host accepted'
            exit 1
          fi
          echo 'SOURCE_ONLY_NO_HOST_MUTATION=PASS'
