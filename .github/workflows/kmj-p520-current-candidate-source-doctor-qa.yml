name: KMJ P520 CE6 to Licensing Hub Source Doctor QA

on:
  pull_request:
    paths:
      - 'scripts/operations/kmj-p520-current-candidate-source-doctor-20261118.sh'
      - 'scripts/operations/test-p520-current-candidate-source-doctor-20261118.mjs'
      - '.github/workflows/kmj-p520-current-candidate-source-doctor-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readonly-candidate-witness-qa:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - name: Exact immutable head checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Static source and native bash fail-closed tests
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          node --test scripts/operations/test-p520-current-candidate-source-doctor-20261118.mjs
          echo 'PRODUCTION_AND_BACKUP_MUTATION=NONE'
          echo 'REAL_P520_ENCRYPTED_BACKUP=NOT_CREATED'
          echo 'PRODUCTION_APPROVAL=NOT_GRANTED'
