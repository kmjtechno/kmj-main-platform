name: CodeBridge Owner Tier Self-Hosted Verification

on:
  push:
    branches: [feat/codebridge-owner-tier]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codebridge-owner-tier-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: [self-hosted, linux, x64, kmj-main-platform-ci]
    timeout-minutes: 25
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Verify CodeBridge owner tier and platform regression
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ${{ github.workspace }}/apps/platform/database/database.sqlite
        shell: bash
        run: |
          set -euo pipefail
          bash "$GITHUB_WORKSPACE/ops/self-hosted-runner/verify-platform.sh"
