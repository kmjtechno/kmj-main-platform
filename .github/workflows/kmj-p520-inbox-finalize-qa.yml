name: KMJ P520 Encrypted Inbox No-Clobber Finalization QA
on:
  pull_request:
    paths:
      - 'scripts/windows/P520-OFFSITE-INBOX-FINALIZE-20261116.mjs'
      - 'scripts/windows/test-P520-OFFSITE-INBOX-FINALIZE-20261116.mjs'
      - '.github/workflows/kmj-p520-inbox-finalize-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Real temp filesystem safe finalize/no clobber fixtures
        run: |
          set -Eeuo pipefail
          node --test scripts/windows/test-P520-OFFSITE-INBOX-FINALIZE-20261116.mjs
          echo REAL_P520_RECEIVE=NOT_EXECUTED
          echo GOOGLE_DEPENDENCY=NONE
          echo DECRYPT_PG_RESTORE=NOT_EXECUTED
          echo PRODUCTION_APPROVAL=NOT_GRANTED
