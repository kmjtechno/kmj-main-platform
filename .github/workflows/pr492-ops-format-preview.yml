name: PR492 ops fixture format preview
on:
  pull_request:
    types: [synchronize]
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install source-pinned formatter
        working-directory: apps/platform
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Print repository-formatted test files for review
        working-directory: apps/platform
        run: |
          set -euo pipefail
          ./node_modules/.bin/vp fmt
          ./node_modules/.bin/vp fmt --check
          for filename in scripts/browser-preview-verify.mjs visual/entry.tsx; do
            echo "KMJ_OPS_FORMAT_BEGIN ${filename}"
            base64 -w0 "${filename}"
            echo
            echo "KMJ_OPS_FORMAT_END ${filename}"
          done
