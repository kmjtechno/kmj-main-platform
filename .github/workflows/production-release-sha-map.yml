name: Production Release SHA Map Contract
on:
  pull_request:
    paths:
      - 'scripts/operations/production_release_sha_map.py'
      - 'scripts/operations/refresh_production_release_sha_map.py'
      - 'scripts/test_refresh_production_release_sha_map.py'
      - 'scripts/test_production_release_sha_map.py'
      - '.github/workflows/production-release-sha-map.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/operations/production_release_sha_map.py'
      - 'scripts/operations/refresh_production_release_sha_map.py'
      - 'scripts/test_refresh_production_release_sha_map.py'
      - 'scripts/test_production_release_sha_map.py'
      - '.github/workflows/production-release-sha-map.yml'
permissions:
  contents: read
jobs:
  map-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: |
          python3 -B -m unittest discover -s scripts -p test_production_release_sha_map.py -v
          python3 -B -m unittest discover -s scripts -p test_refresh_production_release_sha_map.py -v
