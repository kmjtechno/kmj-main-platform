name: Production Release SHA Map Contract
on:
  pull_request:
    paths:
      - 'scripts/operations/elite_admission_broker.py'
      - 'scripts/test_elite_admission_broker.py'
      - 'scripts/operations/install-elite-production-sha-map-20261128.py'
      - 'scripts/test_install_elite_production_sha_map.py'
      - 'scripts/operations/production_release_sha_map.py'
      - 'scripts/operations/refresh_production_release_sha_map.py'
      - 'scripts/test_refresh_production_release_sha_map.py'
      - 'scripts/test_production_release_sha_map.py'
      - 'infra/server/systemd/kmj-elite-production-sha-map.service'
      - 'infra/server/systemd/kmj-elite-release-admission-broker.service.d/20-production-sha-map.conf'
      - '.github/workflows/production-release-sha-map.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/operations/elite_admission_broker.py'
      - 'scripts/test_elite_admission_broker.py'
      - 'scripts/operations/install-elite-production-sha-map-20261128.py'
      - 'scripts/test_install_elite_production_sha_map.py'
      - 'scripts/operations/production_release_sha_map.py'
      - 'scripts/operations/refresh_production_release_sha_map.py'
      - 'scripts/test_refresh_production_release_sha_map.py'
      - 'scripts/test_production_release_sha_map.py'
      - 'infra/server/systemd/kmj-elite-production-sha-map.service'
      - 'infra/server/systemd/kmj-elite-release-admission-broker.service.d/20-production-sha-map.conf'
      - '.github/workflows/production-release-sha-map.yml'
permissions:
  contents: read
jobs:
  map-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Ensure isolated runner has Nginx
        run: |
          command -v nginx || (sudo apt-get update -qq && sudo apt-get install -y nginx-light)
          command -v nginx
      - name: Verify exact SHA mapping and rollback contract
        run: |
          python3 -B -m unittest discover -s scripts -p test_production_release_sha_map.py -v
          python3 -B -m unittest discover -s scripts -p test_refresh_production_release_sha_map.py -v
          python3 -B -m unittest discover -s scripts -p test_elite_admission_broker.py -v
          python3 -B -m unittest discover -s scripts -p test_install_elite_production_sha_map.py -v
