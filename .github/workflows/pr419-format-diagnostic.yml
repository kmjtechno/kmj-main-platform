name: PR419 Formatter Diff (temporary)
on:
  push:
    branches:
      - feat/payment-gateway-guided-onboarding-20261014
permissions:
  contents: read
jobs:
  formatter-diff:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked frontend tooling
        run: npm --prefix apps/platform ci --ignore-scripts --no-audit --no-fund
      - name: Print only payment test formatter diff without committing
        shell: bash
        run: |
          npm --prefix apps/platform run check:fix >/dev/null 2>&1 || true
          git --no-pager diff -- apps/platform/scripts/check-payment-onboarding.test.mjs
