name: CodeBridge Production VPS Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/codebridge-production-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public_vps:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check first-party OAuth discovery and public MCP gateway
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import urllib.error
          import urllib.request

          base = "https://kmjtechno.com"
          paths = (
              "/.well-known/oauth-authorization-server",
              "/.well-known/oauth-protected-resource/mcp",
              "/oauth/jwks.json",
          )
          for path in paths:
              with urllib.request.urlopen(base + path, timeout=20) as response:
                  if response.status != 200 or response.geturl() != base + path:
                      raise SystemExit("VPS_OAUTH_DISCOVERY=FAIL " + path)
                  data = response.read(131072)
                  if not data:
                      raise SystemExit("VPS_OAUTH_DISCOVERY=EMPTY " + path)
              print("VPS_OAUTH_DISCOVERY=PASS " + path)

          def rpc(method, params, id):
              body = json.dumps({
                  "jsonrpc": "2.0", "id": id,
                  "method": method, "params": params,
              }).encode()
              return urllib.request.Request(
                  base + "/mcp",
                  data=body,
                  method="POST",
                  headers={
                      "Content-Type": "application/json",
                      "Accept": "application/json, text/event-stream",
                  },
              )

          with urllib.request.urlopen(rpc("tools/list", {}, 1), timeout=25) as response:
              if response.status != 200 or response.geturl() != base + "/mcp":
                  raise SystemExit("VPS_MCP_DISCOVERY=HTTP_ERROR")
              raw = response.read(1048577)
              if len(raw) > 1048576:
                  raise SystemExit("VPS_MCP_DISCOVERY=OVERSIZE")
          body = raw.decode("utf-8", "replace")
          values = [body] + [
              line[5:].strip() for line in body.splitlines()
              if line.startswith("data:")
          ]
          names = set()
          for value in values:
              try:
                  parsed = json.loads(value)
              except (json.JSONDecodeError, ValueError):
                  continue
              tools = parsed.get("result", {}).get("tools", [])
              if isinstance(tools, list):
                  names = {tool.get("name") for tool in tools if isinstance(tool, dict)}
                  if names:
                      break
          if len(names) < 100 or not {
              "list_devices", "chat_workspace_open", "coordination_post",
          }.issubset(names):
              raise SystemExit("VPS_MCP_DISCOVERY=CATALOG_INCOMPLETE")
          print("VPS_MCP_DISCOVERY=PASS tools=" + str(len(names)))

          try:
              urllib.request.urlopen(rpc("resources/list", {}, 2), timeout=20)
              raise SystemExit("VPS_MCP_AUTH=FAIL_UNPROTECTED")
          except urllib.error.HTTPError as error:
              challenge = error.headers.get("WWW-Authenticate", "")
              if error.code != 401 or "resource_metadata" not in challenge:
                  raise SystemExit("VPS_MCP_AUTH=FAIL_CHALLENGE")
          print("VPS_MCP_AUTH=PASS")
          PY
