name: KMJ Offsite Exit3 Readonly Diagnostic CI

on:
  pull_request:
    paths:
      - 'scripts/operations/offsite_exit3_diagnostic_20261117.py'
      - 'scripts/operations/test_offsite_exit3_diagnostic_20261117.py'
      - '.github/workflows/offsite-exit3-diagnostic-ci.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/operations/offsite_exit3_diagnostic_20261117.py'
      - 'scripts/operations/test_offsite_exit3_diagnostic_20261117.py'
      - '.github/workflows/offsite-exit3-diagnostic-ci.yml'

permissions:
  contents: read

jobs:
  verify-exit3-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python syntax
        run: |
          python3 -B -m py_compile \
            scripts/operations/offsite_exit3_diagnostic_20261117.py \
            scripts/operations/test_offsite_exit3_diagnostic_20261117.py
      - name: Isolated no-root regression suite
        run: |
          python3 -B -m unittest discover \
            -s scripts/operations \
            -p 'test_offsite_exit3_diagnostic_20261117.py' \
            -v
