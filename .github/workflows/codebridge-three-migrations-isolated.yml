name: KMJ Three Migrations Isolated Rehearsal Contract

on:
  pull_request:
    paths:
      - 'scripts/operations/drill-codebridge-three-migrations-isolated-20261024.sh'
      - 'scripts/test_codebridge_three_migrations_isolated_20261024.py'
      - '.github/workflows/codebridge-three-migrations-isolated.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/operations/drill-codebridge-three-migrations-isolated-20261024.sh'
      - 'scripts/test_codebridge_three_migrations_isolated_20261024.py'
      - '.github/workflows/codebridge-three-migrations-isolated.yml'

permissions:
  contents: read

jobs:
  exact-sha-no-production:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify read-only production and isolated restore boundaries
        run: |
          set -euo pipefail
          bash -n scripts/operations/drill-codebridge-three-migrations-isolated-20261024.sh
          python3 -B scripts/test_codebridge_three_migrations_isolated_20261024.py -v
          echo 'THREE_MIGRATIONS_SOURCE_CONTRACT=PASS'
          echo 'REAL_DATABASE_REHEARSAL=NOT_ATTEMPTED_IN_CI'
          echo 'PRODUCTION_DATABASE_WRITES=NONE'
