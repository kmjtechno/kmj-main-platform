name: Autonomous Execution Worker

on:
  push:
    branches:
      - main
  workflow_dispatch:
  issues:
    types:
      - opened
      - reopened
      - labeled
  schedule:
    - cron: '*/5 * * * *'

concurrency:
  group: kmj-persistent-autonomous-worker
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  checks: read
  actions: read

jobs:
  worker:
    if: ${{ github.event_name != 'issues' || contains(github.event.issue.labels.*.name, 'autonomous-safe') }}
    runs-on: [self-hosted, linux, x64, kmj-main-platform-ci]
    timeout-minutes: 60
    environment: staging
    env:
      GITHUB_TOKEN: ${{ github.token }}
      KMJ_EXECUTION_ENABLED: 'true'
      KMJ_AUTONOMOUS_WRITE_ENABLED: 'true'
      KMJ_AUTO_MERGE_ENABLED: 'true'
      KMJ_WORKER_MAX_TASKS_PER_CYCLE: '3'
      KMJ_9ROUTER_BASE_URL: ${{ vars.KMJ_9ROUTER_BASE_URL || 'http://127.0.0.1:18765/v1' }}
      KMJ_ENABLE_PUBLIC_FREE_PROVIDERS: '1'
      KMJ_9ROUTER_API_KEY: ${{ secrets.KMJ_9ROUTER_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      KMJ_VERIFIED_FREE_PROVIDERS: ${{ vars.KMJ_VERIFIED_FREE_PROVIDERS }}
      KMJ_FREE_PROVIDER_ENDPOINTS_JSON: ${{ secrets.KMJ_FREE_PROVIDER_ENDPOINTS_JSON }}
      DB_CONNECTION: sqlite
      DB_DATABASE: ${{ github.workspace }}/apps/platform/database/database.sqlite
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: main
          persist-credentials: true

      - name: Prepare resilient Python runtime
        run: bash ops/self-hosted-runner/prepare-python-runtime.sh

      - name: Publish worker-start delivery evidence
        continue-on-error: true
        run: PYTHONPATH=. python3 scripts/delivery_control_bridge.py

      - name: Verify pre-provisioned PHP and Node runtime
        shell: bash
        run: |
          set -euo pipefail
          php --version
          composer --version
          node --version
          npm --version
          php -r 'exit(PHP_VERSION_ID >= 80300 && PHP_VERSION_ID < 80600 ? 0 : 1);'
          node -e 'const m=Number(process.versions.node.split(".")[0]); process.exit(m === 22 ? 0 : 1)'

      - name: Prepare pinned official free client
        run: bash ops/self-hosted-runner/prepare-free-client.sh

      - name: Prepare isolated completion evidence
        shell: bash
        run: |
          evidence_dir="$(mktemp -d "$RUNNER_TEMP/kmj-ai-evidence.XXXXXX")"
          echo "KMJ_AI_EVIDENCE_DIR=$evidence_dir" >> "$GITHUB_ENV"
          echo "KMJ_AI_PROOF_PATH=$evidence_dir/completion.json" >> "$GITHUB_ENV"

      - name: Inspect VPS capacity and verified-free route
        run: PYTHONPATH=. python3 controller/worker_preflight.py

      - name: Verify worker safety core
        run: PYTHONPATH=. python3 -m unittest tests.test_persistent_worker tests.test_opencode_free

      - name: Run guarded worker cycle
        run: PYTHONPATH=. python3 controller/persistent_worker.py

      - name: Publish real AI completion evidence to staging
        if: always()
        shell: bash
        env:
          STAGING_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_USER: ${{ secrets.STAGING_SSH_USER }}
          STAGING_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          STAGING_PATH: ${{ vars.STAGING_APP_PATH }}
        run: bash ops/staging/publish-ai-evidence.sh

      - name: Refresh live delivery evidence
        if: always()
        continue-on-error: true
        run: PYTHONPATH=. python3 scripts/delivery_control_bridge.py

      - name: Remove temporary completion evidence
        if: always()
        shell: bash
        run: |
          if [ -n "${KMJ_AI_EVIDENCE_DIR:-}" ]; then
            rm -rf -- "$KMJ_AI_EVIDENCE_DIR"
          fi

      - name: Worker summary
        if: always()
        run: |
          echo '## KMJ persistent autonomous worker' >> "$GITHUB_STEP_SUMMARY"
          echo '- cadence: every 5 minutes plus immediate issue open/reopen/label wake-up' >> "$GITHUB_STEP_SUMMARY"
          echo '- capacity: up to 3 autonomous-safe, non-conflicting tasks per cycle' >> "$GITHUB_STEP_SUMMARY"
          echo '- AI: verified-free HTTP routes or the pinned official OpenCode cloud client' >> "$GITHUB_STEP_SUMMARY"
          echo '- task gate: autonomous-safe label only' >> "$GITHUB_STEP_SUMMARY"
          echo '- paid AI fallback: prohibited' >> "$GITHUB_STEP_SUMMARY"
          echo '- local LLM inference: prohibited' >> "$GITHUB_STEP_SUMMARY"
          echo '- auto-merge: only after required CI is green' >> "$GITHUB_STEP_SUMMARY"
          echo '- deployment: existing staging promotion/deploy chain' >> "$GITHUB_STEP_SUMMARY"
