name: Staging VPS Deploy

on:
  workflow_run:
    workflows:
      - Staging Promotion Gate
    types:
      - completed
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: read

concurrency:
  group: staging-vps-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Verify approved commit on staging VPS
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: staging

    steps:
      - name: Checkout approved staging branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: staging-approved
          fetch-depth: 1

      - name: Resolve exact approved commit
        id: approved
        env:
          PROMOTED_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          approved_sha="$(git rev-parse HEAD)"
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            test -n "$PROMOTED_SHA"
            test "$approved_sha" = "$PROMOTED_SHA"
          fi
          echo "sha=$approved_sha" >> "$GITHUB_OUTPUT"
          echo "DEPLOY_SHA=$approved_sha" >> "$GITHUB_ENV"

      - name: Validate public staging configuration
        id: config
        env:
          HEALTH_URL: ${{ vars.STAGING_HEALTHCHECK_URL }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HEALTH_URL"
          case "$HEALTH_URL" in
            https://staging.kmjtechno.com|https://staging.kmjtechno.com/) ;;
            *)
              echo '::error title=Invalid staging URL::STAGING_HEALTHCHECK_URL must be the canonical staging origin'
              exit 1
              ;;
          esac
          echo 'Staging public verification configuration is valid.'

      - name: Verify staging TLS identity
        shell: bash
        run: |
          set -euo pipefail
          host=staging.kmjtechno.com
          cert="$(mktemp)"
          trap 'rm -f "$cert"' EXIT
          if ! timeout 20 openssl s_client -connect "$host:443" -servername "$host" -showcerts </dev/null 2>/dev/null \
              | openssl x509 -outform PEM >"$cert"; then
            echo '::error title=Staging TLS unavailable::Unable to read the staging certificate'
            exit 1
          fi
          san="$(openssl x509 -in "$cert" -noout -ext subjectAltName 2>/dev/null || true)"
          if ! grep -Fq "DNS:$host" <<<"$san"; then
            subject="$(openssl x509 -in "$cert" -noout -subject 2>/dev/null || true)"
            issuer="$(openssl x509 -in "$cert" -noout -issuer 2>/dev/null || true)"
            echo "::error title=Staging TLS hostname mismatch::Certificate does not cover $host. $subject; $issuer"
            echo 'Repair on the staging VPS by re-running /root/KMJ_SERVER_BOOTSTRAP.sh after confirming the CloudPanel staging site exists.'
            exit 60
          fi
          echo 'Staging TLS certificate covers the canonical staging hostname.'

      - name: Prepare staging browser without privileged installation
        shell: bash
        run: bash ops/self-hosted-runner/prepare-staging-browser.sh
      - name: Wait for VPS auto-deploy exact commit
        id: deploy
        env:
          HEALTH_URL: ${{ vars.STAGING_HEALTHCHECK_URL }}
        shell: bash
        run: |
          set -euo pipefail
          origin="${HEALTH_URL%/}"
          headers="$(mktemp)"
          trap 'rm -f "$headers"' EXIT

          for attempt in $(seq 1 60); do
            : > "$headers"
            if curl --fail --silent --show-error --location --max-time 30               --dump-header "$headers" --output /dev/null "$origin/"; then
              deployed_sha="$(
                awk -F': *' 'tolower($1) == "x-kmj-deploy-sha" {gsub("\r", "", $2); value=$2} END {print value}' "$headers"
              )"
              if [ "$deployed_sha" = "$DEPLOY_SHA" ]; then
                echo "actual_sha=$deployed_sha" >> "$GITHUB_OUTPUT"
                echo "Staging auto-deploy verified exact commit: $deployed_sha"
                exit 0
              fi
              echo "Attempt $attempt: staging reports ${deployed_sha:-no deployment header}; waiting for $DEPLOY_SHA"
            else
              curl_status=$?
              if [ "$curl_status" -eq 60 ]; then
                echo '::error title=Staging TLS hostname mismatch::TLS validation failed; fix the staging certificate/vhost before deployment verification can continue.'
                exit 60
              fi
              echo "Attempt $attempt: staging HTTP probe failed with curl status $curl_status; retrying."
            fi
            sleep 10
          done

          echo "::error title=Staging deployment timeout::VPS auto-deploy did not expose approved commit $DEPLOY_SHA within the bounded verification window"
          exit 1

      - name: Verify staging HTTP health
        id: health
        env:
          HEALTH_URL: ${{ vars.STAGING_HEALTHCHECK_URL }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 5 --retry-delay 5 --retry-all-errors --max-time 30 "$HEALTH_URL" >/dev/null
          echo 'result=pass' >> "$GITHUB_OUTPUT"
          echo "Staging health check PASS: $HEALTH_URL"

      - name: Verify native Main Platform root and public product experience
        id: ui
        env:
          HEALTH_URL: ${{ vars.STAGING_HEALTHCHECK_URL }}
        shell: bash
        run: |
          set -euo pipefail
          chrome="$KMJ_STAGING_CHROME"
          test -n "$chrome"
          root_dom="$($chrome --headless --no-sandbox --disable-gpu --virtual-time-budget=10000 --dump-dom "$HEALTH_URL" 2>/dev/null)"
          assert_dom() {
            local surface="$1"
            local needle="$2"
            local dom="$3"
            if ! grep -Fq "$needle" <<< "$dom"; then
              echo "::error title=Staging UI assertion failed::${surface} is missing expected text: ${needle}"
              return 1
            fi
          }
          assert_dom 'root' 'KMJ TECHNO' "$root_dom"
          assert_dom 'root' 'Explore KMJ products' "$root_dom"
          products_dom="$($chrome --headless --no-sandbox --disable-gpu --virtual-time-budget=10000 --dump-dom 'https://staging.kmjtechno.com/products' 2>/dev/null)"
          calibration_dom="$($chrome --headless --no-sandbox --disable-gpu --virtual-time-budget=10000 --dump-dom 'https://staging.kmjtechno.com/products/kmj-calibration-pro' 2>/dev/null)"
          assert_dom 'products' 'KMJ Calibration Pro' "$products_dom"
          assert_dom 'products' 'Products built to move' "$products_dom"
          assert_dom 'products' 'Explore product' "$products_dom"
          assert_dom 'calibration product' 'KMJ Calibration Pro' "$calibration_dom"
          assert_dom 'calibration product' 'Interactive' "$calibration_dom"
          assert_dom 'calibration product' 'simulation' "$calibration_dom"
          echo 'result=pass' >> "$GITHUB_OUTPUT"
          echo 'Native Main Platform root + public product experience PASS.'

      - name: Capture desktop and mobile staging QA
        id: browser_qa
        timeout-minutes: 4
        env:
          KMJ_QA_OUTPUT: ${{ runner.temp }}/kmj-staging-qa-${{ github.run_id }}
        run: node ops/staging/browser-qa.mjs "$DEPLOY_SHA"

      - name: Preserve staging QA screenshots and measurements
        if: always() && steps.browser_qa.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: staging-qa-${{ github.run_id }}
          path: ${{ runner.temp }}/kmj-staging-qa-${{ github.run_id }}
          retention-days: 3
          if-no-files-found: warn

      - name: Deployment evidence summary
        if: always()
        shell: bash
        env:
          HEALTH_URL: ${{ vars.STAGING_HEALTHCHECK_URL }}
          APPROVED_SHA: ${{ steps.approved.outputs.sha }}
          DEPLOYED_SHA: ${{ steps.deploy.outputs.actual_sha }}
          HEALTH_RESULT: ${{ steps.health.outputs.result }}
          UI_RESULT: ${{ steps.ui.outputs.result }}
        run: |
          {
            echo '## KMJ staging deployment evidence'
            echo
            printf -- '- approved commit: `%s`\n' "${APPROVED_SHA:-unresolved}"
            printf -- '- deployed commit: `%s`\n' "${DEPLOYED_SHA:-not-verified}"
            echo "- deployment authority: VPS systemd auto-deploy timer consuming staging-approved"
            echo "- exact commit verification: ${{ steps.deploy.conclusion }}"
            echo "- HTTP health: ${HEALTH_RESULT:-not-run}"
            echo "- rendered UI: ${UI_RESULT:-not-run}"
            echo "- desktop/mobile QA: ${{ steps.browser_qa.conclusion }}"
            if [ -n "$HEALTH_URL" ]; then echo "- staging URL: $HEALTH_URL"; fi
          } >> "$GITHUB_STEP_SUMMARY"
