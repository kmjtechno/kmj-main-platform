name: Staging VPS Deploy

on:
  workflow_run:
    workflows:
      - Staging Promotion Gate
    types:
      - completed
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: read

concurrency:
  group: staging-vps-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy approved commit to staging VPS
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: staging

    steps:
      - name: Checkout approved staging branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: staging-approved
          fetch-depth: 1

      - name: Resolve exact approved commit
        id: approved
        env:
          PROMOTED_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          approved_sha="$(git rev-parse HEAD)"
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            test -n "$PROMOTED_SHA"
            test "$approved_sha" = "$PROMOTED_SHA"
          fi
          echo "sha=$approved_sha" >> "$GITHUB_OUTPUT"
          echo "DEPLOY_SHA=$approved_sha" >> "$GITHUB_ENV"

      - name: Validate staging deployment configuration
        id: config
        env:
          STAGING_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_USER: ${{ secrets.STAGING_SSH_USER }}
          STAGING_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          STAGING_PATH: ${{ vars.STAGING_APP_PATH }}
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          if [ -z "$STAGING_HOST" ]; then echo '::error title=Missing staging configuration::STAGING_SSH_HOST is not configured in the staging environment'; missing=1; fi
          if [ -z "$STAGING_USER" ]; then echo '::error title=Missing staging configuration::STAGING_SSH_USER is not configured in the staging environment'; missing=1; fi
          if [ -z "$STAGING_KEY" ]; then echo '::error title=Missing staging configuration::STAGING_SSH_PRIVATE_KEY is not configured in the staging environment'; missing=1; fi
          if [ -z "$STAGING_PATH" ]; then echo '::error title=Missing staging configuration::STAGING_APP_PATH is not configured in the staging environment'; missing=1; fi
          if [ "$missing" -ne 0 ]; then exit 1; fi
          echo 'Staging deployment configuration is present.'

      - name: Configure SSH
        id: ssh
        env:
          STAGING_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          # Accept normal multiline secrets and secrets pasted with literal \n escapes.
          printf '%s' "$STAGING_KEY" | sed 's/\\n/\n/g' | tr -d '\r' > ~/.ssh/id_ed25519
          printf '\n' >> ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          if ! ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null 2>&1; then
            echo '::error title=Invalid staging SSH private key::STAGING_SSH_PRIVATE_KEY could not be parsed after newline normalization'
            exit 1
          fi
          for attempt in 1 2 3; do
            if ssh-keyscan -T 10 -H "$STAGING_HOST" >> ~/.ssh/known_hosts 2>/dev/null; then
              exit 0
            fi
            echo "SSH keyscan attempt $attempt failed; retrying..."
            sleep $((attempt * 3))
          done
          echo '::error title=Staging SSH unavailable::Unable to read staging host key after 3 attempts'
          exit 1

      - name: Verify SSH connectivity
        env:
          STAGING_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_USER: ${{ secrets.STAGING_SSH_USER }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if ssh -o BatchMode=yes -o ConnectTimeout=15 "$STAGING_USER@$STAGING_HOST" 'echo KMJ_STAGING_SSH_OK' >/dev/null; then
              echo 'Staging SSH connectivity verified.'
              exit 0
            fi
            echo "SSH connection attempt $attempt failed; retrying..."
            sleep $((attempt * 5))
          done
          echo '::error title=Staging SSH connection failed::Host is reachable by workflow but SSH authentication/connectivity did not succeed after 3 attempts'
          exit 1

      - name: Deploy approved commit
        id: deploy
        env:
          STAGING_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_USER: ${{ secrets.STAGING_SSH_USER }}
          STAGING_PATH: ${{ vars.STAGING_APP_PATH }}
        shell: bash
        run: |
          set -euo pipefail
          ssh "$STAGING_USER@$STAGING_HOST" bash -s -- "$STAGING_PATH" "$DEPLOY_SHA" <<'REMOTE'
          set -euo pipefail
          STAGING_PATH="$1"
          DEPLOY_SHA="$2"
          cd "$STAGING_PATH"
          git fetch --prune origin staging-approved
          git checkout -B staging-approved origin/staging-approved
          git reset --hard "$DEPLOY_SHA"
          cd apps/platform
          composer install --no-interaction --prefer-dist --no-progress --no-dev --optimize-autoloader
          php artisan migrate --force
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi
          npm run build
          php artisan optimize:clear
          php artisan optimize
          php artisan queue:restart || true
          REMOTE

      - name: Verify deployed commit
        id: verify
        env:
          STAGING_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_USER: ${{ secrets.STAGING_SSH_USER }}
          STAGING_PATH: ${{ vars.STAGING_APP_PATH }}
        shell: bash
        run: |
          set -euo pipefail
          actual="$(ssh "$STAGING_USER@$STAGING_HOST" bash -s -- "$STAGING_PATH" <<'REMOTE'
          set -euo pipefail
          cd "$1"
          git rev-parse HEAD
          REMOTE
          )"
          test "$actual" = "$DEPLOY_SHA"
          echo "actual_sha=$actual" >> "$GITHUB_OUTPUT"
          echo "Staging VPS deployed commit: $actual"

      - name: Verify staging HTTP health
        id: health
        env:
          HEALTH_URL: ${{ vars.STAGING_HEALTHCHECK_URL }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$HEALTH_URL" ]; then
            echo 'No STAGING_HEALTHCHECK_URL configured; commit verification completed, HTTP visibility check skipped.'
            echo 'result=not-configured' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          curl --fail --silent --show-error --location --retry 5 --retry-delay 5 --retry-all-errors --max-time 30 "$HEALTH_URL" >/dev/null
          echo 'result=pass' >> "$GITHUB_OUTPUT"
          echo "Staging health check PASS: $HEALTH_URL"

      - name: Deployment evidence summary
        if: always()
        shell: bash
        env:
          HEALTH_URL: ${{ vars.STAGING_HEALTHCHECK_URL }}
          APPROVED_SHA: ${{ steps.approved.outputs.sha }}
          DEPLOYED_SHA: ${{ steps.verify.outputs.actual_sha }}
          HEALTH_RESULT: ${{ steps.health.outputs.result }}
        run: |
          {
            echo '## KMJ staging deployment evidence'
            echo
            echo "- approved commit: \`${APPROVED_SHA:-unresolved}\`"
            echo "- deployed commit: \`${DEPLOYED_SHA:-not-verified}\`"
            echo "- configuration: ${{ steps.config.conclusion }}"
            echo "- deployment: ${{ steps.deploy.conclusion }}"
            echo "- commit verification: ${{ steps.verify.conclusion }}"
            echo "- HTTP health: ${HEALTH_RESULT:-not-run}"
            if [ -n "$HEALTH_URL" ]; then echo "- staging URL: $HEALTH_URL"; fi
          } >> "$GITHUB_STEP_SUMMARY"
