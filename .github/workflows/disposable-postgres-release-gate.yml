name: Disposable PostgreSQL Release Gate
on:
  pull_request:
    paths:
      - 'apps/platform/app/**'
      - 'apps/platform/database/**'
      - 'apps/platform/routes/**'
      - 'apps/platform/tests/**'
      - 'apps/platform/composer.json'
      - 'apps/platform/composer.lock'
      - 'packages/**'
      - 'scripts/ci/verify-postgres-staging.sh'
      - '.github/workflows/disposable-postgres-release-gate.yml'
  workflow_dispatch:
  push:
    branches: [staging-approved]
permissions:
  contents: read
concurrency:
  group: disposable-pg-${{ github.ref }}
  cancel-in-progress: true
jobs:
  migration-rollback:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact release candidate without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up PHP 8.4 with PostgreSQL driver
        uses: shivammathur/setup-php@87d00bde2555f25eb54fedf940384e99cbdc55ef
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, pgsql, pdo_sqlite, sqlite3, sodium
          coverage: none
      - name: Set up Node 22 for actual Vite manifests
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/platform/package-lock.json
      - name: Install disposable local PostgreSQL binaries
        run: |
          set -euo pipefail
          sudo apt-get -qq update
          sudo apt-get -y -qq install postgresql postgresql-client
          php -r 'exit(extension_loaded("pdo_pgsql") ? 0 : 1);'
          test -x "$(find /usr/lib/postgresql -mindepth 3 -maxdepth 3 -name initdb -type f | sort -V | tail -n 1)"
      - name: Install locked Composer test dependencies in GitHub checkout
        working-directory: apps/platform
        run: |
          set -euo pipefail
          composer install --no-interaction --prefer-dist --no-progress --optimize-autoloader
      - name: Fail closed unless CI is unprivileged and checked out at exact source SHA
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          [[ "$EXPECTED_SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          test -z "$(git status --porcelain)"
          echo "DISPOSABLE_PG_SOURCE_SHA=$EXPECTED_SOURCE_SHA"
      - name: Test all Feature cases on isolated PostgreSQL and roll back
        env:
          KMJ_PG_FULL_FEATURE_SUITE: '1'
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          # GitHub sets GITHUB_SHA to synthetic PR merge; the exact source is
          # validated above and passed explicitly. Unset only for the script's
          # existing synthetic-merge guard, never for source verification.
          env -u GITHUB_SHA bash scripts/ci/verify-postgres-staging.sh "$EXPECTED_SOURCE_SHA"
          echo "DISPOSABLE_PG_RESULT=PASS SOURCE_SHA=$EXPECTED_SOURCE_SHA"
          echo 'PRODUCTION_POSTGRES_RESTORE=NOT_VERIFIED'
