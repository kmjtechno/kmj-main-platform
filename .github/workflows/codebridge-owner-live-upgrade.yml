name: One-Time CodeBridge Owner Live Upgrade

on:
  push:
    branches: [feat/codebridge-owner-tier]
    paths:
      - '.github/workflows/codebridge-owner-live-upgrade.yml'

permissions:
  contents: read

concurrency:
  group: codebridge-owner-live-upgrade
  cancel-in-progress: false

jobs:
  upgrade:
    runs-on: [self-hosted, linux, x64, kmj-main-platform-ci]
    timeout-minutes: 10
    steps:
      - name: Upgrade the single active Platform Owner CodeBridge license
        shell: bash
        run: |
          set -euo pipefail
          APP=/home/kmjprod/current/apps/platform
          test -d "$APP"
          cd "$APP"
          test -f artisan
          test -f vendor/autoload.php
          test -f .env
          grep -Eq '^APP_ENV=(production|staging)$' .env

          php <<'PHP'
          <?php
          declare(strict_types=1);

          require 'vendor/autoload.php';
          $app = require 'bootstrap/app.php';
          $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();

          use Illuminate\Support\Facades\DB;
          use Illuminate\Support\Str;

          DB::transaction(function (): void {
              $now = now();

              $candidateIds = DB::table('kslp_licenses as l')
                  ->join('organization_memberships as m', 'm.organization_id', '=', 'l.customer_id')
                  ->join('users as u', 'u.id', '=', 'm.user_id')
                  ->where('l.product', 'KMJ_CODEBRIDGE')
                  ->where('l.status', 'active')
                  ->whereNull('l.revoked_at')
                  ->where('l.starts_at', '<=', $now)
                  ->where('l.expires_at', '>', $now)
                  ->where('m.role', 'owner')
                  ->where('u.is_platform_owner', true)
                  ->distinct()
                  ->pluck('l.id');

              if ($candidateIds->count() !== 1) {
                  throw new RuntimeException(
                      'OWNER_LICENSE_SELECTION_FAILED count='.$candidateIds->count()
                  );
              }

              $license = DB::table('kslp_licenses')
                  ->where('id', (string) $candidateIds->first())
                  ->lockForUpdate()
                  ->first();

              if (! $license || $license->product !== 'KMJ_CODEBRIDGE') {
                  throw new RuntimeException('OWNER_LICENSE_NOT_FOUND');
              }

              $product = DB::table('products')
                  ->where('slug', 'kmj-codebridge')
                  ->first();

              if (! $product) {
                  throw new RuntimeException('CODEBRIDGE_PRODUCT_NOT_FOUND');
              }

              $features = [
                  'read' => true,
                  'write' => true,
                  'execute' => true,
              ];
              $limits = [
                  'devices' => 64,
                  'concurrent_jobs' => 16,
              ];

              $plan = DB::table('plans')
                  ->where('code', 'codebridge.owner')
                  ->lockForUpdate()
                  ->first();

              if (! $plan) {
                  DB::table('plans')->insert([
                      'id' => (string) Str::uuid(),
                      'product_id' => $product->id,
                      'code' => 'codebridge.owner',
                      'name' => 'CodeBridge Owner',
                      'pricing_model' => 'internal',
                      'billing_interval' => null,
                      'currency' => null,
                      'amount_minor' => null,
                      'status' => 'active',
                      'trial_days' => 0,
                      'features' => json_encode($features, JSON_THROW_ON_ERROR),
                      'limits' => json_encode($limits, JSON_THROW_ON_ERROR),
                      'created_at' => $now,
                      'updated_at' => $now,
                  ]);
              } else {
                  $actualFeatures = json_decode((string) $plan->features, true, 32, JSON_THROW_ON_ERROR);
                  $actualLimits = json_decode((string) $plan->limits, true, 32, JSON_THROW_ON_ERROR);
                  if (
                      (string) $plan->product_id !== (string) $product->id
                      || (string) $plan->name !== 'CodeBridge Owner'
                      || (string) $plan->pricing_model !== 'internal'
                      || (string) $plan->status !== 'active'
                      || $actualFeatures !== $features
                      || $actualLimits !== $limits
                  ) {
                      throw new RuntimeException('OWNER_POLICY_CONFLICT');
                  }
              }

              if ((string) $license->plan === 'owner') {
                  echo "CODEBRIDGE_OWNER_UPGRADE already_owner\n";
                  return;
              }

              $previousPlan = (string) $license->plan;
              $sequence = (int) $license->sequence + 1;

              $updated = DB::table('kslp_licenses')
                  ->where('id', $license->id)
                  ->where('sequence', (int) $license->sequence)
                  ->update([
                      'plan' => 'owner',
                      'sequence' => $sequence,
                      'updated_at' => $now,
                  ]);

              if ($updated !== 1) {
                  throw new RuntimeException('OWNER_LICENSE_CONCURRENT_UPDATE');
              }

              DB::table('kslp_license_events')->insert([
                  'license_id' => $license->id,
                  'actor_id' => 'platform-owner-policy',
                  'action' => 'codebridge_owner_tier_upgraded',
                  'reason' => 'Explicit owner-authorized upgrade to internal CodeBridge Owner tier',
                  'correlation_id' => (string) Str::uuid(),
                  'metadata' => json_encode([
                      'previous_plan' => $previousPlan,
                      'plan' => 'owner',
                      'policy' => 'codebridge.owner',
                      'devices' => 64,
                      'concurrent_jobs' => 16,
                      'features' => ['read', 'write', 'execute'],
                  ], JSON_THROW_ON_ERROR),
                  'created_at' => $now,
              ]);

              echo "CODEBRIDGE_OWNER_UPGRADE success plan=owner sequence={$sequence}\n";
          }, 3);
          PHP
