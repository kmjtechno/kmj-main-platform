name: PR498 Exact Frontend Format Preview
on:
  pull_request:
    types: [synchronize]
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install locked frontend formatter
        working-directory: apps/platform
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Format source without changing remote code
        working-directory: apps/platform
        run: |
          set -euo pipefail
          ./node_modules/.bin/vp fmt
          ./node_modules/.bin/vp fmt --check
          for filename in resources/js/pages/auth/register.tsx scripts/check-registration-email-contract.test.mjs; do
            echo "KMJ_PR498_BEGIN ${filename}"
            base64 -w0 "${filename}"
            echo
            echo "KMJ_PR498_END ${filename}"
          done
