name: Ops V2 PHP One-shot Formatter

on:
  push:
    branches:
      - feat/ops-command-center-v2

permissions:
  contents: write

concurrency:
  group: ops-v2-php-format
  cancel-in-progress: false

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/ops-command-center-v2
          persist-credentials: true

      - name: Setup PHP 8.5
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: Install platform dependencies
        working-directory: apps/platform
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Canonical format readiness service
        working-directory: apps/platform
        run: ./vendor/bin/pint app/Services/Operations/OperationalReadinessSnapshot.php

      - name: Commit formatter output when changed
        run: |
          set -euo pipefail
          if git diff --quiet -- apps/platform/app/Services/Operations/OperationalReadinessSnapshot.php; then
            echo "Formatter produced no changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/platform/app/Services/Operations/OperationalReadinessSnapshot.php
          git commit -m "style(ops): apply canonical PHP formatting"
          git push origin HEAD:feat/ops-command-center-v2
