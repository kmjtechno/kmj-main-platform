name: Elite Local Upload Restore Proof QA

on:
  pull_request:
    paths:
      - scripts/operations/verify-elite-local-upload-restore-20261119.py
      - scripts/test_verify_elite_local_upload_restore_20261119.py
      - .github/workflows/elite-local-upload-restore-qa.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-restore-contract:
    name: No production access, real synthetic uploads extraction and hash replay
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Run isolated restore tests and deny unsafe archive members
        run: |
          set -Eeuo pipefail
          python3 -B -m py_compile scripts/operations/verify-elite-local-upload-restore-20261119.py
          python3 -B -m unittest discover \
            -s scripts -p 'test_verify_elite_local_upload_restore_20261119.py' -v
          sha256sum scripts/operations/verify-elite-local-upload-restore-20261119.py
          echo 'ELITE_LOCAL_UPLOADS_RESTORE_SYNTHETIC_QA=PASS'
          echo 'ELITE_PRODUCTION_DATABASE=UNTOUCHED'
          echo 'ELITE_LIVE_RELEASE=UNTOUCHED'
