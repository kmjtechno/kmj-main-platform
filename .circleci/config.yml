            npm ci --ignore-scripts --no-audit --no-fund
      - run:
          name: Frontend format, lint and source contract suite
          command: |
            set -euo pipefail
            cd apps/platform
            npm run check
            echo "KMJ_ADMIN_FRONTEND_CHECK_PASS=1"

  owner_admin_frontend_types:
    docker:
      - image: cimg/php:8.4-node
    resource_class: small
    steps:
      - checkout
      - run:
          name: Generate Laravel Wayfinder types and validate exact-head TypeScript
          no_output_timeout: 10m
          command: |
            set -euo pipefail
