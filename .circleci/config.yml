            npm ci --ignore-scripts --no-audit --no-fund
            export APP_ENV=testing APP_KEY="base64:$(php -r 'echo base64_encode(random_bytes(32));')"
            export DB_CONNECTION=sqlite DB_DATABASE=:memory:
            php artisan wayfinder:generate --with-form --no-ansi
            test -f resources/js/routes/index.ts
            npm run types:check
            echo "KMJ_ADMIN_TYPES_PASS=1"

  owner_admin_php_quality:
    docker:
      - image: cimg/php:8.4-node
    resource_class: small
    environment:
      APP_ENV: testing
      DB_CONNECTION: sqlite
      DB_DATABASE: ":memory:"
    steps:
      - checkout
      - run:
          name: Laravel Pint and PHPStan exact-head check
          no_output_timeout: 10m
          command: |
            set -euo pipefail
            test "$(git rev-parse HEAD)" = "$CIRCLE_SHA1"
            cd apps/platform
            composer install --no-interaction --prefer-dist --no-progress
            vendor/bin/pint --test
            vendor/bin/phpstan analyse --no-progress --memory-limit=1G
            echo "KMJ_ADMIN_PHP_QUALITY_PASS=1"

  owner_admin_build_probe:
    docker:
      - image: cimg/php:8.4-node
    resource_class: small
    environment:
      APP_ENV: testing
      DB_CONNECTION: sqlite
      DB_DATABASE: ":memory:"
    steps:
      - checkout
      - run:
          name: Exact-SHA production frontend build diagnostic
          no_output_timeout: 12m
          command: |
            set -euo pipefail
            test "$(git rev-parse HEAD)" = "$CIRCLE_SHA1"
            cd apps/platform
            composer install --no-interaction --prefer-dist --no-progress
            npm ci --ignore-scripts --no-audit --no-fund
            export APP_KEY="base64:$(php -r 'echo base64_encode(random_bytes(32));')"
            php artisan wayfinder:generate --with-form --no-ansi
            npm run build
            test -s public/build/manifest.json
            echo "KMJ_ADMIN_BUILD_PROBE_PASS=1"

  owner_admin_product_tests:
