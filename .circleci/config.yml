            echo "SUPER_ADMIN_COMMAND_CENTER_HTTP_PASS=1"

  kslp_authsp_source_preflight:
    docker:
      - image: cimg/php:8.4-node
    resource_class: small
    steps:
      - checkout
      - run:
          name: Exact SHA PHP and JS no-dependency security checks
