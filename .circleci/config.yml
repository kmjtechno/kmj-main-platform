version: 2.1

orbs:
  browser-tools: circleci/browser-tools@2.4.2

commands:
  prepare_ui_app:
    description: Build the app, migrate a throwaway SQLite database, serve it on 127.0.0.1:8000 and install the browser tooling.
    steps:
      - checkout
      - run:
          name: Install Laravel dependencies
          no_output_timeout: 10m
          command: |
            set -euo pipefail
            cd apps/platform
            composer install --no-interaction --prefer-dist --no-progress
      - run:
          name: Install frontend dependencies and build assets
          no_output_timeout: 12m
          command: |
            set -euo pipefail
            cd apps/platform
            npm ci --ignore-scripts --no-audit --no-fund
            npm run build
      - run:
          name: Prepare environment and throwaway database
          command: |
            set -euo pipefail
            cd apps/platform
            cp .env.example .env
            php artisan key:generate --force
            touch database/ui.sqlite
            php artisan migrate --force --no-ansi
      - run:
          name: Serve the app
          command: |
            set -euo pipefail
            cd apps/platform
            nohup php artisan serve --host=127.0.0.1 --port=8000 > /tmp/serve.log 2>&1 &
            for i in $(seq 1 40); do
              if curl -fsS -o /dev/null http://127.0.0.1:8000/login; then echo "app is up"; exit 0; fi
              sleep 1
            done
            echo "app did not start"; tail -n 40 /tmp/serve.log; exit 1
      - browser-tools/install_chrome:
          timeout: 5m
      - run:
          name: Install browser tooling (outside the app's dependencies)
          command: |
            set -euo pipefail
            src="$(pwd)/apps/platform/scripts/ui-smoke.mjs"
            test -f "$src"
            mkdir -p /tmp/uitools
            cd /tmp/uitools
            npm init -y >/dev/null
            npm install --no-audit --no-fund playwright-core@1.49.1 axe-core@4.10.2
            cp "$src" /tmp/uitools/ui-smoke.mjs
            test -x /usr/bin/google-chrome

jobs:
  ui_db_migration_probe:
    docker:
      - image: cimg/php:8.4-browsers
    resource_class: medium
    environment:
      APP_ENV: local
      DB_CONNECTION: sqlite
      DB_DATABASE: /home/circleci/project/apps/platform/database/ui.sqlite
      SESSION_DRIVER: file
      CACHE_STORE: array
      MAIL_MAILER: array
      QUEUE_CONNECTION: sync
    steps:
      - checkout
      - run:
          name: Install Laravel dependencies without frontend
          no_output_timeout: 10m
          command: |
            set -euo pipefail
            cd apps/platform
            composer install --no-interaction --prefer-dist --no-progress
      - run:
          name: Verify fresh SQLite migrations
          command: |
            set -euo pipefail
            cd apps/platform
            cp .env.example .env
            php artisan key:generate --force
            touch database/ui.sqlite
            php artisan migrate --force --no-ansi
            echo 'UI_DB_MIGRATION_PASS'

  ui_frontend_build_probe:
    docker:
      - image: cimg/php:8.4-browsers
    resource_class: medium
    steps:
      - checkout
      - run:
          name: Verify browser-image Node and production frontend build
          no_output_timeout: 12m
          command: |
            set -euo pipefail
            cd apps/platform
            node --version
            npm ci --ignore-scripts --no-audit --no-fund
            npm run build
            echo 'UI_BROWSER_IMAGE_FRONTEND_BUILD_PASS'

  chrome_install_probe:
    docker:
      - image: cimg/php:8.4-browsers
    resource_class: small
    steps:
      - browser-tools/install_chrome:
          timeout: 5m
      - run:
          name: Verify actual installed Chrome executable
          command: |
            set -euo pipefail
            test -x /usr/bin/google-chrome
            /usr/bin/google-chrome --version

  ui_http_bootstrap_probe:
    docker:
      - image: cimg/php:8.4-browsers
    resource_class: medium
    environment:
      APP_ENV: local
      APP_DEBUG: "false"
      APP_URL: http://127.0.0.1:8000
      DB_CONNECTION: sqlite
      DB_DATABASE: /home/circleci/project/apps/platform/database/ui.sqlite
      SESSION_DRIVER: file
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
    steps:
      - checkout
      - run:
          name: Install PHP and frontend dependencies
          no_output_timeout: 12m
          command: |
            set -euo pipefail
            cd apps/platform
            composer install --no-interaction --prefer-dist --no-progress
            npm ci --ignore-scripts --no-audit --no-fund
            npm run build
      - run:
          name: Probe DB migration separately from Chrome
          command: |
            set -euo pipefail
            cd apps/platform
            cp .env.example .env
            php artisan key:generate --force
            touch database/ui.sqlite
            php artisan migrate --force --no-ansi
            echo 'SQLITE_MIGRATION_PASS'
      - run:
          name: Probe login page without a browser
          command: |
            set -euo pipefail
            cd apps/platform
            nohup php artisan serve --host=127.0.0.1 --port=8000 > /tmp/serve.log 2>&1 &
            for i in $(seq 1 40); do
              if curl -fsS -o /dev/null http://127.0.0.1:8000/login; then
                echo 'UI_HTTP_LOGIN_PASS'
                exit 0
              fi
              sleep 1
            done
            tail -n 80 /tmp/serve.log
            exit 1

  codebridge_device_control:
    docker:
      - image: cimg/php:8.4-node
    resource_class: small
    environment:
      APP_ENV: testing
      DB_CONNECTION: sqlite
      DB_DATABASE: ":memory:"
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      SESSION_DRIVER: array
    steps:
      - checkout
      - run:
          name: Verify exact PR source
          command: |
            set -euo pipefail
            test "$(git rev-parse HEAD)" = "$CIRCLE_SHA1"
            test -f apps/platform/routes/codebridge-device-control.php
            test -f apps/platform/resources/js/components/codebridge/device-control-center.tsx
            test -f apps/platform/resources/js/components/codebridge/control-center-hub.tsx
      - run:
          name: PHP syntax for device authorization controls
          command: |
            set -euo pipefail
            php -l apps/platform/routes/codebridge-device-control.php
            php -l apps/platform/routes/web.php
            php -l apps/platform/tests/Feature/CodeBridgeAdminHttpTest.php
      - run:
          name: Install isolated frontend dependencies
          no_output_timeout: 5m
          command: |
            set -euo pipefail
            cd apps/platform
            npm ci --ignore-scripts --no-audit --no-fund
      - run:
          name: Install isolated Laravel test dependencies
          no_output_timeout: 8m
          command: |
            set -euo pipefail
            cd apps/platform
            composer install --no-interaction --prefer-dist --no-progress
      - run:
          name: Full frontend check (Vite+ format and lint, source contracts, layout)
          no_output_timeout: 8m
          command: |
            set -euo pipefail
            cd apps/platform
            npm run check
      - run:
          name: No-network local CodeBridge device-control verification
          no_output_timeout: 8m
          command: |
            set -euo pipefail
            cd apps/platform
            bash scripts/verify-codebridge-device-control-offline.sh
      - run:
          name: Build CodeBridge dashboard production frontend
          no_output_timeout: 8m
          command: |
            set -euo pipefail
            cd apps/platform
            npm run build

  php_pint:
    docker:
      - image: cimg/php:8.4-node
    resource_class: small
    steps:
      - checkout
      - run:
          name: Install Laravel dependencies
          no_output_timeout: 8m
          command: |
            set -euo pipefail
            cd apps/platform
            composer install --no-interaction --prefer-dist --no-progress
      - run:
          name: Pint style check (composer lint:check)
          command: |
            set -euo pipefail
            cd apps/platform
            vendor/bin/pint --parallel --test

  php_phpstan:
    docker:
      - image: cimg/php:8.4-node
    resource_class: small
    environment:
      APP_ENV: testing
      DB_CONNECTION: sqlite
      DB_DATABASE: ":memory:"
    steps:
      - checkout
      - run:
          name: Install Laravel dependencies
          no_output_timeout: 8m
          command: |
            set -euo pipefail
            cd apps/platform
            composer install --no-interaction --prefer-dist --no-progress
      - run:
          name: PHPStan level 7 (composer types:check)
          no_output_timeout: 8m
          command: |
            set -euo pipefail
            cd apps/platform
            vendor/bin/phpstan analyse --no-progress --memory-limit=1G

  php_tests:
    docker:
      - image: cimg/php:8.4-node
    resource_class: medium
    environment:
      APP_ENV: testing
    steps:
      - checkout
      - run:
          name: Install Laravel dependencies
          no_output_timeout: 10m
          command: |
            set -euo pipefail
            cd apps/platform
            composer install --no-interaction --prefer-dist --no-progress
      - run:
          name: Install frontend dependencies and build assets (Inertia/Wayfinder need them)
          no_output_timeout: 12m
          command: |
            set -euo pipefail
            cd apps/platform
            npm ci --ignore-scripts --no-audit --no-fund
            npm run build
      - run:
          name: Full Laravel test suite (php artisan test)
          no_output_timeout: 20m
          command: |
            set -euo pipefail
            cd apps/platform
            cp .env.example .env
            php artisan key:generate --force
            php artisan config:clear --ansi
            # Prove tests really ran: require a zero exit AND a reported pass count at or
            # above the number of test files, so an empty or skipped run cannot pass.
            rc=0
            php artisan test --no-ansi > /tmp/phpunit.out 2>&1 || rc=$?
            tail -n 40 /tmp/phpunit.out
            test "$rc" -eq 0
            passed=$(grep -E '^ *Tests:' /tmp/phpunit.out | tail -1 | grep -Eo '[0-9]+ passed' | grep -Eo '^[0-9]+' || true)
            echo "tests passed: ${passed:-none}"
            test "${passed:-0}" -ge 97

  ui_bootstrap_preflight:
    docker:
      - image: cimg/php:8.4-browsers
    resource_class: medium
    environment:
      APP_ENV: local
      APP_DEBUG: "false"
      APP_URL: http://127.0.0.1:8000
      DB_CONNECTION: sqlite
      DB_DATABASE: /home/circleci/project/apps/platform/database/ui.sqlite
      SESSION_DRIVER: file
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      PHP_CLI_SERVER_WORKERS: "4"
    steps:
      - prepare_ui_app
      - run:
          name: Isolate real-browser bootstrap from UI assertions
          command: |
            set -euo pipefail
            printf 'PHP='; php -r 'echo PHP_VERSION, PHP_EOL;'
            printf 'CHROME='; /usr/bin/google-chrome --version
            printf 'LOGIN='; curl --fail --silent --output /dev/null --write-out '%{http_code}\n' http://127.0.0.1:8000/login
            printf 'PRODUCTS='; curl --silent --location --output /dev/null --write-out '%{http_code}\n' http://127.0.0.1:8000/products/kmj-codebridge
            test -s apps/platform/public/assets/kmj-codebridge-icon.png
            test -f /tmp/uitools/ui-smoke.mjs
            test -d /tmp/uitools/node_modules/playwright-core
            test -d /tmp/uitools/node_modules/axe-core
            echo 'BOOTSTRAP_PASS (UI assertions not executed)'

  ui_public:
    docker:
      - image: cimg/php:8.4-browsers
    resource_class: medium
    environment:
      APP_ENV: local
      APP_DEBUG: "false"
      APP_URL: http://127.0.0.1:8000
      DB_CONNECTION: sqlite
      DB_DATABASE: /home/circleci/project/apps/platform/database/ui.sqlite
      SESSION_DRIVER: file
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      PHP_CLI_SERVER_WORKERS: "4"
    steps:
      - prepare_ui_app
      - run:
          name: Public pages in a real browser (mobile, tablet, desktop; layout, images, a11y, keyboard)
          no_output_timeout: 10m
          command: |
            set -euo pipefail
            cd /tmp/uitools
            UI_MODE=public UI_BASE=http://127.0.0.1:8000 CHROME_PATH=/usr/bin/google-chrome node ui-smoke.mjs

  ui_dashboard:
    docker:
      - image: cimg/php:8.4-browsers
    resource_class: medium
    environment:
      APP_ENV: local
      APP_DEBUG: "false"
      APP_URL: http://127.0.0.1:8000
      DB_CONNECTION: sqlite
      DB_DATABASE: /home/circleci/project/apps/platform/database/ui.sqlite
      SESSION_DRIVER: file
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      PHP_CLI_SERVER_WORKERS: "4"
    steps:
      - prepare_ui_app
      - run:
          name: Seed a verified customer with an active CodeBridge entitlement
          command: |
            set -euo pipefail
            cd apps/platform
            php artisan tinker --execute="require base_path('scripts/ci-seed-ui-smoke.php');"
      - run:
          name: Customer CodeBridge dashboard in a real browser (login, icon, Manage devices, layout, a11y)
          no_output_timeout: 10m
          command: |
            set -euo pipefail
            cd /tmp/uitools
            UI_MODE=dashboard UI_BASE=http://127.0.0.1:8000 CHROME_PATH=/usr/bin/google-chrome \
              UI_EMAIL=ui-smoke@example.test UI_PASSWORD=password node ui-smoke.mjs

workflows:
  ui_dependency_probes:
    jobs:
      - ui_db_migration_probe:
          filters:
            branches:
              only:
                - ci/ui-db-js-probes-20261013
      - ui_frontend_build_probe:
          filters:
            branches:
              only:
                - ci/ui-db-js-probes-20261013

  ui_phase_probes:
    jobs:
      - chrome_install_probe:
          filters:
            branches:
              only:
                - ci/phase-probes-20261013
      - ui_http_bootstrap_probe:
          filters:
            branches:
              only:
                - ci/phase-probes-20261013

  review_codebridge_device_control:
    jobs:
      - codebridge_device_control:
          filters:
            branches:
              only:
                - feat/codebridge-device-control-center-20261012
                - integrate/codebridge-control-center-377-378
                - feat/codebridge-control-center-hub-20261012
                - fix/gemini-spark-oauth-on-control-center-hub
                - fix/codebridge-compact-workspace-tabs-20261013
                - claude/codebridge-production-completion-n6lu61
                - ci/diagnose-real-browser-bootstrap-20261013
                - release/codebridge-claude-ui-verified-20261013
      - php_pint:
          filters:
            branches:
              only:
                - feat/codebridge-device-control-center-20261012
                - integrate/codebridge-control-center-377-378
                - feat/codebridge-control-center-hub-20261012
                - fix/gemini-spark-oauth-on-control-center-hub
                - fix/codebridge-compact-workspace-tabs-20261013
                - claude/codebridge-production-completion-n6lu61
                - ci/diagnose-real-browser-bootstrap-20261013
                - release/codebridge-claude-ui-verified-20261013
      - php_phpstan:
          filters:
            branches:
              only:
                - feat/codebridge-device-control-center-20261012
                - integrate/codebridge-control-center-377-378
                - feat/codebridge-control-center-hub-20261012
                - fix/gemini-spark-oauth-on-control-center-hub
                - fix/codebridge-compact-workspace-tabs-20261013
                - claude/codebridge-production-completion-n6lu61
                - ci/diagnose-real-browser-bootstrap-20261013
                - release/codebridge-claude-ui-verified-20261013
      - php_tests:
          filters:
            branches:
              only:
                - feat/codebridge-device-control-center-20261012
                - integrate/codebridge-control-center-377-378
                - feat/codebridge-control-center-hub-20261012
                - fix/gemini-spark-oauth-on-control-center-hub
                - fix/codebridge-compact-workspace-tabs-20261013
                - claude/codebridge-production-completion-n6lu61
                - ci/diagnose-real-browser-bootstrap-20261013
      - ui_bootstrap_preflight:
          filters:
            branches:
              only:
                - ci/diagnose-real-browser-bootstrap-20261013
      - ui_public:
          filters:
            branches:
              only:
                - feat/codebridge-device-control-center-20261012
                - integrate/codebridge-control-center-377-378
                - feat/codebridge-control-center-hub-20261012
                - fix/gemini-spark-oauth-on-control-center-hub
                - fix/codebridge-compact-workspace-tabs-20261013
                - claude/codebridge-production-completion-n6lu61
                - ci/diagnose-real-browser-bootstrap-20261013
      - ui_dashboard:
          filters:
            branches:
              only:
                - feat/codebridge-device-control-center-20261012
                - integrate/codebridge-control-center-377-378
                - feat/codebridge-control-center-hub-20261012
                - fix/gemini-spark-oauth-on-control-center-hub
                - fix/codebridge-compact-workspace-tabs-20261013
                - claude/codebridge-production-completion-n6lu61
                - ci/diagnose-real-browser-bootstrap-20261013
