version: 2.1

jobs:
  codebridge_cross_account_oauth:
    docker:
      - image: cimg/php:8.4-node
    resource_class: small
    environment:
      APP_ENV: testing
      DB_CONNECTION: sqlite
      DB_DATABASE: ":memory:"
      SESSION_DRIVER: array
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
    steps:
      - checkout
      - run:
          name: Verify immutable OAuth cross-account candidate
          command: |
            set -euo pipefail
            test "$(git rev-parse HEAD)" = "$CIRCLE_SHA1"
            php -l apps/platform/routes/codebridge-oauth.php
            php -l apps/platform/tests/Feature/CodeBridgeOAuthServerTest.php
      - run:
          name: Install locked PHP and frontend dependencies
          no_output_timeout: 10m
          command: |
            set -euo pipefail
            cd apps/platform
            composer install --no-interaction --prefer-dist --no-progress
            npm ci --ignore-scripts --no-audit --no-fund
      - run:
          name: OAuth authentication and account-switch security regression
          no_output_timeout: 10m
          command: |
            set -euo pipefail
            cd apps/platform
            printf '# disposable CI only\n' > .env
            export APP_KEY="base64:$(php -r 'echo base64_encode(random_bytes(32));')"
            vendor/bin/pint --test routes/codebridge-oauth.php tests/Feature/CodeBridgeOAuthServerTest.php
            php artisan test --filter='CodeBridgeOAuthServerTest|CodeBridgeOAuthLinkTest' --no-ansi
            echo "KMJ_CROSS_ACCOUNT_OAUTH_PHP_PASS=1"
      - run:
          name: OAuth consent UX frontend check and types
          no_output_timeout: 10m
          command: |
            set -euo pipefail
            cd apps/platform
            npm run check
            export APP_KEY="base64:$(php -r 'echo base64_encode(random_bytes(32));')"
            php artisan wayfinder:generate --with-form --no-ansi
            npm run types:check
            echo "KMJ_CROSS_ACCOUNT_OAUTH_UI_PASS=1"

  codebridge_oauth_php_tests:
    docker:
      - image: cimg/php:8.4-node
    resource_class: small
    environment:
      APP_ENV: testing
      DB_CONNECTION: sqlite
      DB_DATABASE: ":memory:"
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
    steps:
      - checkout
      - run:
          name: Exact source OAuth PHP syntax
          command: |
            set -euo pipefail
            test "$(git rev-parse HEAD)" = "$CIRCLE_SHA1"
            php -l apps/platform/routes/codebridge-oauth.php
            php -l apps/platform/tests/Feature/CodeBridgeOAuthServerTest.php
      - run:
          name: Isolated Laravel OAuth feature regressions
          no_output_timeout: 10m
          command: |
            set -euo pipefail
            cd apps/platform
            composer install --no-interaction --prefer-dist --no-progress
            npm ci --ignore-scripts --no-audit --no-fund
            printf '# disposable CI only\n' > .env
            export APP_KEY="base64:$(php -r 'echo base64_encode(random_bytes(32));')"
            php artisan wayfinder:generate --with-form --no-ansi
            npm run build
            test -s public/build/manifest.json
            php artisan test --filter='CodeBridgeOAuthServerTest|CodeBridgeOAuthLinkTest' --no-ansi
            echo "KMJ_CROSS_ACCOUNT_FEATURE_PASS=1"

  codebridge_oauth_frontend:
    docker:
      - image: cimg/php:8.4-node
    resource_class: small
    environment:
      APP_ENV: testing
      DB_CONNECTION: sqlite
      DB_DATABASE: ":memory:"
    steps:
      - checkout
      - run:
          name: OAuth consent frontend lint and types
          no_output_timeout: 10m
          command: |
            set -euo pipefail
            test "$(git rev-parse HEAD)" = "$CIRCLE_SHA1"
            cd apps/platform
            composer install --no-interaction --prefer-dist --no-progress
            npm ci --ignore-scripts --no-audit --no-fund
            npm run check
            export APP_KEY="base64:$(php -r 'echo base64_encode(random_bytes(32));')"
            php artisan wayfinder:generate --with-form --no-ansi
            npm run types:check
            echo "KMJ_CROSS_ACCOUNT_FRONTEND_PASS=1"

  codebridge_oauth_style:
    docker:
      - image: cimg/php:8.4-node
    resource_class: small
    steps:
      - checkout
      - run:
          name: OAuth PHP exact-head Pint formatting
          no_output_timeout: 8m
          command: |
            set -euo pipefail
            cd apps/platform
            composer install --no-interaction --prefer-dist --no-progress
            vendor/bin/pint --test routes/codebridge-oauth.php tests/Feature/CodeBridgeOAuthServerTest.php
            echo "KMJ_CROSS_ACCOUNT_PINT_PASS=1"

  codebridge_device_control:
    docker:
      - image: cimg/php:8.4-node
    resource_class: small
    environment:
      APP_ENV: testing
      DB_CONNECTION: sqlite
      DB_DATABASE: ":memory:"
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      SESSION_DRIVER: array
    steps:
      - checkout
      - run:
          name: Verify exact PR source
          command: |
            set -euo pipefail
            test "$(git rev-parse HEAD)" = "$CIRCLE_SHA1"
            test -f apps/platform/routes/codebridge-device-control.php
            test -f apps/platform/resources/js/components/codebridge/device-control-center.tsx
            test -f apps/platform/resources/js/components/codebridge/control-center-hub.tsx
      - run:
          name: PHP syntax for device authorization controls
          command: |
            set -euo pipefail
            php -l apps/platform/routes/codebridge-device-control.php
            php -l apps/platform/routes/web.php
            php -l apps/platform/tests/Feature/CodeBridgeAdminHttpTest.php
      - run:
          name: Install isolated frontend dependencies
          no_output_timeout: 5m
          command: |
            set -euo pipefail
            cd apps/platform
            npm ci --ignore-scripts --no-audit --no-fund
      - run:
          name: Install isolated Laravel test dependencies
          no_output_timeout: 8m
          command: |
            set -euo pipefail
            cd apps/platform
            composer install --no-interaction --prefer-dist --no-progress
      - run:
          name: Full frontend check (Vite+ format and lint, source contracts, layout)
          no_output_timeout: 8m
          command: |
            set -euo pipefail
            cd apps/platform
            npm run check
      - run:
          name: No-network local CodeBridge device-control verification
          no_output_timeout: 8m
          command: |
            set -euo pipefail
            cd apps/platform
            bash scripts/verify-codebridge-device-control-offline.sh
      - run:
          name: Build CodeBridge dashboard production frontend
          no_output_timeout: 8m
          command: |
            set -euo pipefail
            cd apps/platform
            npm run build

  php_pint:
    docker:
      - image: cimg/php:8.4-node
    resource_class: small
    steps:
      - checkout
      - run:
          name: Install Laravel dependencies
          no_output_timeout: 8m
          command: |
            set -euo pipefail
            cd apps/platform
            composer install --no-interaction --prefer-dist --no-progress
      - run:
          name: Pint style check (composer lint:check)
          command: |
            set -euo pipefail
            cd apps/platform
            vendor/bin/pint --parallel --test

  php_phpstan:
    docker:
      - image: cimg/php:8.4-node
    resource_class: small
    environment:
      APP_ENV: testing
      DB_CONNECTION: sqlite
      DB_DATABASE: ":memory:"
    steps:
      - checkout
      - run:
          name: Install Laravel dependencies
          no_output_timeout: 8m
          command: |
            set -euo pipefail
            cd apps/platform
            composer install --no-interaction --prefer-dist --no-progress
      - run:
          name: PHPStan level 7 (composer types:check)
          no_output_timeout: 8m
          command: |
            set -euo pipefail
            cd apps/platform
            vendor/bin/phpstan analyse --no-progress --memory-limit=1G

  php_tests:
    docker:
      - image: cimg/php:8.4-node
    resource_class: medium
    environment:
      APP_ENV: testing
    steps:
      - checkout
      - run:
          name: Install Laravel dependencies
          no_output_timeout: 10m
          command: |
            set -euo pipefail
            cd apps/platform
            composer install --no-interaction --prefer-dist --no-progress
      - run:
          name: Install frontend dependencies and build assets (Inertia/Wayfinder need them)
          no_output_timeout: 12m
          command: |
            set -euo pipefail
            cd apps/platform
            npm ci --ignore-scripts --no-audit --no-fund
            npm run build
      - run:
          name: Full Laravel test suite (php artisan test)
          no_output_timeout: 20m
          command: |
            set -euo pipefail
            cd apps/platform
            cp .env.example .env
            php artisan key:generate --force
            php artisan config:clear --ansi
            # Prove tests really ran: require a zero exit AND a reported pass count at or
            # above the number of test files, so an empty or skipped run cannot pass.
            rc=0
            php artisan test --no-ansi > /tmp/phpunit.out 2>&1 || rc=$?
            tail -n 40 /tmp/phpunit.out
            test "$rc" -eq 0
            passed=$(grep -E '^ *Tests:' /tmp/phpunit.out | tail -1 | grep -Eo '[0-9]+ passed' | grep -Eo '^[0-9]+' || true)
            echo "tests passed: ${passed:-none}"
            test "${passed:-0}" -ge 97

  owner_admin_preflight:
    docker:
      - image: cimg/php:8.4-node
    resource_class: small
    steps:
      - checkout
      - run:
          name: Immutable source identity and PHP syntax
          command: |
            set -euo pipefail
            test "$(git rev-parse HEAD)" = "$CIRCLE_SHA1"
            php -l apps/platform/routes/product-manager.php
            php -l apps/platform/routes/kslp-admin.php
            php -l apps/platform/tests/Feature/OwnerProductManagementWorkspaceTest.php
            php -l apps/platform/tests/Feature/OwnerLicensingCenterHttpTest.php
            php -l packages/domain-catalog/database/migrations/2026_10_14_000230_add_category_to_products_table.php
      - run:
          name: No-dependency admin source regression tests
          command: |
            set -euo pipefail
            cd apps/platform
            node --test scripts/check-owner-dashboard.test.mjs scripts/check-licensing-integration.test.mjs scripts/check-codebridge-safe-onboarding.test.mjs
            echo "KMJ_ADMIN_ZERO_INSTALL_PREFLIGHT_PASS=1"

  owner_admin_dependencies:
