            php -l apps/platform/tests/Feature/KslpDeveloperAppsTest.php
            php -l apps/platform/app/Services/Licensing/Kslp/KslpLicenseControlPlane.php
            node --test tests/kslp-javascript-first-use.test.mjs
            cd apps/platform
            node --test scripts/check-licensing-integration.test.mjs
            echo "KMJ_KSLP_SOURCE_PREFLIGHT_PASS=$CIRCLE_SHA1"

  kslp_authsp_python_sdk:
